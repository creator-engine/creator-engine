$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/devops-privileged-action-broker.schema.yaml"
title: "Creator Engine DevOps privileged-action broker envelope"
description: >-
  Value-free authority envelope for one broker-mediated privileged DevOps action.
  The envelope records a ratified, scoped grant; it never carries a password,
  private key, OpenBao token, wrapped token, OTP value, SSH private key, dynamic
  credential value, decrypted plaintext, or other secret payload.
type: object
oneOf:
  - required: [privileged_action_envelope]
properties:
  privileged_action_envelope:
    $ref: "#/$defs/privileged_action_envelope"
additionalProperties: false
$defs:
  timestamp:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  non_empty_string:
    type: string
    minLength: 1
    pattern: "\\S"
  ref_string:
    type: string
    minLength: 1
    maxLength: 512
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/#@+ -]{0,511}$"
  seat_id:
    type: string
    pattern: "^ce-dev-[1-9][0-9]*$"
  role:
    type: string
    enum: [operator, controller, architect, implementer, reviewer, verification, agent_reviewer]
  requester:
    type: object
    required: [seat_id, role, actor_ref]
    additionalProperties: false
    properties:
      seat_id:
        $ref: "#/$defs/seat_id"
      role:
        $ref: "#/$defs/role"
      actor_ref:
        $ref: "#/$defs/ref_string"
  capability:
    type: object
    required: [engine, operation, capability_ref, openbao_mount, mode]
    additionalProperties: false
    properties:
      engine:
        type: string
        enum:
          - openbao_ssh
          - openbao_transit
          - openbao_database
          - openbao_kubernetes
          - openbao_rabbitmq
          - openbao_cubbyhole
          - external_plugin
          - broker_internal
      operation:
        type: string
        enum:
          - ssh_sign_public_key
          - ssh_issue_otp
          - transit_encrypt
          - transit_decrypt
          - transit_sign
          - transit_verify
          - transit_hash_hmac_random
          - database_dynamic_credentials
          - kubernetes_service_account_token
          - rabbitmq_dynamic_credentials
          - response_wrap
          - broker_proxy_command
          - sidecar_template_secret
      capability_ref:
        $ref: "#/$defs/ref_string"
      openbao_mount:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
      mode:
        type: string
        enum:
          - signed_ssh_certificate
          - one_time_ssh_password
          - dynamic_credential
          - service_account_token
          - transit_operation
          - response_wrapped_payload
          - broker_policy_only
          - external_ephemeral_capability
  target:
    type: object
    required: [target_type, target_ref]
    additionalProperties: false
    properties:
      target_type:
        type: string
        enum:
          - host
          - container
          - filesystem_path
          - repository
          - cluster
          - database
          - message_broker
          - transit_key
          - provider_resource
          - service
      target_ref:
        $ref: "#/$defs/ref_string"
      target_path:
        type: string
        minLength: 1
        maxLength: 512
        pattern: "^/[^\\x00]*$"
      target_principal:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9_@.+-]+$"
      environment_ref:
        $ref: "#/$defs/ref_string"
  scope:
    type: object
    required: [allowed_actions, max_uses, constraints]
    additionalProperties: false
    properties:
      allowed_actions:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
            - read
            - write
            - edit_file
            - run_command
            - restart_service
            - sign_public_key
            - issue_otp
            - mint_dynamic_credential
            - decrypt
            - encrypt
            - sign
            - verify
            - proxy_request
      resource_refs:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/ref_string"
      filesystem_paths:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^/[^\\x00]*$"
      command_refs:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/non_empty_string"
      network_egress:
        type: string
        enum: [none, broker_only, target_only, scoped]
      max_uses:
        type: integer
        minimum: 1
        maximum: 20
      constraints:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/non_empty_string"
  ratification_ref:
    type: object
    required: [kind, ref, ratified_prompt_sha, ratifier_role, ratified_at]
    additionalProperties: false
    properties:
      kind:
        type: string
        enum: [issue, decision_record, scope_record, operator_envelope, pr_comment]
      ref:
        $ref: "#/$defs/ref_string"
      ratified_prompt_sha:
        $ref: "#/$defs/sha256"
      ratifier_role:
        type: string
        enum: [operator, source, ratifier]
      ratified_by:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
      ratified_at:
        $ref: "#/$defs/timestamp"
  execution:
    type: object
    required: [custody_mode, execution_mode, blast_radius, irreversible, reason]
    additionalProperties: false
    properties:
      custody_mode:
        type: string
        enum:
          - broker-mints-ephemeral
          - sidecar-templates-real-secret-into-tmpfs
      execution_mode:
        type: string
        enum:
          - broker-proxies
          - capability-handoff
      blast_radius:
        type: string
        enum: [benign, low, medium, high, irreversible]
      irreversible:
        type: boolean
      reason:
        $ref: "#/$defs/non_empty_string"
  audit_hook:
    type: object
    required: [hook_type, hook_ref, required]
    additionalProperties: false
    properties:
      hook_type:
        type: string
        enum:
          - side_effect_ledger
          - lease_revocation
          - openbao_audit
          - broker_audit
          - supervisor_audit
      hook_ref:
        $ref: "#/$defs/ref_string"
      required:
        type: boolean
  lease:
    type: object
    required: [lease_id, issued_at, expires_at, renewable]
    additionalProperties: false
    properties:
      lease_id:
        $ref: "#/$defs/ref_string"
      accessor_ref:
        anyOf:
          - $ref: "#/$defs/ref_string"
          - type: "null"
      issued_at:
        $ref: "#/$defs/timestamp"
      expires_at:
        $ref: "#/$defs/timestamp"
      revoke_ref:
        $ref: "#/$defs/ref_string"
      renewable:
        type: boolean
  metadata:
    type: object
    additionalProperties:
      anyOf:
        - type: string
          maxLength: 2048
        - type: integer
        - type: number
        - type: boolean
        - type: "null"
        - type: array
          maxItems: 32
          items:
            type: string
            maxLength: 512
  privileged_action_envelope:
    type: object
    required:
      - envelope_id
      - schema_version
      - task_id
      - requester
      - capability
      - target
      - scope
      - ttl_seconds
      - expires_at
      - ratification_ref
      - execution
      - audit_hooks
    additionalProperties: false
    properties:
      envelope_id:
        type: string
        pattern: "^pae-[a-z0-9][a-z0-9-]{3,96}$"
      schema_version:
        type: string
        const: "1"
      task_id:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9_#./:-]{0,127}$"
      requester:
        $ref: "#/$defs/requester"
      capability:
        $ref: "#/$defs/capability"
      target:
        $ref: "#/$defs/target"
      scope:
        $ref: "#/$defs/scope"
      ttl_seconds:
        type: integer
        minimum: 60
        maximum: 3600
      expires_at:
        $ref: "#/$defs/timestamp"
      ratification_ref:
        $ref: "#/$defs/ratification_ref"
      execution:
        $ref: "#/$defs/execution"
      audit_hooks:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/audit_hook"
      lease:
        $ref: "#/$defs/lease"
      metadata:
        $ref: "#/$defs/metadata"
