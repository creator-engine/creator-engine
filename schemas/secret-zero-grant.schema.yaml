$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/secret-zero-grant.schema.yaml"
title: SecretZeroGrant
type: object
additionalProperties: false
required:
  - grant_id
  - run_id
  - seat_id
  - role_name
  - auth_mount
  - issued_at
  - expires_at
  - delivery_ref
  - wrap_accessor_ref
  - wrapped_accessor_ref
  - audit_ref
  - revoked_at
properties:
  grant_id:
    type: string
    minLength: 1
  run_id:
    type: string
    minLength: 1
  seat_id:
    type: string
    pattern: "^dev-[1-9][0-9]*$"
  role_name:
    type: string
    pattern: "^ce-dev-[1-9][0-9]*$"
  auth_mount:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
  issued_at:
    type: string
    format: date-time
  expires_at:
    type: string
    format: date-time
  delivery_ref:
    type: string
    minLength: 1
    not:
      pattern: "^(env|file|prompt)://"
  wrap_accessor_ref:
    anyOf:
      - type: string
        minLength: 1
      - type: "null"
  wrapped_accessor_ref:
    anyOf:
      - type: string
        minLength: 1
      - type: "null"
  audit_ref:
    type: string
    minLength: 1
  revoked_at:
    anyOf:
      - type: string
        format: date-time
      - type: "null"
