$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/seat-class-policy.schema.yaml"
title: "Creator Engine Seat-Class Policy Record"
description: |
  Shape for the foreman-delegation Slice 1 policy. Every CE seat is born a
  foreman by default; governed policy records pin foreman posture and explicit
  dispatch surfaces. This schema is record-shape only. Live hook arming,
  worker spawning, action-count
  thresholds, and line-count thresholds are intentionally deferred.
type: object
required:
  - kind
  - schema_version
  - policy_id
  - policy_sha
  - seat_class
  - default_seat_class
  - recursion
  - delegation_required_mutation_classes
  - foreman_dispatch
unevaluatedProperties: false
properties:
  kind:
    type: string
    const: seat-class-policy-record
  schema_version:
    type: string
    enum: ["1"]
  policy_id:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
  policy_sha:
    type: string
    pattern: "^[0-9a-f]{64}$"
    description: |
      Opaque digest of the ratified policy content. This is not a credential.
  seat_class:
    type: string
    const: foreman
    description: |
      Launch-pinned class for governed seats. Valid policy records are foreman
      by construction; unknown/absent runtime values resolve to foreman in the
      pure resolver and later live hook wiring.
  default_seat_class:
    type: string
    const: foreman
    description: |
      Born-a-foreman default. The record may not weaken this default.
  recursion:
    type: object
    required: [foreman_of_foreman_allowed, max_depth]
    unevaluatedProperties: false
    properties:
      foreman_of_foreman_allowed:
        type: boolean
        default: true
      max_depth:
        type: integer
        minimum: 1
  delegation_required_mutation_classes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [docs, code, schema, deploy, governance, identity, security, attestation, redaction]
  coordination_path_prefixes:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  foreman_dispatch:
    type: object
    required: [launch_pinned, contract_ref, roles]
    unevaluatedProperties: false
    properties:
      launch_pinned:
        type: boolean
        const: true
        description: |
          Dispatch authority is pinned at launch and may not be inferred from
          mutable runtime posture.
      contract_ref:
        type: string
        minLength: 1
        description: |
          Contract or policy artifact that defines the foreman's dispatch duty.
      roles:
        type: object
        required: [researcher, implementer, reviewer]
        unevaluatedProperties: false
        properties:
          researcher:
            $ref: "#/$defs/dispatch_role"
          implementer:
            $ref: "#/$defs/dispatch_role"
          reviewer:
            $ref: "#/$defs/dispatch_role"

$defs:
  dispatch_role:
    type: object
    required: [dispatch_surface]
    unevaluatedProperties: false
    properties:
      dispatch_surface:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
