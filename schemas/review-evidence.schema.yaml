$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/review-evidence.schema.yaml"
title: "Creator Engine Review Evidence Record"
description: |
  Machine-readable schema for an independent review evidence record
  authored under the Creator Engine delivery control plane.

  Prose contract: `docs/contracts/review-evidence.md`.
  Upstream template contract: `docs/delivery/REVIEW_EVIDENCE_TEMPLATE.md`.

  A review evidence record captures what an independent reviewer
  observed about a specific mutation, against which mutation classes
  and prohibited surfaces, and what their non-ratifying verdict was.

  Review evidence is NOT Source ratification. The `verdict` enum is
  constrained to evidence-only outcomes; the
  `non_ratification_statement` field is mandatory and MUST restate
  that this record does not authorize merge, deploy, branch
  deletion, branch protection mutation, or live repository-settings
  change.

  Concrete reviewer product, model, CLI, SaaS account, runner,
  source-host application, bot slug, or QA harness identifiers MUST
  NOT appear here as normative upstream bindings; those are
  deployment-time overlay decisions. Real secrets, tokens,
  credentials, source-host installation ids, durable actor ids, app
  slugs, account names, and machine-local absolute paths MUST NOT
  appear here.
type: object
required:
  - evidence_id
  - reviewed_artifact_refs
  - reviewed_diff_or_commit_ref
  - reviewer_identity_ref
  - reviewer_role_category
  - review_mode
  - review_scope
  - mutation_classes_under_review
  - prohibited_surfaces_checked
  - validation_evidence_refs
  - findings
  - blocking_findings
  - non_blocking_findings
  - verdict
  - recommended_follow_up
  - evidence_timestamp
  - non_ratification_statement
unevaluatedProperties: false
properties:
  evidence_id:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    minLength: 1
    description: |
      Stable repo-relative identifier for this evidence record,
      unique within a tenant overlay.
  reviewed_artifact_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: |
      Repo-relative paths to artifacts under review (spec, plan,
      tasks, code, docs, validator output, etc.).
  reviewed_diff_or_commit_ref:
    type: string
    minLength: 1
    description: |
      Reference to the diff range or commit-ish under review. For
      pre-merge review, the working diff range; for post-merge
      review, the merged commit-ish.
  reviewer_identity_ref:
    type: string
    minLength: 1
    description: |
      Repo-relative path to the ratified reviewer identity record
      under which this evidence is authored.
  reviewer_role_category:
    type: string
    const: reviewer
    description: |
      Fixed to `reviewer`. Records with any other `role_category`
      are not governed review evidence under this contract.
  review_mode:
    type: string
    enum: [manual_human, manual_agent, mixed_human_and_agent]
    description: |
      Generic review-mode label. Concrete tool/model/CLI selection
      is a deployment-time overlay decision and MUST NOT be
      hard-coded as an upstream binding here.
  review_scope:
    type: string
    minLength: 1
    description: |
      Human-readable scope statement naming in-scope and
      out-of-scope items for this evidence.
  mutation_classes_under_review:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
    description: |
      Mutation classes that the change under review touches, per
      `docs/contracts/mutation-class-taxonomy.md`.
  prohibited_surfaces_checked:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: |
      Prohibited-surface labels the reviewer affirmatively checked
      (e.g., `live_repository_settings`, `branch_protection`,
      `deploy_automation`, `codeowners`, `secrets_or_tokens`,
      `instance_local_paths`).
  validation_evidence_refs:
    type: array
    items:
      type: string
      minLength: 1
    description: |
      Repo-relative paths or command-result references the reviewer
      consulted (validator runs, CI output references, attestation
      paths). External tracker URLs are non-canonical and MAY appear
      only as advisory references.
  findings:
    type: string
    minLength: 1
    description: |
      Free-text body of observations.
  blocking_findings:
    type: array
    items:
      type: object
      required: [artifact_ref, rule_violated, recommended_remediation]
      unevaluatedProperties: false
      properties:
        artifact_ref:
          type: string
          minLength: 1
        rule_violated:
          type: string
          minLength: 1
        recommended_remediation:
          type: string
          minLength: 1
    description: |
      Structured findings that, per the review gate, prevent
      advancement past the gate without remediation. MAY be empty
      only when `verdict` is `no_blocking_findings` or when the
      verdict explicitly declines to enumerate findings (e.g.,
      `cannot_review`).
  non_blocking_findings:
    type: array
    items:
      type: object
      required: [artifact_ref, observation, advisory_follow_up]
      unevaluatedProperties: false
      properties:
        artifact_ref:
          type: string
          minLength: 1
        observation:
          type: string
          minLength: 1
        advisory_follow_up:
          type: string
          minLength: 1
    description: |
      Advisory findings (style, future-work suggestions, scope
      clarifications) that do not, by themselves, prevent
      advancement.
  verdict:
    type: string
    enum:
      - no_blocking_findings
      - blocking_findings_present
      - scope_boundary_unclear
      - cannot_review
    description: |
      Evidence-only outcome. The schema MUST NOT accept any verdict
      value that implies the reviewer can ratify, approve merge,
      waive a privileged gate, modify branch protection, run or
      modify deploy automation, or apply live repository settings.
  recommended_follow_up:
    type: string
    description: |
      Free-text recommendations for follow-up work (separate
      envelopes, future slices, deferred items). MAY be empty when
      there is no follow-up recommendation.
  evidence_timestamp:
    description: |
      Either an ISO-8601 timestamp (e.g.,
      `2026-05-17T12:00:00Z`) or a source-controlled timestamp
      reference (e.g., `commit:<sha>` or a repo-relative path
      naming a commit-bound evidence file). A machine-local clock
      value MUST NOT be presented as authoritative.
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
  non_ratification_statement:
    type: string
    minLength: 1
    description: |
      Explicit textual statement that this review evidence is NOT
      Source ratification and does not authorize merge, deploy,
      branch deletion, branch protection mutation, or live
      repository-settings change. Its absence is itself a
      `blocking_findings` condition under
      `docs/delivery/REVIEW_GATE.md`.
