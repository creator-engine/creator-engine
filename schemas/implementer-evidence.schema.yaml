$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/implementer-evidence.schema.yaml"
title: "Creator Engine Implementer Evidence Record"
description: |
  Machine-readable schema for an implementer evidence record
  authored under the Creator Engine delivery control plane.

  Prose contract: `docs/contracts/implementer-evidence.md`.

  An implementer evidence record captures what a governed
  implementer executed under a Source-ratified implementer-class
  envelope: the implementation subject, the authored artifacts and
  their file-boundary acknowledgement, the validation/test evidence
  the implementer produced, any deviations from the envelope, and
  an explicit non-ratification / non-authority statement.

  Implementer evidence is NOT Source ratification, NOT review
  evidence, and NOT architect evidence. The implementer retains
  authoring/execution parity only; ratification, approval to merge,
  branch deletion, branch protection mutation, deploy authorization,
  live repository-settings change, provider/tool/model/host/account
  binding, tenant binding, and authority expansion remain Source-only
  per Feature 001 FR-008 and the Batch 2A §6.3 ratified
  authority-boundary posture.

  The `verdict` enum is constrained to implementer-evidence-only
  outcomes; the `non_ratification_statement` field is mandatory and
  MUST restate that this record does not authorize merge, deploy,
  branch deletion, branch protection mutation, live
  repository-settings change, provider/tool/model/host/account
  binding, tenant binding, or authority expansion, and does not
  substitute for review evidence or architect evidence.

  Concrete implementer product, model, CLI, SaaS account, runner,
  source-host application, bot slug, or tooling identifiers MUST
  NOT appear here as normative upstream bindings; those are
  deployment-time overlay decisions. Real secrets, tokens,
  credentials, source-host installation ids, durable actor ids,
  app slugs, account names, and machine-local absolute paths MUST
  NOT appear here.
type: object
required:
  - evidence_id
  - implementation_subject
  - authored_artifact_refs
  - allowed_path_boundary_refs
  - implementer_identity_ref
  - implementer_role_category
  - execution_mode
  - implementation_scope
  - mutation_classes_executed
  - prohibited_surfaces_acknowledged
  - validation_evidence_refs
  - test_evidence_refs
  - implementation_summary
  - deviations
  - open_questions
  - verdict
  - recommended_follow_up
  - evidence_timestamp
  - non_ratification_statement
unevaluatedProperties: false
properties:
  evidence_id:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    minLength: 1
    description: |
      Stable repo-relative identifier for this evidence record,
      unique within a tenant overlay.
  implementation_subject:
    type: string
    minLength: 1
    description: |
      Human-readable statement of the implementation subject the
      implementer executed (e.g., the schema, validator surface,
      template, contract, or code change authored under the
      Source-ratified implementer-class envelope).
  authored_artifact_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: |
      Repo-relative paths to artifacts the implementer authored or
      updated under this envelope (schema, validator check, test,
      template, prose contract, example, delivery doc, etc.).
      External tracker URLs are non-canonical and MUST NOT appear
      here.
  allowed_path_boundary_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: |
      Repo-relative paths declared as the allowed authoring boundary
      for the envelope (the path manifest the implementer was
      authorized to touch). Every entry in `authored_artifact_refs`
      MUST also be inside this boundary; the implementer affirms
      that no path outside this boundary was modified. The
      schema does not infer the boundary from the runtime; it MUST
      be declared explicitly here.
  implementer_identity_ref:
    type: string
    minLength: 1
    description: |
      Repo-relative path to the ratified implementer identity record
      under which this evidence is authored.
  implementer_role_category:
    type: string
    const: implementer
    description: |
      Fixed to `implementer`. Records with any other `role_category`
      are not governed implementer evidence under this contract.
  execution_mode:
    type: string
    enum: [manual_human, manual_agent, mixed_human_and_agent]
    description: |
      Generic execution-mode label. Concrete tool/model/CLI
      selection is a deployment-time overlay decision and MUST NOT
      be hard-coded as an upstream binding here.
  implementation_scope:
    type: string
    minLength: 1
    description: |
      Human-readable scope statement naming in-scope and
      out-of-scope items for this implementer evidence.
  mutation_classes_executed:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
    description: |
      Mutation classes the executed change touches, per
      `docs/contracts/mutation-class-taxonomy.md`. Naming a
      privileged class here does NOT authorize the mutation; the
      privileged-class envelope still requires Source ratification
      per Feature 001 FR-008. The implementer asserts only that
      the executed change is bounded to the named classes.
  prohibited_surfaces_acknowledged:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: |
      Prohibited-surface labels the implementer affirmatively
      acknowledged are out of execution scope under this envelope
      (e.g., `live_repository_settings`, `branch_protection`,
      `deploy_automation`, `codeowners`, `secrets_or_tokens`,
      `instance_local_paths`, `authority_matrix_baseline`,
      `mutation_class_taxonomy_baseline`,
      `provider_tool_model_host_account_binding`,
      `tenant_binding`, `authority_expansion`). The implementer
      does not execute these surfaces under implementer-evidence
      framing.
  validation_evidence_refs:
    type: array
    items:
      type: string
      minLength: 1
    description: |
      Repo-relative paths or command-result references the
      implementer produced as validation evidence (validator runs,
      CLI output references, attestation paths). External tracker
      URLs are non-canonical and MAY appear only as advisory
      references. MAY be empty when the envelope explicitly
      authorizes implementation with no validator surface to run.
  test_evidence_refs:
    type: array
    items:
      type: string
      minLength: 1
    description: |
      Repo-relative paths or command-result references the
      implementer produced as test evidence (unit test files,
      integration test files, pytest run references). MAY be
      empty when the envelope explicitly authorizes implementation
      with no test surface to run.
  implementation_summary:
    type: string
    minLength: 1
    description: |
      Free-text body summarizing what the implementer executed and
      why. The body MUST be sufficient for a fresh-clone reviewer
      to understand the executed change independently of the
      implementer's authoring session and MUST be sufficient for
      Source to perform ratification independently.
  deviations:
    type: array
    items:
      type: object
      required: [deviation_id, summary, justification, remediation_status]
      unevaluatedProperties: false
      properties:
        deviation_id:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          minLength: 1
        summary:
          type: string
          minLength: 1
        justification:
          type: string
          minLength: 1
        remediation_status:
          type: string
          enum:
            - remediated_in_envelope
            - deferred_to_follow_up
            - unresolved
    description: |
      Structured enumeration of deviations from the envelope
      (boundary adjustments requested, ambiguities encountered,
      scope clarifications applied, expected-fail behavior of
      malformed examples documented as expected, etc.). MAY be
      empty when execution proceeded without deviation. Naming a
      deviation here does NOT authorize a boundary expansion; an
      `unresolved` or `deferred_to_follow_up` deviation is a signal
      for Source review and MUST NOT be treated as silent
      ratification.
  open_questions:
    type: array
    items:
      type: string
      minLength: 1
    description: |
      Open questions the implementer surfaced for Source review.
      MAY be empty when the implementer has no open questions.
  verdict:
    type: string
    enum:
      - implementation_complete
      - implementation_partial
      - scope_boundary_unclear
      - cannot_implement
    description: |
      Implementer-evidence-only outcome. The schema MUST NOT
      accept any verdict value that implies the implementer can
      ratify, approve merge, waive a privileged gate, modify
      branch protection, run or modify deploy automation, apply
      live repository settings, bind a provider/tool/model/host/
      account or tenant, expand authority, or substitute for
      review evidence or architect evidence.
  recommended_follow_up:
    type: string
    description: |
      Free-text recommendations for follow-up work (separate
      envelopes, future slices, deferred items, downstream review
      and ratification). MAY be empty when there is no follow-up
      recommendation.
  evidence_timestamp:
    description: |
      Either an ISO-8601 timestamp (e.g.,
      `2026-05-17T12:00:00Z`) or a source-controlled timestamp
      reference (e.g., `commit:<sha>` or a repo-relative path
      naming a commit-bound evidence file). A machine-local clock
      value MUST NOT be presented as authoritative.
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
  non_ratification_statement:
    type: string
    minLength: 1
    description: |
      Explicit textual statement that this implementer evidence is
      NOT Source ratification and does not authorize merge,
      deploy, branch deletion, branch protection mutation, live
      repository-settings change, provider/tool/model/host/account
      binding, tenant binding, or authority expansion, and does
      not substitute for review evidence or architect evidence.
      Its absence is itself a contract violation under
      `docs/contracts/implementer-evidence.md`.
