$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/pcl-record.schema.yaml"
title: "Creator Engine PCL (Project Coordination Ledger) record substrate"
description: >-
  G2.004.0 schema for shape-only PCL records. PCL is the per-repo authoritative
  Project Coordination Ledger. Records are content-addressed and hash-chained and
  are discriminated by record_kind. PCL records never ratify. Live append/verify
  runtime (ce pcl), .ce/pcl/ live writes, signing, and key custody remain
  deferred to G2.004.1.
type: object
oneOf:
  - required: [pcl_record]
  - required: [pcl_chain]
properties:
  pcl_record:
    $ref: "#/$defs/record"
  pcl_chain:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/record"
additionalProperties: false
$defs:
  hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
  timestamp:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  record:
    type: object
    required: [record_id, record_kind, sequence, parent_hash, content_hash, emitting_role, operating_mode, recorded_at, body, signature]
    properties:
      record_id:
        type: string
        pattern: "^pcl-[a-z0-9][a-z0-9-]{3,96}$"
      record_kind:
        type: string
        enum: [lane_claim, lane_release, gate_opened, gate_closed, completion_report_pointer, event_block_pointer, directive_pack_published, identity_assertion]
      sequence:
        type: integer
        minimum: 0
      parent_hash:
        anyOf:
          - $ref: "#/$defs/hash"
          - type: "null"
      content_hash:
        $ref: "#/$defs/hash"
      emitting_role:
        type: string
        enum: [operator, controller, architect, implementer, reviewer, verification, agent_reviewer]
      operating_mode:
        type: string
        enum: [strict, auto, transcendence]
      recorded_at:
        $ref: "#/$defs/timestamp"
      body:
        type: object
        additionalProperties: true
      signature:
        type: object
        required: [scheme, key_id, value]
        properties:
          scheme:
            type: string
            enum: [reserved-shape-only]
          key_id:
            type: string
            minLength: 1
          value:
            type: string
            enum: [reserved-inactive]
        additionalProperties: false
    additionalProperties: false
