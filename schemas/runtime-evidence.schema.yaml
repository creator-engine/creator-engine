$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/runtime-evidence.schema.yaml"
title: "Creator Engine Runtime Evidence Chain"
description: |
  Machine-readable schema for a hash-chained Runtime Evidence chain — the
  tamper-evident, append-only, content-addressed audit spine for one Creator
  Engine agent seat's runtime lifecycle (plane C / runtime safety, v3 G-1.3a).

  Prose contract: `docs/contracts/runtime-evidence.md`.

  Each record is content-addressed (`content_hash` = SHA256 of the canonical
  record material excluding `content_hash` itself) and chain-linked
  (`prev_hash`); the genesis record's `prev_hash` is the all-zero SHA256
  sentinel and `sequence` is contiguous from 0. Every record binds to the exact
  runtime-policy it attests via `policy_sha`. This discipline mirrors the landed
  `ce-event-block` and side-effect-ledger hash chains; the PURE append/verify
  substrate is
  `validators/creator_engine_validator/runtime_evidence_spine.py`.

  G-1.3a boundary statement: this schema and its `ce_runtime_evidence` dogfood
  check validate the *record shape and chain integrity* of static evidence
  files only. They do NOT allocate a container, invoke a runner backend, build
  or push an image, open a network socket, or tap a live runtime. The
  classifier + audit overlay that *produces* these records over the
  RunnerBackend provision/run/collect/teardown lifecycle is the deferred G-1.3b
  slice; an OpenShell backend is a later fast-follow behind the same adapter.

  Defensive posture: this contract makes the Creator Engine's own runtime audit
  trail tamper-evident; it is never an offensive capability. The `policy_sha`
  binding and the content-address + chain-link + sequence invariants are
  enforced mechanically by the `ce_runtime_evidence` check.

  Concrete host, port, credential, account, or registry identifiers MUST NOT
  appear in a record as normative bindings; evidence records carry hashes,
  phase/classification enums, and shape-only references.
type: object
required:
  - kind
  - record_type
  - schema_version
  - records
unevaluatedProperties: false
properties:
  kind:
    type: string
    const: runtime-evidence-chain
    description: |
      Discriminator constant. Files that do not carry this exact value are not
      governed Runtime Evidence chains and MUST NOT be validated by the
      `ce_runtime_evidence` check.
  record_type:
    type: string
    const: runtime_evidence_chain
    description: |
      Sub-discriminator for the chain wrapper. G-1.3a defines exactly one
      chain shape; later slices MAY add additive record types under a new
      `schema_version`.
  schema_version:
    type: string
    enum: ["1"]
    description: |
      Runtime Evidence schema version. G-1.3a ships v1; later slices MAY extend
      additively without breaking v1 readers.
  records:
    type: array
    minItems: 1
    items:
      oneOf:
        - $ref: "#/$defs/runtime_evidence_record"
        - $ref: "#/$defs/runtime_run_outcome_record"
        - $ref: "#/$defs/runtime_ratification_record"
    description: |
      The ordered, append-only record chain. Element 0 is the genesis record
      (`prev_hash` = the all-zero sentinel, `sequence` = 0); each subsequent
      record links to its predecessor by `prev_hash` and increments `sequence`.
      Each element is a lifecycle `runtime_evidence_record` (the
      `provision`/`run`/`collect`/`teardown` container-phase attestations), a
      terminal `runtime_run_outcome_record` (the typed run-OUTCOME on the
      orthogonal disposition axis), OR a `runtime_ratification_record` (the typed
      run-RATIFICATION attestation); the branches are mutually exclusive (a
      record's `kind`/`record_type` consts + its `lifecycle_phase`/`outcome`/
      `approver_ref` discriminating fields select exactly one branch).
  note:
    type: string
    maxLength: 1024
    description: |
      Optional free-text note. Advisory only; MUST NOT contain secrets,
      tokens, credentials, or actor ids.
$defs:
  runtime_evidence_record:
    type: object
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - lifecycle_phase
      - classification
      - recorded_at
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-evidence-record
      record_type:
        type: string
        const: runtime_evidence
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` (SHA256 hex digest) of the runtime-policy record
          this evidence attests. The schema REQUIRES presence; the
          `ce_runtime_evidence` check enforces the exact `^[0-9a-f]{64}$`
          shape and emits `runtime_evidence_policy_unbound` when it is absent
          or malformed — a record MUST be anchored to its policy. (Kept loose
          at the schema layer, like `runtime-policy`'s `image_ref.sha`, so the
          check can emit a precise contract error.)
      run_id:
        type: string
        minLength: 1
        description: |
          The provisioning run this record belongs to (the runner adapter's
          `run_id` / `ProvisionedHandle.run_id`). Binds the chain to one seat
          provisioning. Shape only.
      sequence:
        type: integer
        minimum: 0
        description: |
          Monotonic position in the chain, contiguous from 0 at genesis. The
          check refuses a non-contiguous sequence (reorder / truncation).
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          The predecessor record's `content_hash`. The genesis record uses the
          all-zero SHA256 sentinel. The check refuses a `prev_hash` that does
          not match the prior record's content address (broken hash chain).
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          SHA256 of the canonical record material excluding `content_hash`
          itself. The check recomputes and refuses any mismatch (mutation).
      lifecycle_phase:
        type: string
        enum: [provision, run, collect, teardown]
        description: |
          The RunnerBackend lifecycle phase this record attests.
      classification:
        type: string
        enum: [allowed, denied, escalate]
        description: |
          The classifier verdict category for the attested event. The
          classifier that ASSIGNS this is the deferred G-1.3b audit overlay;
          G-1.3a fixes only the record shape.
      recorded_at:
        type: string
        minLength: 1
        description: |
          Timestamp the record was produced (an input; never read from the
          wall clock inside the pure substrate). Shape only.
      backend_key:
        type: string
        minLength: 1
        description: |
          Optional: the runner backend that produced the evidence (e.g.
          `gvisor-proxy`). Shape only.
      summary:
        type: string
        maxLength: 1024
        description: |
          Optional advisory summary. MUST NOT contain secrets or credentials.
  runtime_run_outcome_record:
    type: object
    description: |
      A typed terminal run-OUTCOME record (v3 G-3.6a). It attests WHERE a run
      ended — its terminal disposition — on an axis ORTHOGONAL to the container
      `lifecycle_phase`. Outcomes are plural and work-type-dependent (a run may
      open a PR, submit a review, deliver research, or change nothing); modelling
      the outcome as a `lifecycle_phase` value would conflate the two axes, so the
      outcome is its own record type, NEVER a `lifecycle_phase`. It is appended to
      the SAME hash chain (content-addressed + chain-linked + policy-bound) so the
      terminal disposition is itself tamper-evident. The v3 MVP produces only
      `pr_opened`; the other `outcome` values are reserved vocabulary.
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - recorded_at
      - outcome
      - change_set
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-run-outcome
      record_type:
        type: string
        const: runtime_run_outcome
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` of the runtime-policy the run attests, identical to the
          lifecycle records' binding (the check enforces `^[0-9a-f]{64}$` and emits
          `runtime_evidence_policy_unbound` when absent or malformed).
      run_id:
        type: string
        minLength: 1
      sequence:
        type: integer
        minimum: 0
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      recorded_at:
        type: string
        minLength: 1
      outcome:
        type: string
        enum: [pr_opened, review_submitted, research_delivered, no_change]
        description: |
          The run's terminal disposition (the run-OUTCOME axis). Plural +
          extensible; the v3 MVP produces only `pr_opened`. NEVER a
          `lifecycle_phase` value.
      change_set:
        type: object
        description: |
          The value-free pointer to the change the run produced. Carries only
          shape references (branch / base / manifest paths / head sha + optional
          PR number) — NO diff, NO secret, and NO host/credential/account/registry
          identifier as a normative binding.
        required:
          - branch
          - base
          - manifest_paths
          - head_sha
        unevaluatedProperties: false
        properties:
          branch:
            type: string
            minLength: 1
          base:
            type: string
            minLength: 1
          manifest_paths:
            type: array
            items:
              type: string
              minLength: 1
          head_sha:
            type: string
            minLength: 1
          pr_number:
            type: integer
            minimum: 1
  runtime_ratification_record:
    type: object
    description: |
      A typed run-RATIFICATION record (v3 G-3.7.2a). It attests that a run was
      RATIFIED — the CE-owned, SHA-pinned, single-use ratification that authorizes
      the run to act — appended to the SAME tamper-evident hash chain
      (content-addressed + chain-linked + policy-bound) so the authorization itself
      is auditable. It is its OWN record type on a dimension ORTHOGONAL to the
      container `lifecycle_phase` and the run `outcome`, and is NEVER a
      `lifecycle_phase` value. It is VALUE-FREE: it carries only opaque digests
      (`approver_ref`, `ratified_prompt_sha`, `binding_ref`) plus the pinned git
      `ratified_head_sha` (a content-address) and the policy/run ids — NEVER a raw
      account/login, host, credential/token, or installation identifier in clear
      (repo/installation/permissions identity is folded into the opaque
      `binding_ref`). The runtime head-SHA assertion (G-3.7.2b) consumes
      `ratified_head_sha` (+ a recomputed `binding_ref`) to REFUSE drift before any
      `apply=True` side effect.
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - recorded_at
      - ratified_prompt_sha
      - approver_ref
      - ratified_head_sha
      - binding_ref
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-ratification
      record_type:
        type: string
        const: runtime_ratification
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` of the runtime-policy the run attests, identical to the
          lifecycle/outcome records' binding (the check enforces `^[0-9a-f]{64}$`
          and emits `runtime_evidence_policy_unbound` when absent or malformed).
      run_id:
        type: string
        minLength: 1
      sequence:
        type: integer
        minimum: 0
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      recorded_at:
        type: string
        minLength: 1
      ratified_prompt_sha:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          The SHA256 digest of the ratified Source prompt — the SHA-pinned
          ratification this run is bound to. An opaque digest, never the prompt body.
      approver_ref:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          An OPAQUE digest standing in for the approving actor (e.g. a salted hash
          of the account). NEVER a raw account/login — preserving the
          no-identifier-in-evidence invariant.
      ratified_head_sha:
        type: string
        minLength: 1
        description: |
          The git head SHA the ratification pins (a content-address, the shape the
          `runtime_run_outcome_record.change_set.head_sha` uses). The G-3.7.2b
          assertion refuses to act when the runtime head differs from this.
      binding_ref:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          An OPAQUE digest of the normative {repo, installation_id, permissions,
          ratified_head_sha} tuple, so the repo/installation/permission identity is
          bound WITHOUT any account/installation identifier appearing in clear; the
          assertion recomputes and compares it.
