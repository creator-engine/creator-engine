$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/active-work-ledger.schema.yaml"
title: "Creator Engine Active-Work Ledger Record"
description: |
  Machine-readable schema for a single Active-Work Ledger record
  authored under the Creator Engine Parallel Controller Orchestration
  (PCO) substrate.

  Prose contract:
  `docs/operations/ACTIVE_WORK_LEDGER_PROTOCOL.md`.

  Architectural companion:
  `docs/architecture/parallel-controller-orchestration.md`.

  Feature spec:
  `specs/005-pco-parallel-controller-orchestration/spec.md`.

  An Active-Work Ledger record is one of three structural kinds —
  `claim`, `heartbeat`, or `event` — that together let multiple
  Source-ratified Controllers coordinate isolated lanes of work
  without colliding on worktrees, branches, or Assignment Envelopes.

  Slice 0 boundary statement: this schema and its validator skeleton
  record and validate ledger entries one record at a time. Slice 1/2
  adds the separate `active_work_ledger_conflicts` validator check for
  cross-record/pre-launch invariants (live worktree collisions, live
  lane uniqueness per controller, heartbeat claim references, event
  claim references, heartbeat sequence monotonicity where timestamps
  are parseable, and scoped event-id uniqueness). This schema still
  does NOT allocate worktrees, does NOT launch multi-controller
  execution, and does NOT encode concrete model/tool/SaaS/account
  bindings. Enforcement beyond those read-only pre-launch checks is
  reserved for later PCO slices (worktree allocator, pane registry,
  side-effect ledger, `pco-fanin`, integration queue).

  The tracked schema (this file) is distinct from local runtime
  state. Ledger records live under the untracked runtime directory
  `.hermes/active-work-ledger/` and MUST NOT be added to the index.

  Concrete tool, model, CLI, SaaS account, runner, source-host
  application, bot slug, or QA-harness identifiers MUST NOT appear
  here as normative upstream bindings; those remain
  deployment-time overlay decisions per
  `docs/delivery/REVIEWER_IDENTITY_REQUIREMENTS.md` §c precedent.
  Real secrets, tokens, credentials, source-host installation ids,
  durable actor ids, app slugs, account names, and machine-local
  absolute paths beyond `worktree_path` (which is required and
  treated as advisory, not as a secret) MUST NOT appear in ledger
  records.
type: object
required:
  - kind
  - record_type
  - schema_version
  - controller_id
  - lane_id
  - record_timestamp
unevaluatedProperties: false
properties:
  kind:
    type: string
    const: active-work-ledger-record
    description: |
      Discriminator constant. Records that do not carry this exact
      value are not governed Active-Work Ledger records under this
      contract and MUST NOT be validated by the
      `active_work_ledger_schema` check.
  record_type:
    type: string
    enum: [claim, heartbeat, event]
    description: |
      Sub-discriminator selecting which structural record shape
      applies. Drives the `oneOf` per-shape required-field sets.
  schema_version:
    type: string
    enum: ["1", "2", "3"]
    description: |
      Active-Work Ledger schema version. Slice 0 ships v1; Slice 0.5
      adds four event_kind values (`gate_opened`, `gate_closed`,
      `completion_report_emitted`, `gate_blocked`) as an additive
      extension and accepts records carrying either version. Slice
      2I-S adds three container event kinds (`container_started`,
      `container_stopped`, `container_force_reaped`) and accepts v1,
      v2, or v3 records. Older readers ignore unknown event kinds; v3
      readers accept all three sets. Later slices MAY extend further
      via additional additive optional fields and a further version
      bump.
  controller_id:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
    description: |
      Stable identifier for the driving Controller (e.g.,
      `hermes-primary`, `nefarious-laptop-a`). Stable per physical
      operator+host pair. MUST NOT embed secrets, tokens,
      installation ids, durable actor ids, model identifiers, or
      account names.
  lane_id:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
    description: |
      Coordination unit identifier. Typically
      `<feature-or-slice>-<short-suffix>`.
  record_timestamp:
    description: |
      Either an ISO-8601 UTC timestamp (e.g.,
      `2026-05-20T03:30:30Z`) or a source-controlled reference
      (`commit:<sha>` or `source-controlled:<repo-relative-path>`).
      A machine-local clock value MUST NOT be presented as
      authoritative. Mirrors the `evidence_timestamp` shape in
      `schemas/review-evidence.schema.yaml`.
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
  # Claim-only fields
  worktree_path:
    type: string
    minLength: 1
    description: |
      Repo-relative or absolute path of the physical worktree the
      claim names. Treated as advisory (not a secret), but required
      on every `claim` record so that the one-driver-per-worktree
      rule can be checked. Required on `claim` records.
  branch:
    type: string
    minLength: 1
    description: |
      Optional branch name on which the claim is currently
      operating. Recommended but not required; pre-worktree
      planning lanes MAY omit this.
  envelope_ref:
    description: |
      Repo-relative path to the Assignment Envelope under whose
      authority the lane is operating, or the literal `none` for
      coordination lanes that operate without an envelope (e.g.,
      architect-only planning). Required on `claim` records. The
      envelope, not the ledger, remains the substantive authority.
    oneOf:
      - type: string
        minLength: 1
        pattern: "^[A-Za-z0-9_./-]+$"
      - type: string
        const: none
  handoff_ref:
    type: string
    minLength: 1
    description: |
      Optional repo-relative path to the active handoff document
      under whose stop line the lane is operating.
  recommended_prompt_ref:
    type: string
    minLength: 1
    description: |
      Optional repo-relative path to the active recommended-prompt
      document the lane is executing.
  lease_seconds:
    type: integer
    minimum: 60
    maximum: 86400
    description: |
      Lease duration in seconds. Default value documented in the
      protocol (3600); the schema validates the range only. A
      heartbeat older than `lease_seconds` past `last_heartbeat_at`
      makes the claim stale (advisory in Slice 0). Required on
      `claim` records.
  claimed_at:
    description: |
      ISO-8601 UTC timestamp (or source-controlled reference) at
      which the claim was created. Same shape as
      `record_timestamp`. Required on `claim` records.
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
  last_heartbeat_at:
    description: |
      ISO-8601 UTC timestamp (or source-controlled reference) of
      the most recent heartbeat the Controller emitted for this
      claim. For fresh claims, equals `claimed_at`. Same shape as
      `record_timestamp`. Required on `claim` records.
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
  pane_label:
    type: string
    minLength: 1
    enum: [architect, implementer, controller, reviewer]
    description: |
      Optional human-readable label of the visible pane this claim
      describes. Generic role label only; NOT a model, tool, CLI,
      account, or runner binding.
  released_at:
    description: |
      Optional ISO-8601 UTC timestamp (or source-controlled
      reference) at which the claim was closed. When present, the
      claim is considered released and `release_reason` MUST also
      be present.
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
  release_reason:
    type: string
    enum: [completed, aborted, lapsed, handed_off]
    description: |
      Required iff `released_at` is present. Records why the claim
      ended.
  # Heartbeat-only fields
  claim_ref:
    type: string
    minLength: 1
    description: |
      Repo-relative path to the claim file this heartbeat updates.
      Required on `heartbeat` records.
  heartbeat_sequence:
    type: integer
    minimum: 0
    description: |
      Per-claim monotonically non-decreasing sequence counter.
      The schema validates type and lower-bound only. Slice 1/2's
      `active_work_ledger_conflicts` check enforces cross-record
      monotonicity for heartbeat records that reference the same claim
      and have parseable `emitted_at` timestamps. Required on
      `heartbeat` records.
  emitted_at:
    description: |
      ISO-8601 UTC timestamp (or source-controlled reference) at
      which the heartbeat was emitted. Same shape as
      `record_timestamp`. Required on `heartbeat` records.
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
  note:
    type: string
    maxLength: 1024
    description: |
      Optional free-text status note. Advisory only; MUST NOT
      contain secrets, tokens, credentials, or actor ids. Slice 0
      does not enforce this prohibition mechanically.
  # Event-only fields
  event_kind:
    type: string
    enum:
      - claim_created
      - claim_released
      - claim_lapsed
      - heartbeat_emitted
      - lane_handoff_announced
      - lane_handoff_received
      - gate_opened
      - gate_closed
      - completion_report_emitted
      - gate_blocked
      - container_started
      - container_stopped
      - container_force_reaped
    description: |
      Event log discriminator. Required on `event` records. The
      Slice 0 set (`claim_created`, `claim_released`, `claim_lapsed`,
      `heartbeat_emitted`, `lane_handoff_announced`,
      `lane_handoff_received`) is preserved. Slice 0.5 adds four
      additive completion-report-substrate event kinds:
        * `gate_opened` — a Source-ratified gate began under a
          recorded envelope+SHA;
        * `gate_closed` — a Source-ratified gate ended without
          blocker (completed or partial);
        * `completion_report_emitted` — a Completion Report artifact
          was appended for this lane / gate, optionally pointed at
          via `details.completion_report_ref`;
        * `gate_blocked` — a Source-ratified gate was blocked or
          aborted; pairs with a class-F Completion Report.
      Slice 2I-S adds three additive container-substrate event kinds:
        * `container_started` — `allocate_worker` started a
          container instance bound to a claim under a ratified
          worker-container policy; `details.instance_id` and
          `details.claim_id` name the instance and claim;
        * `container_stopped` — `terminate_worker` stopped the
          container and reaped its process tree; `details.instance_id`,
          `details.exit_code`, and `details.reason` record the
          termination;
        * `container_force_reaped` — `garbage_collect_worker` reaped
          a container that outlived its claim; `details.instance_id`
          and `details.elapsed_since_release_seconds` record the
          event.
      Slice 2I-S event kinds travel with `schema_version: "3"`.
      v1 and v2 records continue to validate unchanged.
  event_id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]{2,63}$"
    description: |
      Event identifier. Stable within
      `(controller_id, lane_id, YYYY-MM-DD)` scope. The schema
      validates shape only; Slice 1/2's `active_work_ledger_conflicts`
      check enforces scoped uniqueness when `event_timestamp` can be
      resolved to a day. Required on `event` records.
  event_timestamp:
    description: |
      ISO-8601 UTC timestamp (or source-controlled reference) at
      which the event occurred. Same shape as `record_timestamp`.
      Required on `event` records.
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
  subject_claim_ref:
    type: string
    minLength: 1
    description: |
      Optional repo-relative path to a claim file the event
      describes (e.g., for `claim_created` / `claim_released` /
      `claim_lapsed` / `heartbeat_emitted`).
  subject_handoff_ref:
    type: string
    minLength: 1
    description: |
      Optional repo-relative path to a handoff document the event
      references (used for `lane_handoff_announced` /
      `lane_handoff_received`).
  details:
    type: object
    unevaluatedProperties: false
    properties:
      summary:
        type: string
        minLength: 1
        maxLength: 1024
        description: |
          Short human-readable summary of the event.
      actor_pane_label:
        type: string
        enum: [architect, implementer, controller, reviewer]
        description: |
          Generic role label of the pane that produced the event.
          NOT a model/tool/account binding.
      completion_report_ref:
        type: string
        minLength: 1
        pattern: "^[A-Za-z0-9_./-]+$"
        description: |
          Optional repo-relative path to a Completion Report
          artifact this event pairs with. Used by Slice 0.5
          event kinds `completion_report_emitted` and `gate_blocked`
          to bind the event log to the schema-validated report
          packet.
      instance_id:
        type: string
        pattern: "^[a-z][a-z0-9-]{2,63}$"
        description: |
          Optional container-instance identifier. Used by Slice 2I-S
          event kinds `container_started`, `container_stopped`, and
          `container_force_reaped`.
      claim_id:
        type: string
        pattern: "^[a-z][a-z0-9-]{2,63}$"
        description: |
          Optional claim identifier the container event is associated
          with. Used by Slice 2I-S container event kinds.
      exit_code:
        type: integer
        description: |
          Optional process exit code for `container_stopped` events.
      reason:
        type: string
        enum:
          - normal_release
          - claim_lapsed
          - validator_refusal
          - operator_abort
          - force_reap
        description: |
          Optional termination reason for `container_stopped` and
          `container_force_reaped` events.
      force_reaped_at:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
        description: |
          Optional timestamp for `container_force_reaped` events
          recording when garbage collection ran.
      elapsed_since_release_seconds:
        type: integer
        minimum: 0
        description: |
          Optional elapsed seconds since the claim was released,
          for `container_force_reaped` events.
    description: |
      Optional structured event details. Slice 0 keeps this surface
      narrow; Slice 0.5 adds `completion_report_ref`; Slice 2I-S
      adds optional container-event detail fields (`instance_id`,
      `claim_id`, `exit_code`, `reason`, `force_reaped_at`,
      `elapsed_since_release_seconds`). All are additive optional
      fields; prior records continue to validate unchanged.
oneOf:
  - description: |
      Claim record shape — required when `record_type == claim`.
    properties:
      record_type:
        const: claim
    required:
      - worktree_path
      - envelope_ref
      - lease_seconds
      - claimed_at
      - last_heartbeat_at
  - description: |
      Heartbeat record shape — required when
      `record_type == heartbeat`.
    properties:
      record_type:
        const: heartbeat
    required:
      - claim_ref
      - heartbeat_sequence
      - emitted_at
  - description: |
      Event record shape — required when `record_type == event`.
    properties:
      record_type:
        const: event
    required:
      - event_kind
      - event_id
      - event_timestamp
