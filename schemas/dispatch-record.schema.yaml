$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/dispatch-record.schema.yaml"
title: "Creator Engine Dispatch Record"
description: |
  Machine-readable schema for a single dispatch record — the on-disk handoff a
  `cev3 drive --spawn` materializes from a ratified Scope's assembled
  `coordination.DispatchPlan` (v3.1-G1 live-spawn keystone). One record lives
  per run under `<v3-local-state>/dispatches/<run_id>/dispatch.yaml`, alongside
  the run's `runtime-policy.yaml` (read AS DATA by the v1 launch leg) and
  `brief.md` (the seat mandate).

  Boundary statement: the bridge (`creator_engine_validator/v3_seat_bridge.py`)
  crosses to the proven v1 spawn mechanics as SUBPROCESS + DATA only
  (`ce launch --json` → files + argv + JSON), importing NO v1 module — so the
  v1⊥v3 HARD invariant + the ratchet stay untouched. This schema defines the
  record SHAPE only; the bridge mints it and stamps the value-free launch
  evidence after the spawn, and `cev3 collect` marks `collected_at`.

  Value-free: a dispatch record carries the scope/run ids, the mutation class,
  opaque ratification digests, the launch SHAPE (terminal pane ids, the resource
  bound stamp), and shape-only refs — NEVER a credential, secret value, raw
  account, host, or installation id.
type: object
required:
  - kind
  - record_type
  - schema_version
  - scope_id
  - run_id
  - mutation_class
  - harness
  - unattended
  - session
  - window
unevaluatedProperties: false
properties:
  kind:
    type: string
    const: dispatch-record
    description: |
      Discriminator constant. Records that do not carry this exact value are not
      governed dispatch records.
  record_type:
    type: string
    const: dispatch
  schema_version:
    type: string
    enum: ["1"]
  scope_id:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
    description: |
      The ratified Scope this run was dispatched from (same slug pattern as the
      Scope record).
  run_id:
    type: string
    minLength: 1
    description: |
      The minted run identity (`run-<scope_id>-<utcstamp>`). Stable key for the
      dispatch dir and the run's evidence chain
      (`<v3-local-state>/runs/<run_id>.runtime-evidence.yaml`).
  mutation_class:
    type: string
    enum: [docs, code, schema, deploy, governance, identity, security, attestation, redaction, none]
    description: |
      The blast-radius/severity tier conserved from the Scope — drives the back
      gate (mutation_class-tiered human ratification).
  scope_ratification:
    $ref: "#/$defs/scope_ratification"
    description: |
      The value-free opaque digests carried through from the assembled plan
      (the front-gate bet). NEVER a raw account.
  harness:
    type: string
    enum: [claude, codex]
    description: |
      The seat harness. `claude` remains the default stronger Ring-1-hook-pack
      path. `codex` is explicit, low-risk guarded, and externally-gate-governed;
      this schema does not claim Codex Ring-1 parity.
  harness_boundary:
    type: string
    enum: [claude_ring1_hookpack, codex_external_gate]
    description: |
      Governance boundary label for the selected harness. `codex_external_gate`
      means credential scrub + external forge/review/merge gates are load-bearing;
      it is not a Ring-1-equivalent claim.
  unattended:
    type: boolean
    description: |
      Whether the seat is spawned unattended (default true). When true the
      bridge appends `--claude-arg=--dangerously-skip-permissions`; CC-D-6 stays
      the gate on the v1 side (an unconfirmed hook-pack is a fail-closed refusal),
      because for a governed seat the Ring-1 hook-pack — not the harness approval
      modal — is the enforced boundary.
  session:
    type: string
    minLength: 1
    description: |
      The tmux session the v1 leg spawns the seat into.
  window:
    type: string
    minLength: 1
    description: |
      The tmux window the seat occupies.
  runtime_policy_ref:
    type: string
    minLength: 1
    description: |
      Shape-only ref to the run's `runtime-policy.yaml` (the merged policy with
      the appetite→cap run envelope) — read AS DATA by the v1 launch leg via
      `--runtime-policy`. A path ref, never the policy body.
  brief_ref:
    type: string
    minLength: 1
    description: |
      Shape-only ref to the seat mandate `brief.md` (the pointer target the tmux
      seed line names). A path ref, never the brief body.
  terminal:
    oneOf:
      - type: "null"
      - $ref: "#/$defs/terminal"
    description: |
      The value-free launch evidence stamped after the spawn: the tmux
      session/window/pane ids the v1 `LaunchResult` returned. Null before spawn.
  resource_bound:
    oneOf:
      - type: "null"
      - type: string
      - type: object
    description: |
      The v3.5-F resource-bound stamp from the v1 launch plan (the applied
      systemd scope/unit + fleet cap, or a `none (<enforcement>)` opt-down
      string). Null when the seat was launched unbounded with no stamp.
  spawned_at:
    oneOf:
      - type: "null"
      - type: string
        minLength: 1
    description: |
      UTC stamp the seat was spawned (`%Y%m%dT%H%M%SZ`). Null before spawn.
  collected_at:
    oneOf:
      - type: "null"
      - type: string
        minLength: 1
    description: |
      UTC stamp `cev3 collect` folded the run's evidence chain. Null until the
      run is collected. A LIVE (spawned, uncollected, non-failure-stamped)
      dispatch projects the Scope to Build/RUN.
  spawn_failed_at:
    oneOf:
      - type: "null"
      - type: string
        minLength: 1
    description: |
      UTC stamp the v1 launch leg (or the brief seed) was REFUSED. Fail-closed: a
      dispatch carrying this stamp was materialized but never became a live run,
      so the read-model never projects it as Build/RUN. The failed attempt is
      conserved (stamped, never deleted) — a failure is evidence. Absent on a
      clean spawn.
  spawn_failure_reason:
    oneOf:
      - type: "null"
      - type: string
        minLength: 1
    description: |
      The value-free refusal text for `spawn_failed_at` (the same message
      surfaced to the operator) — NEVER a credential/host/account. Absent on a
      clean spawn.
  change:
    $ref: "#/$defs/change"
    description: |
      v3.1-G2a: the value-free pointer to the PR a `cev3 pr --apply` opened for
      this run's authored branch (stamped by `v3_forge_join.open_change_for_run`).
      Shape refs ONLY — branch / base / pr_number / head_sha / manifest_paths /
      opened_at — NEVER a credential, token, App id, or installation id. Absent
      until a PR is opened (a run may end at research_delivered / no_change with
      no `change` block); `cev3 collect` derives the `change_set` + `pr_opened`
      outcome from it when present.
  role:
    type: string
    enum: [implementer, reviewer]
    description: |
      v3.1-G2b: the seat role. ABSENT = the G1 implementer dispatch (an authoring
      seat). `reviewer` marks a distinct CE-governed reviewer venue (provisioned
      by `v3_seat_bridge.materialize_review_dispatch` + `spawn_review_venue`),
      whose authority is the reviewer-authority envelope referenced in `review_of`.
  review_of:
    $ref: "#/$defs/review_of"
    description: |
      v3.1-G2b: present ONLY on a `role: reviewer` dispatch. The value-free pointer
      back to the author run + the PR under review + the reviewer-authority envelope
      path — NEVER a credential, token, or reviewer login (the login lives in the
      envelope FILE, which the Ring-1 hook records; the record carries only the ref).
  harness_session_id:
    type: string
    minLength: 1
    description: |
      v3.1-G2f (F9): the harness session id minted at MATERIALIZE time (a random
      UUIDv4 — value-free, no credential/host/account) and stamped onto the seat's
      `--claude-arg=--session-id`, so the harness writes its transcript at a KNOWN
      key (`<claude-config-dir>/projects/*/<harness_session_id>.jsonl`). `cev3
      collect` resolves the transcript by this exact key — never by mtime guess —
      machine-blocking the #14/#21 orchestrator-transcript mis-fold. OPTIONAL:
      pre-G2f records carry no id and collect conserves its prior behavior. For
      Codex records this is the `session_meta.payload.id` stamped after the Codex
      transcript appears.
  transcript_ref:
    type: string
    minLength: 1
    description: |
      G1-codex: spawn-stamped shape-only path ref to the Codex JSONL transcript.
      `cev3 collect` uses this as the primary Codex transcript locator, then falls
      back to an exact `session_meta.payload.id` lookup under `~/.codex/sessions/`.
  codex_bypass_mode:
    type: string
    enum: [config, argv]
    description: |
      G1-codex: records how CDX-D-6 was accounted for: verified live
      `~/.codex/config.toml` posture (`config`) or explicit live Codex bypass flag
      on argv (`argv`). It does not assert Ring-1 parity.
  codex_risk_override:
    type: string
    pattern: "^[0-9a-fA-F]{64}$"
    description: |
      Optional value-free ratification digest recording that the Operator accepted
      the weaker Codex in-band boundary for a high-risk mutation class. Never a raw
      account, token, host, or installation id.
  transcript_source:
    type: string
    enum: [stamped, operator_override, unstamped]
    description: |
      v3.1-G2f (F9): the honesty marker `cev3 collect` stamps at fold time
      recording HOW the folded transcript was located. `stamped` = resolved by the
      `harness_session_id` exact key (or an explicit `--transcript` whose stem
      matched it); `operator_override` = folded via `--transcript-override` despite
      no/mismatched id (the loud salvage path); `unstamped` = a pre-G2f record with
      no id (today's behavior conserved). OPTIONAL: absent until collect folds.
  seat_env_file_ref:
    type: string
    minLength: 1
    description: |
      v3.1-G2f (F4/D2): shape-only PATH ref to the seat env file the venue sourced
      via the `--seat-env-file` exec-wrap. A path ref ONLY — the credential VALUE
      never enters argv, the tmux server, the Pane Registry, or this record (the
      value-free discipline; only the file path is recorded). Absent when no
      seat-env file was used.
  events_ref:
    type: string
    minLength: 1
    description: |
      ce-ops#26: shape-only PATH ref to this seat's append-only lifecycle events
      surface (`<v3-local-state>/dispatches/<run_id>/events.jsonl`), stamped by the
      bridge from the v1 `LaunchResult` after the spawn. A path ref ONLY — the
      launcher's supervisor (not the seat's model) writes the file, so a silently
      dying seat still records its `exited` event. OPTIONAL: pre-#26 records carry
      no ref, and a reader unions its absence harmlessly.
  conserve:
    type: boolean
    description: |
      ce-ops#43: the conserved-evidence marker. When `true`, the dispatch (and the
      venue/worktree/transcript bound to it) is EVIDENCE and the seat/venue reaper
      treats it as an ABSOLUTE stop — no teardown, no `pco-release`, no worktree
      removal, no pane kill, and no archive mutation unless an explicit later
      operator action requests it. Absence/`false` means the dispatch is not
      conserved (the reaper may archive-then-retire per its classification).
  conserve_reason:
    type: string
    minLength: 1
    description: |
      ce-ops#43: the value-free operator/policy reason a dispatch is conserved
      (the same short text surfaced to the operator) — NEVER a credential, host,
      account, or installation id. Present only alongside `conserve: true`.
  conserved_at:
    type: string
    minLength: 1
    description: |
      ce-ops#43: RFC3339 UTC stamp the conserve marker was applied. Present only
      alongside `conserve: true`. The reaper never mutates it.
$defs:
  change:
    type: object
    required: [branch, base, pr_number, manifest_paths, opened_at]
    unevaluatedProperties: false
    properties:
      branch:
        type: string
        minLength: 1
        description: The seat-authored head branch the PR was opened for.
      base:
        type: string
        minLength: 1
        description: The target branch the PR merges into (e.g. `main`).
      pr_number:
        type: integer
        minimum: 1
        description: The opened/claimed PR number (push = claim; one PR per branch).
      head_sha:
        oneOf:
          - type: "null"
          - type: string
            pattern: "^[0-9a-f]{7,40}$"
        description: |
          The PR head commit sha (the value the merge head-pins). Null only when
          the forge did not return a head on open.
      manifest_paths:
        type: array
        items:
          type: string
          minLength: 1
        description: The authorized path-set this change carries (the carrier mirror).
      opened_at:
        type: string
        minLength: 1
        description: UTC stamp the PR was opened (`%Y-%m-%dT%H:%M:%SZ`).
      base_sha:
        oneOf:
          - type: "null"
          - type: string
            pattern: "^[0-9a-f]{7,40}$"
        description: |
          F6 Phase-0 (OPTIONAL, additive): the base-branch commit SHA observed
          when the change identity was stamped. The base-only re-stamp proof
          recomputes the old change identity from (`base_sha`, `head_sha`); a
          change block without it is `legacy unprovable` and is refused (NEVER
          silently overridden). `cev3 collect` propagates it into the chain's
          `pr_opened` change_set. Pre-F6 records carry no `base_sha`.
      head_tree_sha:
        type: string
        pattern: "^[0-9a-f]{7,40}$"
        description: |
          F6 Phase-0 (OPTIONAL): the git tree SHA of `head_sha` at stamp time
          (a content-address for the post-merge tree audit).
      content_diff_id:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          F6 Phase-0 (OPTIONAL): SHA256 over the normalized non-mechanical diff
          across the authorized paths — the content identity proved unchanged on
          a base-only re-stamp.
      patch_id_stable:
        type: string
        pattern: "^[0-9a-f]{7,64}$"
        description: |
          F6 Phase-0 (OPTIONAL): git stable patch-id over the same normalized
          diff (order-independent of base motion) — proved unchanged on a
          base-only re-stamp.
      manifest_paths_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          F6 Phase-0 (OPTIONAL): the normalized path-set hash (the carrier
          canonicalization rule) — proved unchanged on a base-only re-stamp.
      proof_inputs_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          F6 Phase-0 (OPTIONAL): a digest over the exact inputs the identity
          was computed from, so the re-stamp decision is reproducible.
  review_of:
    type: object
    required: [author_run_id, pr_number, envelope_ref]
    unevaluatedProperties: false
    properties:
      author_run_id:
        type: string
        minLength: 1
        description: The authoring run whose PR this venue reviews.
      pr_number:
        type: integer
        minimum: 1
        description: The PR the venue is authorized to review.
      envelope_ref:
        type: string
        minLength: 1
        description: |
          Shape-only path ref to the reviewer-authority envelope file (one
          `pr_review` mechanic on this one PR). A path ref, never the envelope body
          and never the reviewer login it carries.
  scope_ratification:
    type: object
    required: [approver_ref, ratified_scope_sha]
    unevaluatedProperties: false
    properties:
      approver_ref:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          An OPAQUE digest standing in for the ratifying actor. NEVER a raw
          account/login.
      ratified_scope_sha:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          The SHA256 digest of the ratified Scope content the bet is pinned to.
  terminal:
    type: object
    required: [session_id, window_id, pane_id]
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        description: The terminal kind (e.g. `tmux`).
      session_id:
        type: string
        minLength: 1
        description: The tmux session id (an opaque handle, e.g. `$1`).
      window_id:
        type: string
        minLength: 1
        description: The tmux window id (an opaque handle, e.g. `@2`).
      pane_id:
        type: string
        minLength: 1
        description: The tmux pane id (an opaque handle, e.g. `%3`).
