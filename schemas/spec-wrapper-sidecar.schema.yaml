$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/spec-wrapper-sidecar.schema.yaml"
title: "Creator Engine Spec Wrapper Sidecar"
type: object
required:
  - id
  - title
  - tenant
  - owner_role
  - status
  - spec_type
  - mutation_class
  - permitted_actions
  - scope
  - acceptance_criteria
  - verification
  - ratification_required
  - identity_policy_ref
unevaluatedProperties: false
properties:
  id:
    type: string
    minLength: 1
  title:
    type: string
    minLength: 1
  tenant:
    type: string
    minLength: 1
  owner_role:
    type: string
    minLength: 1
  status:
    type: string
    enum: [draft, ready, in_progress, verified, ratified, done]
  spec_type:
    type: string
    enum: [decision_record, implementation_spec, research_report, handoff, retro, test_spec, tenant_config]
  mutation_class:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
  permitted_actions:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  scope:
    type: string
    minLength: 1
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  verification:
    type: object
    required: [method, evidence_refs]
    unevaluatedProperties: false
    properties:
      method:
        type: string
        minLength: 1
      evidence_refs:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
  ratification_required:
    type: boolean
  identity_policy_ref:
    type: string
    minLength: 1
  attestation_record_ref:
    type: string
    minLength: 1
  ratification_record_ref:
    type: string
    minLength: 1
