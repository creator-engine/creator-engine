$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/state-version-record.schema.yaml"
title: "Creator Engine State Version / Migration Record"
description: |
  RV1-022 State Version / Migration record shape for future `.hermes/` local
  state migrations in the Creator Engine v1.0 local governed runtime kernel
  (PCO v1 Gate 2).

  Prose contract:
  `docs/operations/STATE_BOUNDARY_PROTOCOL.md`.

  The record is declarative and validated only: it documents the version of a
  `.hermes/` state namespace and the status of any migration. It must not
  perform migrations.
type: object
required:
  - kind
  - schema_version
  - state_namespace
  - state_version
  - migration_id
  - migration_status
  - record_timestamp
unevaluatedProperties: false
properties:
  kind:
    type: string
    const: state-version-record
  schema_version:
    type: string
    const: "1"
  description:
    type: string
    maxLength: 2048
  state_namespace:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
  state_version:
    type: integer
    minimum: 0
  migration_id:
    type: string
    pattern: "^(none|[a-z0-9][a-z0-9-]{2,127})$"
  migration_status:
    type: string
    enum: [not-required, pending, applied, blocked]
  record_timestamp:
    $ref: "#/$defs/timestamp"
$defs:
  timestamp:
    oneOf:
      - type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"
      - type: string
        pattern: "^commit:[0-9a-f]{7,40}$"
      - type: string
        pattern: "^source-controlled:[A-Za-z0-9_./-]+$"
