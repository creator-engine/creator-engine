# Creator Engine v1.0 — agent-native bootstrap (RV1-064).
#
# Machine-readable bootstrap contract for an agent harness preparing to run the
# local governed runtime kernel (`ce`). It is read-only configuration consumed
# by an agent; it grants no hosted/team-mode/GitHub authority and starts no
# daemon. Clone-mode provisions a target venv from the checkout and vendored
# wheelhouse, then runs the installed `ce`/`cev3` scripts; a non-zero preflight
# yields a blocked report and stops (there is no hidden fallback).
#
# Prose contract: docs/operations/AGENT_NATIVE_BOOTSTRAP.md
kind: agent-native-bootstrap
schema_version: "1"
product: creator-engine
product_version: "1.0"

authority_model:
  direction: one-directional
  # Authority flows one way: Operator/Controller seat -> launched agent lane.
  # The agent lane never gains authority over the Controller seat and never
  # escalates to hosted/team/GitHub authority; it returns results as evidence
  # for ratification only.
  hosted_team_github_authority: false
  description: >-
    Authority transfers one-directionally from the host-local Operator/Controller
    seat to the launched agent lane. The lane cannot ratify its own work, cannot
    promote itself to a hosted/team/GitHub authority, and hands all results back
    to the Controller seat as evidence for ratification.

install:
  contract: source-bootstrap-offline-installed-app
  python_floor: ">=3.14"
  validator_python_env: CE_VALIDATOR_PYTHON
  validator_python_default: .venv/bin/python
  dependency_wheelhouse: validators/wheelhouse
  source_path: validators
  network: forbidden
  installed_scripts: [ce, cev3]
  uv_first:
    - ["uv", "venv", "--python", "3.14"]
  pip_fallback:
    - ["python3.14", "-m", "venv", ".venv"]
  bootstrap:
    command: ["${CE_VALIDATOR_PYTHON:-.venv/bin/python}", "-m", "creator_engine_validator.bootstrap_runtime", "bootstrap", "--repo-root", ".", "--venv", ".venv", "--json"]
    env:
      CE_VALIDATOR_PYTHON: "${CE_VALIDATOR_PYTHON:-.venv/bin/python}"
      PYTHONPATH: validators
    offline_installer_preference: ["uv pip install --python", "python -m pip", "python -m ensurepip --upgrade then pip"]
    remediation: "Run ce bootstrap --repo-root . --venv .venv after creating the target venv."

preflight:
  command: [".venv/bin/ce", "doctor", "--repo-root", ".", "--venv", ".venv", "--json"]
  env:
    CE_VALIDATOR_PYTHON: "${CE_VALIDATOR_PYTHON:-.venv/bin/python}"
  required: true
  requires: [install]
  on_failure: blocked-report
  blocked_report:
    stop: true
    semantics: >-
      If the doctor preflight exits non-zero, the bootstrap MUST stop and emit
      a blocked report that names the refused governed-environment guard clauses
      (RED-G-1 .. RED-G-6) and target seat-env failures (CE-SEAT-ENV). It MUST
      NOT continue, MUST NOT ratify in-flight work, and MUST NOT fall back to a
      hidden/headless continuation.

launch:
  command: [".venv/bin/ce", "launch", "--json"]
  env:
    CE_VALIDATOR_PYTHON: "${CE_VALIDATOR_PYTHON:-.venv/bin/python}"
  visible: true
  hidden_fallback: false
  hud_alias: [".venv/bin/ce", "hud", "--json"]

boundaries:
  hosted_service: false
  team_mode: false
  github_connector: false
  daemon: false
  network_at_runtime: false

references:
  - docs/operations/AGENT_NATIVE_BOOTSTRAP.md
  - docs/governance/V1_PRODUCT_CONTRACT.md
  - docs/governance/V1_GOVERNED_ENVIRONMENT_GUARD_REQUIREMENT.md
  - docs/operations/GOVERNED_LANE_LAUNCH_PROTOCOL.md
