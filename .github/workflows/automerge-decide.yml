name: CE Automerge Decide

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Validate]
    types: [completed]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  decide:
    name: Advisory automerge decision
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.event == 'pull_request'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted decision code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run' && github.event.repository.default_branch ||
              github.event_name == 'merge_group' && github.event.merge_group.base_sha ||
              github.event.pull_request.base.sha
            }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record trusted repo revision
        id: trusted
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Install validator
        run: python -m pip install -e validators

      - name: Materialize automerge policy
        env:
          CE_AUTOMERGE_RUN_MODE: ${{ vars.CE_AUTOMERGE_RUN_MODE || '' }}
          CE_AUTOMERGE_ENABLING_REF: ${{ vars.CE_AUTOMERGE_ENABLING_REF || '' }}
          CE_AUTOMERGE_KILL_SWITCH: ${{ vars.CE_AUTOMERGE_KILL_SWITCH || '' }}
          CE_AUTOMERGE_TIER_CARRIER_CHANGELOG: ${{ vars.CE_AUTOMERGE_TIER_CARRIER_CHANGELOG || '' }}
          CE_AUTOMERGE_TIER_BRAIN_SUPERSEDE: ${{ vars.CE_AUTOMERGE_TIER_BRAIN_SUPERSEDE || '' }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          from creator_engine_validator.forge.automerge_policy import (
              materialize_automerge_policy_state_from_variables,
          )

          materialize_automerge_policy_state_from_variables(
              Path(".ce/state/automerge/policy.json"),
              run_mode_variable=os.environ.get("CE_AUTOMERGE_RUN_MODE"),
              enabling_ref_variable=os.environ.get("CE_AUTOMERGE_ENABLING_REF"),
              kill_switch_variable=os.environ.get("CE_AUTOMERGE_KILL_SWITCH"),
              tier_carrier_changelog_variable=os.environ.get("CE_AUTOMERGE_TIER_CARRIER_CHANGELOG"),
              tier_brain_supersede_variable=os.environ.get("CE_AUTOMERGE_TIER_BRAIN_SUPERSEDE"),
          )
          PY

      - name: Resolve changed paths
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login || '' }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref || '' }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref || '' }}
        run: |
          set -euo pipefail

          work_dir="${RUNNER_TEMP}/ce-automerge-decide"
          mkdir -p "${work_dir}"
          paths_file="${work_dir}/changed-paths.txt"
          pr_number=""
          head_sha=""
          branch=""
          base_ref=""
          review_decision=""
          author_login=""
          approver_login=""

          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "pull_request_review" || "${EVENT_NAME}" == "workflow_run" ]]; then
            if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
              if [[ "${WORKFLOW_RUN_EVENT}" != "pull_request" ]]; then
                echo "workflow_run predecessor was not a pull_request event" >&2
                exit 1
              fi
              if [[ ! "${WORKFLOW_RUN_HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "workflow_run did not provide a valid head SHA" >&2
                exit 1
              fi

              mapfile -t payload_pr_numbers < <(python - "${EVENT_PATH}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          pull_requests = payload.get("workflow_run", {}).get("pull_requests", [])
          if not isinstance(pull_requests, list):
              raise SystemExit("workflow_run.pull_requests must be an array")
          numbers = []
          for pull_request in pull_requests:
              if not isinstance(pull_request, dict):
                  raise SystemExit("workflow_run pull request entry must be an object")
              number = pull_request.get("number")
              if not isinstance(number, int) or number <= 0:
                  raise SystemExit("workflow_run pull request number must be a positive integer")
              if number not in numbers:
                  numbers.append(number)
          for number in numbers:
              print(number)
          PY
          )

              if [[ "${#payload_pr_numbers[@]}" -eq 1 ]]; then
                pr_number="${payload_pr_numbers[0]}"
              elif [[ "${#payload_pr_numbers[@]}" -eq 0 ]]; then
                associated_prs="${work_dir}/associated-prs.json"
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "repos/${REPO}/commits/${WORKFLOW_RUN_HEAD_SHA}/pulls" \
                  > "${associated_prs}"
                pr_number="$(python - "${associated_prs}" "${WORKFLOW_RUN_HEAD_SHA}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_head = sys.argv[2].lower()
          if not isinstance(payload, list):
              raise SystemExit("commit-associated pull request response must be an array")
          matches = []
          for pull_request in payload:
              if not isinstance(pull_request, dict):
                  continue
              head = pull_request.get("head")
              number = pull_request.get("number")
              if (
                  isinstance(head, dict)
                  and str(head.get("sha") or "").lower() == expected_head
                  and isinstance(number, int)
                  and number > 0
                  and number not in matches
              ):
                  matches.append(number)
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one commit-associated pull request, found {len(matches)}"
              )
          print(matches[0])
          PY
          )"
              else
                echo "workflow_run identified multiple pull requests; refusing ambiguous decision" >&2
                exit 1
              fi
            elif [[ "${EVENT_NAME}" == "pull_request_review" ]]; then
              pr_number="${PR_NUMBER}"
              if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
                echo "pull_request_review did not provide a valid pull request number" >&2
                exit 1
              fi
              if [[ ! "${PR_HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "pull_request_review did not provide a valid reviewed head SHA" >&2
                exit 1
              fi
            else
              pr_number="${PR_NUMBER}"
              head_sha="${PR_HEAD_SHA}"
              base_sha="${PR_BASE_SHA}"
              branch="${PR_HEAD_REF}"
              base_ref="${PR_BASE_REF}"
              author_login="${PR_AUTHOR_LOGIN}"
              if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
                echo "pull request event did not provide a valid pull request number" >&2
                exit 1
              fi
              if [[ ! "${head_sha}" =~ ^[0-9a-fA-F]{40}$ || ! "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "pull request event did not provide valid head and base SHAs" >&2
                exit 1
              fi
              if [[ -z "${branch}" || -z "${base_ref}" || -z "${author_login}" || "${branch}" == *$'\n'* || "${branch}" == *$'\r'* || "${base_ref}" == *$'\n'* || "${base_ref}" == *$'\r'* || "${author_login}" == *$'\n'* || "${author_login}" == *$'\r'* ]]; then
                echo "pull request event provided an invalid ref or author" >&2
                exit 1
              fi
            fi

            if [[ "${EVENT_NAME}" == "pull_request_review" || "${EVENT_NAME}" == "workflow_run" ]]; then
              if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
                echo "could not resolve a valid live pull request number" >&2
                exit 1
              fi

              pr_json="${work_dir}/pr.json"
              gh api "repos/${REPO}/pulls/${pr_number}" > "${pr_json}"
              mapfile -d '' -t pr_fields < <(python - "${pr_json}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          pull_request = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(pull_request, dict):
              raise SystemExit("pull request response must be an object")

          head = pull_request.get("head")
          base = pull_request.get("base")
          user = pull_request.get("user")
          if not isinstance(head, dict) or not isinstance(base, dict) or not isinstance(user, dict):
              raise SystemExit("pull request response omitted head, base, or user")

          values = [
              str(pull_request.get("number") or ""),
              str(head.get("sha") or ""),
              str(base.get("sha") or ""),
              str(head.get("ref") or ""),
              str(base.get("ref") or ""),
              str(user.get("login") or ""),
          ]
          if not re.fullmatch(r"[1-9][0-9]*", values[0]):
              raise SystemExit("live pull request number is invalid")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", values[1]):
              raise SystemExit("live pull request head SHA is invalid")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", values[2]):
              raise SystemExit("live pull request base SHA is invalid")
          if any(not value or "\n" in value or "\r" in value for value in values[3:]):
              raise SystemExit("live pull request ref or author is invalid")
          for value in values:
              sys.stdout.write(value)
              sys.stdout.write("\0")
          PY
          )

              if [[ "${#pr_fields[@]}" -ne 6 ]]; then
                echo "could not normalize live pull request inputs" >&2
                exit 1
              fi
              if [[ "${pr_fields[0]}" != "${pr_number}" ]]; then
                echo "live pull request number did not match the requested pull request" >&2
                exit 1
              fi

              head_sha="${pr_fields[1]}"
              base_sha="${pr_fields[2]}"
              branch="${pr_fields[3]}"
              base_ref="${pr_fields[4]}"
              author_login="${pr_fields[5]}"

              if [[ "${EVENT_NAME}" == "workflow_run" && "${head_sha,,}" != "${WORKFLOW_RUN_HEAD_SHA,,}" ]]; then
                echo "workflow_run head SHA no longer matches the live pull request head" >&2
                exit 1
              fi
              if [[ "${EVENT_NAME}" == "pull_request_review" && "${head_sha,,}" != "${PR_HEAD_SHA,,}" ]]; then
                echo "pull_request_review head SHA no longer matches the live pull request head" >&2
                exit 1
              fi
            fi

            gh pr view "${pr_number}" \
              --json files \
              --jq '.files[].path' \
              > "${paths_file}"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            head_sha="${GITHUB_SHA}"
            base_sha="${MERGE_GROUP_BASE_SHA}"
            branch="${MERGE_GROUP_HEAD_REF}"
            base_ref="${MERGE_GROUP_BASE_REF}"

            if ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${head_sha}"
            fi
            if [[ -n "${base_sha}" ]] && ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base_sha}" || true
            fi

            if [[ -n "${base_sha}" ]] && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git diff --name-only --find-renames "${base_sha}..${head_sha}" > "${paths_file}"
            else
              git diff --name-only --find-renames "${head_sha}^..${head_sha}" > "${paths_file}"
            fi
          else
            echo "unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi

          if [[ -z "${head_sha}" ]]; then
            echo "could not resolve head SHA" >&2
            exit 1
          fi

          {
            echo "paths-file=${paths_file}"
            echo "pr-number=${pr_number}"
            echo "head-sha=${head_sha}"
            echo "branch=${branch}"
            echo "base=${base_sha}"
            echo "review-decision=${review_decision}"
            echo "author-login=${author_login}"
            echo "approver-login=${approver_login}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve live PR automerge inputs
        id: live
        if: ${{ steps.inputs.outputs.pr-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          work_dir="${RUNNER_TEMP}/ce-automerge-live"
          mkdir -p "${work_dir}"
          pr_json="${work_dir}/pr.json"
          checks_raw="${work_dir}/checks-raw.json"
          checks_json="${work_dir}/checks.json"
          printf '{"checks":{}}\n' > "${checks_json}"

          emit_empty() {
            {
              echo "review-decision="
              echo "approver-login="
              echo "declared-work-class="
              echo "checks-json-file=${checks_json}"
            } >> "${GITHUB_OUTPUT}"
          }

          if [[ -z "${PR_NUMBER}" ]]; then
            emit_empty
            exit 0
          fi

          if ! gh pr view "${PR_NUMBER}" \
            --repo "${REPO}" \
            --json reviewDecision,latestReviews,body \
            > "${pr_json}"; then
            emit_empty
            exit 0
          fi

          if ! gh pr checks "${PR_NUMBER}" \
            --repo "${REPO}" \
            --json name,state \
            > "${checks_raw}"; then
            emit_empty
            exit 0
          fi

          python - "${pr_json}" "${checks_raw}" "${checks_json}" "${GITHUB_OUTPUT}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          pr_path = Path(sys.argv[1])
          checks_raw_path = Path(sys.argv[2])
          checks_json_path = Path(sys.argv[3])
          output_path = Path(sys.argv[4])

          try:
              pr = json.loads(pr_path.read_text(encoding="utf-8"))
              checks_rows = json.loads(checks_raw_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              pr = {}
              checks_rows = []

          if not isinstance(pr, dict):
              pr = {}
          if not isinstance(checks_rows, list):
              checks_rows = []

          review_decision = str(pr.get("reviewDecision") or "")
          approver_login = ""
          latest_reviews = pr.get("latestReviews")
          if isinstance(latest_reviews, list):
              for review in latest_reviews:
                  if not isinstance(review, dict):
                      continue
                  if str(review.get("state") or "").upper() != "APPROVED":
                      continue
                  author = review.get("author")
                  if isinstance(author, dict):
                      login = str(author.get("login") or "").strip()
                      if login:
                          approver_login = login
                          break

          declared_work_class = ""
          body = pr.get("body")
          if isinstance(body, str):
              match = re.search(
                  r"^- \*\*Declared work class:\*\*\s*(\S+)",
                  body,
                  flags=re.MULTILINE | re.IGNORECASE,
              )
              if match:
                  declared_work_class = match.group(1).strip()

          checks_json_path.write_text(
              json.dumps({"checks": checks_rows}, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"review-decision={review_decision}\n")
              handle.write(f"approver-login={approver_login}\n")
              handle.write(f"declared-work-class={declared_work_class}\n")
              handle.write(f"checks-json-file={checks_json_path}\n")
          PY

      - name: Run automerge decision
        id: decide
        env:
          PATHS_FILE: ${{ steps.inputs.outputs.paths-file }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr-number }}
          HEAD_SHA: ${{ steps.inputs.outputs.head-sha }}
          BRANCH: ${{ steps.inputs.outputs.branch }}
          BASE: ${{ steps.inputs.outputs.base }}
          REVIEW_DECISION: ${{ steps.live.outputs.review-decision || steps.inputs.outputs.review-decision }}
          AUTHOR_LOGIN: ${{ steps.inputs.outputs.author-login }}
          APPROVER_LOGIN: ${{ steps.live.outputs.approver-login || steps.inputs.outputs.approver-login }}
          DECLARED_WORK_CLASS: ${{ steps.live.outputs.declared-work-class || 'S' }}
          CHECKS_JSON_FILE: ${{ steps.live.outputs.checks-json-file || '' }}
          AUTOREVIEW_RUN_MODE: ${{ vars.CE_AUTOREVIEW_RUN_MODE || '' }}
        run: |
          set -euo pipefail

          decisions_dir=".ce/state/automerge/decisions"
          mkdir -p "${decisions_dir}"

          safe_head="$(printf '%s' "${HEAD_SHA}" | tr -c 'A-Za-z0-9._-' '-')"
          decision_key="${PR_NUMBER:-merge-group}-${safe_head}"
          decision_file="${decisions_dir}/${decision_key}.json"
          checks_json_arg="${CHECKS_JSON_FILE}"
          if [[ -z "${checks_json_arg}" ]]; then
            checks_json_arg='{"checks":{}}'
          else
            checks_json_arg="@${checks_json_arg}"
          fi

          args=(
            automerge-decide
            --paths-file "${PATHS_FILE}"
            --declared-work-class "${DECLARED_WORK_CLASS}"
            --repo-root .
            --head-sha "${HEAD_SHA}"
            --repo "${GITHUB_REPOSITORY}"
            --branch "${BRANCH}"
            --base "${BASE}"
            --checks-json "${checks_json_arg}"
            --review-decision "${REVIEW_DECISION}"
            --author-login "${AUTHOR_LOGIN}"
            --approver-login "${APPROVER_LOGIN}"
            --json
          )
          if [[ -n "${AUTOREVIEW_RUN_MODE}" ]]; then
            args+=(--run-mode "${AUTOREVIEW_RUN_MODE}")
          fi
          if [[ -n "${PR_NUMBER}" ]]; then
            args+=(--pr "${PR_NUMBER}")
          fi

          python -m creator_engine_validator.ce_cli "${args[@]}" | tee "${decision_file}"

          echo "decision-file=${decision_file}" >> "${GITHUB_OUTPUT}"

      - name: Assemble press-merge evidence bundle
        id: press_merge_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ steps.inputs.outputs.pr-number }}
          HEAD_SHA: ${{ steps.inputs.outputs.head-sha }}
          PATHS_FILE: ${{ steps.inputs.outputs.paths-file }}
          CHECKS_JSON_FILE: ${{ steps.live.outputs.checks-json-file || '' }}
          DECISION_FILE: ${{ steps.decide.outputs.decision-file }}
          READ_REPO_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail

          work_dir="${RUNNER_TEMP}/ce-press-merge-evidence"
          mkdir -p "${work_dir}"
          pr_json="${work_dir}/pr.json"
          checks_json="${CHECKS_JSON_FILE}"
          if [[ -z "${checks_json}" ]]; then
            checks_json="${work_dir}/checks.json"
            printf '{"checks":[]}\n' > "${checks_json}"
          fi

          current_head_sha="${HEAD_SHA}"
          if [[ -n "${PR_NUMBER}" ]]; then
            if gh pr view "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json number,url,title,baseRefName,headRefName,headRefOid,isDraft,reviewDecision,latestReviews \
              > "${pr_json}"; then
              current_head_sha="$(python - "${pr_json}" "${HEAD_SHA}" <<'PY'
          import json
          import sys
          from pathlib import Path

          fallback = sys.argv[2]
          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              payload = {}
          print(payload.get("headRefOid") or fallback)
          PY
          )"
            else
              printf '{}\n' > "${pr_json}"
            fi
          else
            printf '{}\n' > "${pr_json}"
          fi

          safe_head="$(printf '%s' "${HEAD_SHA}" | tr -c 'A-Za-z0-9._-' '-')"
          subject="${PR_NUMBER:-merge-group}"
          artifact_name="ce-press-merge-evidence-bundle-${subject}-${safe_head}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bundle_file="${work_dir}/${artifact_name}.json"

          python -m creator_engine_validator.ce_cli press-merge-evidence \
            --decision-file "${DECISION_FILE}" \
            --paths-file "${PATHS_FILE}" \
            --checks-json-file "${checks_json}" \
            --pr-json-file "${pr_json}" \
            --current-head-sha "${current_head_sha}" \
            --repo-root . \
            --assembler-workflow "${GITHUB_WORKFLOW}" \
            --assembler-run-id "${GITHUB_RUN_ID}" \
            --assembler-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --read-repo-sha "${READ_REPO_SHA}" \
            --decision-artifact-name "ce-automerge-decision-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > "${bundle_file}"

          bundle_sha="$(sha256sum "${bundle_file}" | awk '{print $1}')"
          {
            echo "bundle-file=${bundle_file}"
            echo "artifact-name=${artifact_name}"
            echo "bundle-sha256=${bundle_sha}"
          } >> "${GITHUB_OUTPUT}"

          python - "${bundle_file}" "${bundle_sha}" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import sys
          from pathlib import Path

          bundle_path = Path(sys.argv[1])
          bundle_sha = sys.argv[2]
          summary_path = Path(sys.argv[3])
          payload = json.loads(bundle_path.read_text(encoding="utf-8"))
          summary = payload.get("summary", {})

          lines = [
              "",
              "# CE press-merge evidence bundle",
              "",
              f"- Bundle JSON: `{bundle_path.as_posix()}`",
              f"- SHA256: `{bundle_sha}`",
              "",
              "## Bundle summary",
              "```json",
              json.dumps(summary, indent=2, sort_keys=True),
              "```",
          ]
          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
              handle.write("\n")
          PY

      - name: Upload press-merge evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.press_merge_evidence.outputs.artifact-name }}
          path: ${{ steps.press_merge_evidence.outputs.bundle-file }}
          if-no-files-found: error

      - name: Write decision summary
        env:
          DECISION_FILE: ${{ steps.decide.outputs.decision-file }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          decision_path = Path(os.environ["DECISION_FILE"])
          payload = json.loads(decision_path.read_text(encoding="utf-8"))
          raw_decision = str(payload.get("decision") or "MANUAL")
          summary_decision = "AUTO" if raw_decision == "AUTO" else "MANUAL"
          rationale = payload.get("rationale") or []

          lines = [
              "# CE automerge decision",
              "",
              f"- Decision: {summary_decision}",
              f"- Raw decision: {raw_decision}",
              f"- Mutation class: {payload.get('mutation_class')}",
              f"- Size band: {payload.get('size_band')}",
              f"- PR: {payload.get('pr_number')}",
              f"- Head SHA: {payload.get('head_sha')}",
              "",
              "## Rationale",
          ]
          lines.extend(f"- {item}" for item in rationale)
          lines.append("")
          lines.append(f"Decision JSON: `{decision_path.as_posix()}`")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
              handle.write("\n")
          PY

      - name: Upload decision artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ce-automerge-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.decide.outputs.decision-file }}
          if-no-files-found: error
