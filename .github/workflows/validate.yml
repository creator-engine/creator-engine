name: Validate

# CI verifies; CI does not ratify.
# This workflow produces validation evidence only.
# It does not deploy, publish, merge, approve, or apply governance ratification.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Merge queue (ce-ops#39): GitHub runs required checks on the synthetic
  # merge_group event against a temporary gh-readonly-queue/* branch, NOT on the
  # PR head. Without this trigger the "Validate governance artifacts" required
  # check never reports on the merge group and the queue stalls forever.
  # `checks_requested` is the only valid merge_group activity type.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate governance artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          # PR diff gates validate the live PR head, not GitHub's synthetic merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Install validator (offline, from repo wheelhouse)
        run: |
          pip install --no-index \
            --find-links validators/wheelhouse \
            -r validators/requirements.txt

      - name: Install validator test deps (offline, from dev wheelhouse)
        run: |
          pip install --no-index \
            --find-links validators/wheelhouse \
            --find-links validators/wheelhouse-dev \
            -r validators/requirements-dev.txt

      - name: Creator Engine validator — pytest suite (offline)
        run: |
          # F-wheel-2's post-merge bake lane runs the first-party wheel parity gate.
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=validators \
            python -m pytest -p no:cacheprovider validators/tests/ \
              -m "not wheel_bake_gate" -q -n auto --dist loadgroup

      - name: YAML parse check — workflow files
        run: |
          python - <<'PYEOF'
          import sys, pathlib, yaml
          errors = []
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text())
                  print(f"OK  {p}")
              except yaml.YAMLError as exc:
                  errors.append(f"FAIL {p}: {exc}")
                  print(f"FAIL {p}: {exc}")
          if errors:
              sys.exit(1)
          PYEOF

      - name: YAML parse check — schemas and templates
        run: |
          python - <<'PYEOF'
          import sys, pathlib, yaml
          errors = []
          dirs = ["schemas", "templates", "docs/contracts", "examples", "playbooks"]
          for d in dirs:
              for ext in ("*.yml", "*.yaml"):
                  for p in sorted(pathlib.Path(d).rglob(ext)):
                      try:
                          yaml.safe_load(p.read_text())
                          print(f"OK  {p}")
                      except yaml.YAMLError as exc:
                          errors.append(f"FAIL {p}: {exc}")
                          print(f"FAIL {p}: {exc}")
          if errors:
              sys.exit(1)
          PYEOF

      - name: YAML schema check — identity registry
        run: |
          python - <<'PYEOF'
          import pathlib
          import sys

          import jsonschema
          import yaml

          registry_path = pathlib.Path("docs/governance/identity-registry.example.yaml")
          schema_path = pathlib.Path("schemas/identity-registry.schema.yaml")

          registry = yaml.safe_load(registry_path.read_text(encoding="utf-8"))
          schema = yaml.safe_load(schema_path.read_text(encoding="utf-8"))

          validator = jsonschema.Draft202012Validator(schema)
          errors = sorted(validator.iter_errors(registry), key=lambda error: list(error.path))
          if errors:
              for error in errors:
                  location = ".".join(str(part) for part in error.path) or "<root>"
                  print(f"FAIL {registry_path}:{location}: {error.message}", file=sys.stderr)
              sys.exit(1)

          print(f"OK  {registry_path} validates against {schema_path}")
          PYEOF

      - name: Creator Engine validator — well-formed examples
        run: |
          PYTHONPATH=validators python -m creator_engine_validator check examples/well-formed/

      - name: Creator Engine validator — ce_playbook_format gate
        run: |
          PYTHONPATH=validators python -m creator_engine_validator check playbooks/

      - name: Creator Engine validator — malformed examples (expect failures)
        run: |
          if PYTHONPATH=validators python -m creator_engine_validator check examples/malformed/; then
            echo "FAIL: malformed examples unexpectedly passed"
            exit 1
          else
            echo "OK: malformed examples correctly rejected"
          fi

      - name: Creator Engine validator — list checks (audit evidence)
        run: |
          PYTHONPATH=validators python -m creator_engine_validator --list-checks

      - name: Creator Engine validator — install-spec signature guard
        run: |
          PYTHONPATH=validators python -m creator_engine_validator scan-install-spec-signature .

      - name: Creator Engine validator — brain drift check
        run: |
          PYTHONPATH=validators python -m creator_engine_validator.ce_cli \
            brain verify --drift --state-root .ce/state

      - name: Resolve live comparison base
        id: live-base
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_ref=""
          base_rev=""
          comparison_base=""
          live_base_sha=""
          live_head_ref=""
          live_head_sha=""

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            pr_number="$(
              python - <<'PYEOF'
          import json
          import os
          import sys

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          try:
              with open(event_path, encoding="utf-8") as handle:
                  event = json.load(handle)
          except (OSError, TypeError, ValueError):
              event = {}
          number = ((event.get("pull_request") or {}).get("number") or "")
          if not number:
              print("FAIL: could not resolve pull_request.number from GITHUB_EVENT_PATH", file=sys.stderr)
              sys.exit(1)
          print(number)
          PYEOF
            )"

            pr_json="$(mktemp)"
            pr_values="$(mktemp)"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "${pr_json}"
            python - "${pr_json}" > "${pr_values}" <<'PYEOF'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              pr = json.load(handle)

          values = {
              "base_ref": ((pr.get("base") or {}).get("ref") or ""),
              "base_sha": ((pr.get("base") or {}).get("sha") or ""),
              "head_ref": ((pr.get("head") or {}).get("ref") or ""),
              "head_sha": ((pr.get("head") or {}).get("sha") or ""),
          }
          sha_re = re.compile(r"^[0-9a-f]{40}$")
          for key, value in values.items():
              if not isinstance(value, str) or not value:
                  print(f"FAIL: live PR payload missing {key}", file=sys.stderr)
                  sys.exit(1)
              if "\n" in value or "\r" in value:
                  print(f"FAIL: live PR payload {key} contains a newline", file=sys.stderr)
                  sys.exit(1)
          for key in ("base_sha", "head_sha"):
              if not sha_re.fullmatch(values[key]):
                  print(f"FAIL: live PR payload {key} is not a full SHA", file=sys.stderr)
                  sys.exit(1)

          print(values["base_ref"])
          print(values["base_sha"])
          print(values["head_ref"])
          print(values["head_sha"])
          PYEOF
            mapfile -t live_pr < "${pr_values}"
            rm -f "${pr_json}" "${pr_values}"
            if [[ "${#live_pr[@]}" -ne 4 ]]; then
              echo "FAIL: live PR payload did not resolve exactly four base/head fields" >&2
              exit 1
            fi

            base_ref="${live_pr[0]}"
            live_base_sha="${live_pr[1]}"
            live_head_ref="${live_pr[2]}"
            live_head_sha="${live_pr[3]}"

            checkout_head="$(git rev-parse HEAD)"
            if [[ "${checkout_head}" != "${live_head_sha}" ]]; then
              echo "FAIL: refusing stale re-run: checkout HEAD ${checkout_head} != live PR head ${live_head_sha}; push or re-run on the current head" >&2
              exit 1
            fi

            echo "Live PR base: ${base_ref} ${live_base_sha}"
            echo "Live PR head: ${live_head_ref} ${live_head_sha}"
          else
            base_ref="$(
              python - <<'PYEOF'
          import json
          import os
          import sys

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          base_ref = os.environ.get("GITHUB_BASE_REF", "")

          if not base_ref and event_path:
              try:
                  with open(event_path, encoding="utf-8") as handle:
                      event = json.load(handle)
              except (OSError, ValueError):
                  event = {}

              if event_name == "merge_group":
                  base_ref = ((event.get("merge_group") or {}).get("base_ref") or "")
                  prefix = "refs/heads/"
                  if base_ref.startswith(prefix):
                      base_ref = base_ref[len(prefix):]

          if not base_ref:
              print(f"FAIL: could not resolve base branch for {event_name}", file=sys.stderr)
              sys.exit(1)
          if "\n" in base_ref or "\r" in base_ref:
              print("FAIL: base branch contains a newline", file=sys.stderr)
              sys.exit(1)
          print(base_ref)
          PYEOF
            )"
          fi

          git check-ref-format --branch "${base_ref}" >/dev/null
          if [[ -n "${live_head_ref}" ]]; then
            git check-ref-format --branch "${live_head_ref}" >/dev/null
          fi

          fetch_with_shallow_retry() {
            local attempt arg max_attempts delay output status unshallow_fetch
            max_attempts=4
            delay=2
            output="$(mktemp)"
            unshallow_fetch=false
            for arg in "$@"; do
              if [[ "${arg}" == "--unshallow" ]]; then
                unshallow_fetch=true
                break
              fi
            done

            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if git fetch "$@" >"${output}" 2>&1; then
                cat "${output}" >&2
                rm -f "${output}"
                return 0
              else
                status=$?
              fi

              cat "${output}" >&2
              if ! grep -Fq "shallow file has changed since we read it" "${output}" ||
                [[ "${attempt}" -eq "${max_attempts}" ]]; then
                rm -f "${output}"
                return "${status}"
              fi
              if [[ "${unshallow_fetch}" == "true" &&
                "$(git rev-parse --is-shallow-repository)" != "true" ]]; then
                rm -f "${output}"
                return 0
              fi

              echo "git fetch hit shallow metadata race; retrying $((attempt + 1))/${max_attempts}" >&2
              sleep "${delay}"
              delay=$((delay * 2))
            done

            rm -f "${output}"
            return 1
          }

          resolve_compare_api_merge_base() {
            local compare_base compare_head context response status
            compare_base="$1"
            compare_head="$2"
            context="$3"
            response="$(mktemp)"

            if gh api "repos/${GITHUB_REPOSITORY}/compare/${compare_base}...${compare_head}" >"${response}"; then
              :
            else
              status=$?
              rm -f "${response}"
              echo "INFRA: GitHub compare API failed while resolving ${context} merge-base (${compare_base}...${compare_head}); re-run after GitHub API connectivity recovers" >&2
              return "${status}"
            fi

            python - "${response}" "${context}" <<'PYEOF'
          import json
          import re
          import sys

          response_path = sys.argv[1]
          context = sys.argv[2]
          sha_re = re.compile(r"^[0-9a-f]{40}$")
          try:
              with open(response_path, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, ValueError) as exc:
              print(
                  f"INFRA: GitHub compare API returned unreadable {context} merge-base payload: {exc}",
                  file=sys.stderr,
              )
              sys.exit(1)

          merge_base = ((payload.get("merge_base_commit") or {}).get("sha") or "")
          if not isinstance(merge_base, str) or not sha_re.fullmatch(merge_base):
              print(
                  f"INFRA: GitHub compare API response did not include a valid {context} merge_base_commit.sha",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(merge_base)
          PYEOF
            status=$?
            rm -f "${response}"
            return "${status}"
          }

          fetch_resolved_comparison_base() {
            local resolved_sha
            resolved_sha="$1"
            if git rev-parse "${resolved_sha}^{commit}" >/dev/null 2>&1; then
              return 0
            fi
            if ! fetch_with_shallow_retry --no-tags --depth=1 origin "${resolved_sha}"; then
              echo "INFRA: failed to fetch server-resolved comparison base ${resolved_sha}; local diff validation cannot proceed" >&2
              exit 1
            fi
            if ! git rev-parse "${resolved_sha}^{commit}" >/dev/null 2>&1; then
              echo "INFRA: fetched server-resolved comparison base ${resolved_sha}, but the commit is still unavailable locally" >&2
              exit 1
            fi
          }

          fetch_with_shallow_retry --no-tags --prune --depth=100 origin \
            "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"

          base_rev="origin/${base_ref}"
          if [[ -n "${live_base_sha}" ]]; then
            fetched_base_sha="$(git rev-parse "origin/${base_ref}^{commit}" 2>/dev/null || true)"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              # Resolve PR comparison bases server-side. This avoids local
              # parent traversal through objects that a shallow checkout may not
              # have when origin/${base_ref} has moved past the PR's recorded base.
              comparison_base="$(resolve_compare_api_merge_base "${live_base_sha}" "${live_head_sha}" "pull request")"
              fetch_resolved_comparison_base "${comparison_base}"
              if [[ "${fetched_base_sha}" != "${live_base_sha}" ]]; then
                echo "::warning::PR base ${live_base_sha} behind origin/${base_ref} (${fetched_base_sha}); comparing against server-resolved PR merge-base ${comparison_base} from recorded base ${live_base_sha}"
              else
                echo "Resolved PR comparison base via GitHub compare API: ${comparison_base}"
              fi
              base_rev="${live_base_sha}"
            elif [[ "${fetched_base_sha}" != "${live_base_sha}" ]]; then
                echo "FAIL: live PR base ${live_base_sha} (${base_ref}) was not fetched at origin/${base_ref}; re-run on the current base" >&2
                exit 1
            else
              base_rev="${live_base_sha}"
            fi
          fi

          if [[ -z "${comparison_base}" ]]; then
            comparison_base="$(git merge-base "${base_rev}" HEAD 2>/dev/null || true)"
          fi
          if [[ -z "${comparison_base}" && "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            fetch_with_shallow_retry --no-tags --prune --unshallow origin
            fetch_with_shallow_retry --no-tags --prune origin \
              "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
            if [[ -n "${live_base_sha}" ]]; then
              fetched_base_sha="$(git rev-parse "origin/${base_ref}^{commit}" 2>/dev/null || true)"
              if [[ "${fetched_base_sha}" != "${live_base_sha}" ]]; then
                echo "FAIL: live PR base ${live_base_sha} (${base_ref}) was not fetched at origin/${base_ref}; re-run on the current base" >&2
                exit 1
              fi
            fi
            comparison_base="$(git merge-base "${base_rev}" HEAD 2>/dev/null || true)"
          fi

          if [[ -z "${comparison_base}" ]]; then
            echo "INFRA: could not derive merge-base for ${base_rev} and HEAD after fetch retries; local repository is missing required commit graph objects" >&2
            exit 1
          fi

          echo "Live comparison base: ${comparison_base} (${base_rev})"
          {
            echo "comparison_base=${comparison_base}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${live_base_sha}"
            echo "head_ref=${live_head_ref}"
            echo "head_sha=${live_head_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Creator Engine validator — work-sizing floor PR-diff gate (G5)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          COMPARISON_BASE: ${{ steps.live-base.outputs.comparison_base }}
        run: |
          set -euo pipefail
          comparison_base="${COMPARISON_BASE}"
          if [[ -z "${comparison_base}" ]]; then
            echo "FAIL: live comparison base was not resolved" >&2
            exit 1
          fi
          declared_work_class="$(
            python - <<'PYEOF'
          import json
          import os
          import re
          import sys

          aliases = {
              "XS": "XS",
              "S": "S",
              "M": "M",
              "L": "L",
              "xs": "XS",
              "s": "S",
              "m": "M",
              "l": "L",
              "tiny": "XS",
              "story": "S",
              "feature": "M",
              "epic": "L",
          }
          allowed = ("XS", "S", "M", "L")
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          try:
              with open(event_path, encoding="utf-8") as handle:
                  body = (json.load(handle).get("pull_request") or {}).get("body") or ""
          except (OSError, TypeError, ValueError):
              print("FAIL: could not read pull_request.body from GITHUB_EVENT_PATH", file=sys.stderr)
              sys.exit(1)
          pattern = re.compile(
              r"^\s*(?:[-*]\s*)?(?:\*\*)?Declared work class(?:\*\*)?\s*:\s*(?:\*\*)?\s*"
              r"`?([A-Za-z][A-Za-z0-9_-]*)`?\s*(?:<!--.*-->)?\s*$",
              re.IGNORECASE | re.MULTILINE,
          )
          values = [match.group(1) for match in pattern.finditer(body)]
          if len(values) != 1:
              print(
                  "FAIL: PR body must contain exactly one declared work class line: "
                  "'- **Declared work class:** <XS|S|M|L>'",
                  file=sys.stderr,
              )
              sys.exit(1)
          declared = values[0]
          normalized = aliases.get(declared.strip())
          if normalized is None:
              print(
                  "FAIL: declared work class is invalid; "
                  f"expected one of: {', '.join(allowed)} "
                  "(legacy aliases: tiny, story, feature, epic)",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(normalized)
          PYEOF
          )"
          echo "Declared work class: ${declared_work_class}"
          PYTHONPATH=validators python -m creator_engine_validator \
            verify-work-sizing-floor --base "${comparison_base}" \
            --declared-work-class "${declared_work_class}" .

      - name: Creator Engine validator — test-coupling PR-diff gate
        if: ${{ github.event_name == 'pull_request' }}
        env:
          COMPARISON_BASE: ${{ steps.live-base.outputs.comparison_base }}
        run: |
          set -euo pipefail
          comparison_base="${COMPARISON_BASE}"
          if [[ -z "${comparison_base}" ]]; then
            echo "FAIL: live comparison base was not resolved" >&2
            exit 1
          fi
          pr_body_file="${RUNNER_TEMP}/ce-pr-body.md"
          python - "${pr_body_file}" <<'PYEOF'
          import json
          import os
          import sys

          out_path = sys.argv[1]
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          try:
              with open(event_path, encoding="utf-8") as handle:
                  body = (json.load(handle).get("pull_request") or {}).get("body") or ""
          except (OSError, TypeError, ValueError):
              print("FAIL: could not read pull_request.body from GITHUB_EVENT_PATH", file=sys.stderr)
              sys.exit(1)
          with open(out_path, "w", encoding="utf-8") as handle:
              handle.write(body)
          PYEOF
          PYTHONPATH=validators python -m creator_engine_validator \
            verify-test-coupling --base "${comparison_base}" \
            --pr-body-file "${pr_body_file}" .

      - name: Creator Engine validator — version-drift current surface gate
        run: |
          set -euo pipefail
          PYTHONPATH=validators python -m creator_engine_validator \
            verify-version-drift .

      - name: Creator Engine validator — path-manifest PR-diff gate (G-ii)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          COMPARISON_BASE: ${{ steps.live-base.outputs.comparison_base }}
          HEAD_REF: ${{ steps.live-base.outputs.head_ref }}
        run: |
          set -euo pipefail
          comparison_base="${COMPARISON_BASE}"
          head_ref="${HEAD_REF}"
          if [[ -z "${comparison_base}" ]]; then
            echo "FAIL: live comparison base was not resolved" >&2
            exit 1
          fi
          if [[ -z "${head_ref}" ]]; then
            echo "FAIL: live PR head ref was not resolved" >&2
            exit 1
          fi
          # Invariant: the upstream live-base step must resolve the current PR via
          # gh api, prove checkout HEAD equals the live PR head SHA, and compute
          # this comparison base from the live PR base SHA. This gate must not use
          # event-cached refs such as GITHUB_BASE_REF/GITHUB_HEAD_REF directly.
          # Per-PR carrier convention (ce-ops#21): each gate PR carries its ratified
          # closed manifest as its OWN file `.ce/pr-manifests/<branch-slug>.md`. The
          # validator discovers this PR's carrier from the diff (exactly one, ADDED,
          # slug == branch_slug(head)) and enforces diff == its path-set. CI runs
          # required-mode so a PR missing that carrier, or its matching
          # `.ce/changelog/<branch-slug>.md` fragment, fails closed.
          PYTHONPATH=validators python -m creator_engine_validator \
            verify-path-manifest --base "${comparison_base}" \
            --manifest-dir .ce/pr-manifests --head-ref "${head_ref}" \
            --require-carrier

      - name: Workflow permissions audit (no write permissions present)
        run: |
          python - <<'PYEOF'
          import sys, pathlib, yaml

          def collect_permissions(obj, found, path=""):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k == "permissions":
                          if isinstance(v, dict):
                              for perm_key, perm_val in v.items():
                                  if str(perm_val).lower() == "write":
                                      found.append(f"{path}.{perm_key}: write")
                          elif isinstance(v, str) and v.lower() == "write":
                              found.append(f"{path}: write (all)")
                      else:
                          collect_permissions(v, found, f"{path}.{k}")
              elif isinstance(obj, list):
                  for i, item in enumerate(obj):
                      collect_permissions(item, found, f"{path}[{i}]")

          p = pathlib.Path(".github/workflows/validate.yml")
          doc = yaml.safe_load(p.read_text())
          write_found = []
          collect_permissions(doc, write_found)
          if write_found:
              for w in write_found:
                  print(f"FAIL: write permission in YAML structure: {w}")
              sys.exit(1)
          top_perms = doc.get("permissions", {})
          print(f"OK: declared permissions = {top_perms}")
          print("OK: no write permissions found in YAML structure")
          PYEOF
