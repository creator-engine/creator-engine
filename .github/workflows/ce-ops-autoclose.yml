name: CE Ops Autoclose

# Cross-repo issue closure for creator-engine/ce-ops (ce-ops#262).
#
# GitHub does NOT auto-close issues across repositories via `Closes` keywords
# in PR descriptions: merged PRs in creator-engine/creator-engine only produce
# a CrossReferencedEvent in ce-ops issues, never a ConnectedEvent/close.
# This bot closes them via the API using a dedicated least-privilege token.
#
# Required repository secret:
#   CE_CROSS_REPO_TOKEN: fine-grained PAT or GitHub App installation token
#   with issues:write on creator-engine/ce-ops ONLY.  Never substitute
#   GITHUB_TOKEN — it is scoped to this repository.
#
# Fail-closed: a missing cross-repo token emits an ::error:: and exits nonzero.
# continue-on-error keeps this cleanup job non-blocking; the script also invokes
# its governance-alert hook when a suitable alert token is available.
#
# Issue refs are extracted via two paths:
#   1. Title scan  — every ce-ops#N token in the PR title (CE convention:
#      `feat(ce-ops#NNN): ...` embeds the issue directly, no keyword needed).
#   2. Body keyword scan — `Closes ce-ops#N`, `Fixes ce-ops#N`,
#      `Resolves ce-ops#N` (and inflections) in the PR body.
# Parsing logic lives in tools/ce-ops-autoclose/parse_issue_refs.py.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  close-ce-ops:
    name: Close referenced ce-ops issues
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout (needed for parser module)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Close ce-ops issues from title and explicit body refs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CE_CROSS_REPO_TOKEN }}
          CE_CROSS_REPO_TOKEN: ${{ secrets.CE_CROSS_REPO_TOKEN }}
          CE_OPS_TOKEN: ${{ secrets.CE_OPS_TOKEN }}
        run: |
          python3 .github/scripts/ceops_autoclose.py
