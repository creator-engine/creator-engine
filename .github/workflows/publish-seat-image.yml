name: Publish Seat Image

# Publishes a package only. It does not approve, merge, ratify, or mutate source.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Seat image version tag, for example 0.3.1"
        required: true
        type: string
  push:
    tags:
      - "release/v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish tenant seat image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image metadata
        id: image
        env:
          DISPATCH_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
          else
            tag_name="${GITHUB_REF#refs/tags/}"
            if [[ ! "${tag_name}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "seat image publish only accepts release/vX.Y.Z tags: ${tag_name}" >&2
              exit 1
            fi
            version="${tag_name#release/v}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "seat image version must be X.Y.Z: ${version}" >&2
            exit 1
          fi

          repository="${GITHUB_REPOSITORY,,}"
          runtime_image="ghcr.io/${repository}/ce-runtime"
          seat_image="ghcr.io/${repository}/ce-seat"
          git_sha="${GITHUB_SHA}"

          {
            echo "version=${version}"
            echo "runtime_image=${runtime_image}"
            echo "seat_image=${seat_image}"
            echo "git_sha=${git_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Resolve runtime manifest-list digest
        id: runtime
        env:
          RUNTIME_IMAGE: ${{ steps.image.outputs.runtime_image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          runtime_digest="$(docker buildx imagetools inspect "${RUNTIME_IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${runtime_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "could not resolve manifest-list digest for ${RUNTIME_IMAGE}:${VERSION}: ${runtime_digest}" >&2
            exit 1
          fi

          runtime_digest_ref="${RUNTIME_IMAGE}@${runtime_digest}"
          {
            echo "runtime_digest=${runtime_digest}"
            echo "runtime_digest_ref=${runtime_digest_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-arch seat image
        env:
          IMAGE: ${{ steps.image.outputs.seat_image }}
          VERSION: ${{ steps.image.outputs.version }}
          GIT_SHA: ${{ steps.image.outputs.git_sha }}
          CE_CANONICAL_RUNTIME_IMAGE: ${{ steps.runtime.outputs.runtime_digest_ref }}
        run: |
          set -euo pipefail

          docker buildx build \
            --file deploy/seat-image/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg CE_CANONICAL_RUNTIME_IMAGE="${CE_CANONICAL_RUNTIME_IMAGE}" \
            --build-arg CE_IMAGE_VERSION="${VERSION}" \
            --build-arg CE_IMAGE_REVISION="${GIT_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${GIT_SHA}" \
            --push \
            .

      - name: Surface manifest-list digest
        id: digest
        env:
          IMAGE: ${{ steps.image.outputs.seat_image }}
          VERSION: ${{ steps.image.outputs.version }}
          GIT_SHA: ${{ steps.image.outputs.git_sha }}
          RUNTIME_DIGEST_REF: ${{ steps.runtime.outputs.runtime_digest_ref }}
        run: |
          set -euo pipefail

          manifest_digest="$(docker buildx imagetools inspect "${IMAGE}:${GIT_SHA}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "could not resolve manifest-list digest for ${IMAGE}:${GIT_SHA}: ${manifest_digest}" >&2
            exit 1
          fi

          digest_ref="${IMAGE}@${manifest_digest}"
          {
            echo "manifest_digest=${manifest_digest}"
            echo "digest_ref=${digest_ref}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Seat image"
            echo
            echo "- Version tag: \`${IMAGE}:${VERSION}\`"
            echo "- Git SHA tag: \`${IMAGE}:${GIT_SHA}\`"
            echo "- Runtime base: \`${RUNTIME_DIGEST_REF}\`"
            echo "- Manifest-list digest: \`${manifest_digest}\`"
            echo "- Digest-pinned reference: \`${digest_ref}\`"
            echo
            echo "Consumers must pin the manifest-list digest, not an architecture child digest."
          } >> "${GITHUB_STEP_SUMMARY}"
