name: Identity denylist freshness

"on":
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check runtime identity denylist generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout creator-engine
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Verify ce-ops read token is configured
        env:
          CE_OPS_READ_TOKEN: ${{ secrets.CE_OPS_READ_TOKEN }}
        run: |
          if [ -z "${CE_OPS_READ_TOKEN}" ]; then
            echo "CE_OPS_READ_TOKEN is not configured; cannot check private identity registry freshness." >&2
            exit 1
          fi

      - name: Checkout private identity registry source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: creator-engine/ce-ops
          path: ce-ops
          token: ${{ secrets.CE_OPS_READ_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML==6.0.3

      # The runtime artifact is generated only in registry-backed contexts and
      # remains gitignored. V1 intentionally does not auto-push, auto-commit, or
      # open a PR; propose-a-governed-diff is a follow-up.
      - name: Generate fresh runtime identity denylist
        run: |
          python scripts/gen_identity_denylist.py --registry ce-ops/infra/identity-registry.yaml --write

      - name: Check runtime identity denylist freshness
        run: |
          python scripts/gen_identity_denylist.py --registry ce-ops/infra/identity-registry.yaml --check
