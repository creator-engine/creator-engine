schema: creator-engine/spec.ce.yml
schema_version: "2.0.0-draft"
schema_status: formalized
ce_metadata_kind: spec-ce-sidecar

spec:
  id: specs/v2/005-connector-substrate
  spec_number: "005"
  title: Creator Engine v2.0 connector substrate (connector descriptor + Mission-Brief)
  namespace: specs/v2
  spec_md: spec.md
  status: draft
  release_line: v2.0-foundation

gate:
  id: G2.005.2
  feature_binding: specs/v2/005
  slice: "2"
  title: GitHub connector write runtime (strict mode)
  layer: 3
  predecessor_gate:
    id: G2.005.1
    slice: "1"
    title: GitHub connector read-only runtime
    status: merged
  note: >-
    G2.005.0 (substrate, PR #100) and G2.005.1 (read-only runtime, PR #101) are
    merged. G2.005.2 is the active slice: the GitHub connector WRITE runtime
    (`ce connector` write-plan/submit) over that substrate + read runtime. It makes
    the bounded, non-privileged tracker_mirror write set (issue-create/issue-update/
    pr-comment) executable, and ONLY under CE operating_mode: strict (auto/
    transcendence are refused; this is the G2.002.1 dependency made enforceable —
    distinct from the batch strict-mode governance cadence). A write REQUIRES a
    credential resolved BY REFERENCE and never stored/printed/committed; the network
    is reached only through an injectable client seam so tests are network-free and
    the default adapter fails closed offline. It reuses the G2.005.0 validator,
    imports no CE-event/PCL/distributed-identity code, and changes no G2.005.1
    read-path behavior. Tracker connectors (G2.005.3), auto/transcendence write
    activation, credential brokering, and CI/deploy remain separate, deferred,
    Operator-ratified gates.

authority_basis:
  ratified_prompt:
    path: .hermes/research/g20050-connector-substrate-planning-20260601T032129Z/recommended-next/NEXT_OPERATOR_G20050_CONNECTOR_SUBSTRATE_AUTOMODE_EXECUTION_PROMPT_20260601T032129Z.md
    sha256: 8b909b01a4a15bb81a4f28f5ccb382a7ec001ace3beb65358360f9933cc887dc
  ratified_prompt_g2_005_1:
    path: .hermes/research/g20051-connector-read-runtime-planning-20260601T035951Z/recommended-next/NEXT_OPERATOR_G20051_CONNECTOR_READ_RUNTIME_AUTOMODE_EXECUTION_PROMPT_20260601T035951Z.md
    sha256: c087d5d3009be0ba3e251d1eb990c6cf7a8b7b123f9257a4385c460e68bdaf16
  ratified_prompt_g2_005_2:
    path: .hermes/research/g20052-connector-write-runtime-planning-20260601T045927Z/recommended-next/NEXT_OPERATOR_G20052_CONNECTOR_WRITE_RUNTIME_BATCH_STRICTMODE_EXECUTION_PROMPT_20260601T051658Z.md
    sha256: a0526700bf5351b36927750185da7aeebdd06065ae9679aa9a94366f401ed470
  note: >-
    This sidecar records G2.005.0 substrate authority, the G2.005.1 read-only
    runtime authority, and the G2.005.2 strict-mode write runtime authority. It
    ratifies nothing, performs no write, carries no secret/credential values, and
    binds no concrete vendor/account identity as normative.

operating_mode_relevance:
  modes: [strict, auto, transcendence]
  authoring_mode: strict
  default_mode_for_migrated_v1_tenants: strict
  notes: >-
    Connector descriptors and Mission-Briefs record operating-mode context only;
    G2.005.0 activates or propagates no runtime operating mode.

authority:
  mutation_classes: [governance, identity, security]
  privileged: true
  required_ratifier_role: operator
  agent_reviewer: advisory_only
  agent_ratifier: reserved_inactive
  emergency_override: operator_only
  authoring_authority_boundary: >-
    Docs, schema, validator, examples, tests, templates, and spec substrate only.
    No connector runtime, no ce connector CLI, no network/GitHub/tracker API, no
    credential injection, no live issue/PR mutation, no CI/deploy, and no privileged
    class escalation. The bounded tracker_mirror class is non-privileged.

state_boundary:
  canonical_future_connector_home: .ce/
  substrate_writes_connector_state: false
  legacy_home_write_freeze: .hermes/
  notes: >-
    This gate defines shape and validation only. The canonical future home for
    connector/Mission-Brief runtime state is under .ce/; active state MUST NOT be
    written under legacy .hermes/ paths.

requirements:
  - id: RV2-005-001
    spec_md_ref: FR-001
    statement: Define the connector descriptor shape with a connector_kind discriminator.
    decisions: [OD-03, OD-10]
    risk_refs: [RISK-RV2-005-CONN-SHAPE]
  - id: RV2-005-002
    spec_md_ref: FR-002
    statement: Bound capability verbs to read or the tracker_mirror write set; no privileged verbs.
    decisions: [OD-19]
    risk_refs: [RISK-RV2-005-CAPABILITY]
  - id: RV2-005-003
    spec_md_ref: FR-003
    statement: Reference credentials by name only; carry no secret values anywhere.
    decisions: [OD-03]
    risk_refs: [RISK-RV2-005-SECRET]
  - id: RV2-005-004
    spec_md_ref: FR-004
    statement: Define the Mission-Brief record shape.
    decisions: [OD-10]
    risk_refs: [RISK-RV2-005-MB-SHAPE]
  - id: RV2-005-005
    spec_md_ref: FR-005
    statement: Keep tracker_mirror bounded and non-privileged; refuse privilege escalation; do not modify the baseline taxonomy.
    decisions: [OD-19, OD-22]
    risk_refs: [RISK-RV2-005-ESCALATION]
  - id: RV2-005-006
    spec_md_ref: FR-006
    statement: Reference CE-event/PCL artifacts only by opaque 64-hex hashes; import no runtime code.
    decisions: [OD-05, OD-09]
    risk_refs: [RISK-RV2-005-POINTER]
  - id: RV2-005-007
    spec_md_ref: FR-007
    statement: Preserve the Operator-only privileged floor; agent_ratifier stays reserved-inactive; connectors never ratify.
    decisions: [OD-22]
    risk_refs: [RISK-RV2-005-ROLE]
  - id: RV2-005-008
    spec_md_ref: FR-008
    statement: Record operating-mode context, validate signature shape, and forbid inline metadata.
    decisions: [OD-01, OD-24]
    risk_refs: [RISK-RV2-005-MODE, RISK-RV2-005-SIGNATURE, RISK-RV2-005-INLINE]
  - id: RV2-005-009
    spec_md_ref: FR-009
    statement: Preserve .ce/ as the future home and freeze legacy .hermes/ active writes; make no network/API calls.
    decisions: [OD-06A]
    risk_refs: [RISK-RV2-005-WRITE]
  - id: RV2-005-010
    spec_md_ref: FR-010
    statement: Provide fail-closed validator coverage with targeted VAL-CONN-*/VAL-MB-* codes.
    decisions: [OD-03, OD-10, OD-19]
    risk_refs: [RISK-RV2-005-CONN-SHAPE, RISK-RV2-005-MB-SHAPE]
  - id: RV2-005-011
    spec_md_ref: FR-011
    statement: Stop before connector runtime, ce connector CLI, network/API, credential injection, CI/deploy, or autonomy activation.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-005-SCOPE]
  - id: RV2-005-012
    spec_md_ref: FR-012
    statement: ce connector verify/plan validates a connector + Mission-Brief and builds a read-only read plan, offline.
    decisions: [OD-10]
    risk_refs: [RISK-RV2-005-RT-WRITE]
  - id: RV2-005-013
    spec_md_ref: FR-013
    statement: Resolve the credential BY REFERENCE at call time; never store, print, log, or commit the value.
    decisions: [OD-03]
    risk_refs: [RISK-RV2-005-RT-CRED]
  - id: RV2-005-014
    spec_md_ref: FR-014
    statement: Enforce read-only; refuse any write scope or non-read verb (writes are G2.005.2).
    decisions: [OD-19]
    risk_refs: [RISK-RV2-005-RT-WRITE]
  - id: RV2-005-015
    spec_md_ref: FR-015
    statement: Reach the network only through an injectable read-client seam; the default urllib adapter fails closed offline.
    decisions: [OD-03]
    risk_refs: [RISK-RV2-005-RT-NETWORK]
  - id: RV2-005-016
    spec_md_ref: FR-016
    statement: Normalize read results into a redaction-safe receipt carrying no credential or secret value.
    decisions: [OD-03]
    risk_refs: [RISK-RV2-005-RT-RECEIPT]
  - id: RV2-005-017
    spec_md_ref: FR-017
    statement: Keep tests and check network-free by injecting fakes; make no real request in CI.
    decisions: [OD-03]
    risk_refs: [RISK-RV2-005-RT-NETWORK]
  - id: RV2-005-018
    spec_md_ref: FR-018
    statement: Stop before the connector write runtime, credential injection/brokering, CI/deploy, or autonomy activation.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-005-RT-SCOPE]
  - id: RV2-005-019
    spec_md_ref: FR-019
    statement: ce connector write-plan validates a write-scope connector + tracker_mirror Mission-Brief and builds a write plan, offline; a read_only scope is refused.
    decisions: [OD-19]
    risk_refs: [RISK-RV2-005-W-SCOPE]
  - id: RV2-005-020
    spec_md_ref: FR-020
    statement: Execute writes only under CE operating_mode strict on BOTH the connector and the Mission-Brief; refuse auto/transcendence before any request.
    decisions: [OD-19, OD-22]
    risk_refs: [RISK-RV2-005-W-MODE]
  - id: RV2-005-021
    spec_md_ref: FR-021
    statement: Bound write verbs to the tracker_mirror set (issue-create/issue-update/pr-comment); refuse other/privileged verbs; require the tracker_mirror mutation class.
    decisions: [OD-19]
    risk_refs: [RISK-RV2-005-W-CAPABILITY]
  - id: RV2-005-022
    spec_md_ref: FR-022
    statement: Require a present credential resolved BY REFERENCE for a write; fail closed on an absent/none credential; never store, print, log, commit, or receipt the value.
    decisions: [OD-03]
    risk_refs: [RISK-RV2-005-W-CRED]
  - id: RV2-005-023
    spec_md_ref: FR-023
    statement: Reach the network only through an injectable write-client seam; the default urllib adapter fails closed offline; one bounded mutation per submit.
    decisions: [OD-03]
    risk_refs: [RISK-RV2-005-W-NETWORK]
  - id: RV2-005-024
    spec_md_ref: FR-024
    statement: Normalize write results into a redaction-safe receipt carrying only bounded fields and no credential or secret value.
    decisions: [OD-03]
    risk_refs: [RISK-RV2-005-W-RECEIPT]
  - id: RV2-005-025
    spec_md_ref: FR-025
    statement: Stop before tracker connectors, auto/transcendence write activation, credential brokering, batching, or CI/deploy; leave the G2.005.1 read path unchanged.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-005-W-STOPLINE]

risk_inventory:
  - id: RISK-RV2-005-CONN-SHAPE
    title: Ambiguous connector descriptor shape.
    relevance: [governance, identity]
    description: A connector cannot be validated deterministically or declares an unknown kind.
    severity: high
    required_validation_refs: [VAL-CONN-SCHEMA, VAL-CONN-KIND]
  - id: RISK-RV2-005-CAPABILITY
    title: Unbounded capability / privileged verb.
    relevance: [security, governance]
    description: A connector claims a write verb outside the bounded tracker_mirror set or a privileged verb.
    severity: critical
    required_validation_refs: [VAL-CONN-CAPABILITY]
  - id: RISK-RV2-005-SECRET
    title: Secret/credential value carried in a record.
    relevance: [security]
    description: A connector or Mission-Brief carries a token/secret/credential value instead of a name reference.
    severity: critical
    required_validation_refs: [VAL-CONN-SECRET, VAL-MB-SECRET, VAL-CONN-CREDENTIAL-REF]
  - id: RISK-RV2-005-MB-SHAPE
    title: Ambiguous Mission-Brief shape.
    relevance: [governance]
    description: A Mission-Brief cannot be validated deterministically.
    severity: high
    required_validation_refs: [VAL-MB-SCHEMA]
  - id: RISK-RV2-005-ESCALATION
    title: Privilege escalation via a Mission-Brief.
    relevance: [governance, security]
    description: A Mission-Brief declares a privileged mutation class or an unpermitted class.
    severity: critical
    required_validation_refs: [VAL-MB-PRIVILEGE-ESCALATION, VAL-MB-CLASS]
  - id: RISK-RV2-005-POINTER
    title: Malformed or coupling artifact pointer.
    relevance: [attestation, state-boundary]
    description: A Mission-Brief references a CE-event/PCL artifact with a non-64-hex pointer or couples to internals.
    severity: high
    required_validation_refs: [VAL-MB-POINTER-SHAPE]
  - id: RISK-RV2-005-ROLE
    title: Reserved ratifier or non-canonical role emits a record.
    relevance: [governance, identity]
    description: A reserved ratification role is treated as active authority, or a connector/brief is used to ratify.
    severity: critical
    required_validation_refs: [VAL-CONN-ROLE-FLOOR, VAL-MB-ROLE-FLOOR]
  - id: RISK-RV2-005-MODE
    title: Unknown operating-mode context.
    relevance: [governance, autonomy]
    description: A record context names an unratified or ambiguous autonomy mode.
    severity: high
    required_validation_refs: [VAL-CONN-MODE-ENUM, VAL-MB-MODE-ENUM]
  - id: RISK-RV2-005-SIGNATURE
    title: Signature semantics activated early.
    relevance: [identity, attestation]
    description: A shape-only signature field is mistaken for live key custody.
    severity: high
    required_validation_refs: [VAL-MB-SIGNATURE-SHAPE]
  - id: RISK-RV2-005-INLINE
    title: Inline connector-substrate metadata in Markdown.
    relevance: [metadata]
    description: Record metadata leaks into Spec Kit prose instead of sidecars/examples.
    severity: medium
    required_validation_refs: [VAL-CONN-NO-INLINE, VAL-MB-NO-INLINE]
  - id: RISK-RV2-005-WRITE
    title: Legacy active-state write.
    relevance: [state-boundary]
    description: A v2 connector/Mission-Brief targets a legacy .hermes/ path as active state.
    severity: high
    required_validation_refs: [VAL-CONN-WRITE-FREEZE, VAL-MB-WRITE-FREEZE]
  - id: RISK-RV2-005-SCOPE
    title: Runtime bundled into the substrate gate.
    relevance: [governance, runtime]
    description: Connector runtime, CLI, network/API, or credential injection is implemented before separate ratification.
    severity: critical
    required_validation_refs: [VAL-CONN-WRITE-FREEZE, VAL-MB-WRITE-FREEZE]
  - id: RISK-RV2-005-RT-CRED
    title: Credential value leaks at runtime.
    relevance: [security]
    description: The connector runtime stores, prints, logs, or commits a credential/secret value instead of referencing it by name.
    severity: critical
    required_validation_refs: [VAL-CONN-RT-CREDENTIAL]
  - id: RISK-RV2-005-RT-WRITE
    title: Read-only runtime performs or permits a write.
    relevance: [security, governance]
    description: The read-only runtime accepts a write scope/verb instead of refusing and routing to G2.005.2.
    severity: critical
    required_validation_refs: [VAL-CONN-RT-READONLY]
  - id: RISK-RV2-005-RT-NETWORK
    title: Network call in tests / not fail-closed offline.
    relevance: [quality, runtime]
    description: The runtime makes a real request in tests/CI, or does not fail closed when offline / without a client.
    severity: high
    required_validation_refs: [VAL-CONN-RT-NETWORK]
  - id: RISK-RV2-005-RT-RECEIPT
    title: Read-receipt leaks a secret or unbounded field.
    relevance: [security, attestation]
    description: A read-receipt carries a credential value or an unbounded response field.
    severity: high
    required_validation_refs: [VAL-CONN-RT-RECEIPT]
  - id: RISK-RV2-005-RT-SCOPE
    title: Write runtime bundled into the read-only gate.
    relevance: [governance, runtime]
    description: The connector write runtime or credential injection is implemented before separate ratification.
    severity: critical
    required_validation_refs: [VAL-CONN-RT-STOPLINE]
  - id: RISK-RV2-005-W-SCOPE
    title: Read_only scope routed to the write path.
    relevance: [security, governance]
    description: A read_only-scope connector/brief is accepted by the write runtime instead of being refused and routed to the read runtime.
    severity: critical
    required_validation_refs: [VAL-CONN-W-READONLY]
  - id: RISK-RV2-005-W-MODE
    title: Write under a non-strict operating_mode.
    relevance: [governance, autonomy, security]
    description: A write executes under auto/transcendence instead of being refused; autonomy not yet ratified is activated through a connector write.
    severity: critical
    required_validation_refs: [VAL-CONN-W-MODE]
  - id: RISK-RV2-005-W-CAPABILITY
    title: Unbounded or privileged write verb.
    relevance: [security, governance]
    description: The write runtime accepts a verb outside the tracker_mirror set or a privileged verb/class.
    severity: critical
    required_validation_refs: [VAL-CONN-W-CAPABILITY]
  - id: RISK-RV2-005-W-CRED
    title: Credential value leaks, or an anonymous write is permitted.
    relevance: [security]
    description: The write runtime stores/prints/logs/commits a credential value, or executes a write without a present credential.
    severity: critical
    required_validation_refs: [VAL-CONN-W-CREDENTIAL]
  - id: RISK-RV2-005-W-NETWORK
    title: Network call in tests / not fail-closed offline.
    relevance: [quality, runtime]
    description: The write runtime makes a real request in tests/CI, or does not fail closed when offline / without a client.
    severity: high
    required_validation_refs: [VAL-CONN-W-NETWORK]
  - id: RISK-RV2-005-W-RECEIPT
    title: Write-receipt leaks a secret or unbounded field.
    relevance: [security, attestation]
    description: A write-receipt carries a credential value or an unbounded response field.
    severity: high
    required_validation_refs: [VAL-CONN-W-RECEIPT]
  - id: RISK-RV2-005-W-STOPLINE
    title: Deferred write surface implemented early.
    relevance: [governance, runtime]
    description: Tracker connectors, auto/transcendence write activation, credential brokering, batching, or CI/deploy is implemented before separate ratification, or the read path is mutated.
    severity: critical
    required_validation_refs: [VAL-CONN-W-STOPLINE]

