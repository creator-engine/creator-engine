  title: Creator Engine v2.0 Operating-mode Substrate
  namespace: specs/v2
  spec_md: spec.md
  status: draft
  release_line: v2.0-foundation

gate:
  id: G2.002.1
  feature_binding: specs/v2/002
  slice: "1"
  title: operating-mode runtime carriers
  layer: 0
  predecessor_gate:
    id: G2.002.0
    slice: "0"
    title: operating-mode substrate schema and validator
    status: merged
  note: >-
    G2.002.0 landed the policy substrate (PR #85, merged). G2.002.1 is the
    active slice: it propagates that substrate into runtime carriers
    (Assignment Envelope representation, Active-Work Ledger records, and the
    `ce lane launch` default/refusal behavior). It ratifies nothing and
    activates no elevated mode.

