    runtime-carrier scope. It ratifies nothing, activates no elevated mode,
    and binds no agent ratifier.

operating_mode_relevance:
  modes: [strict, auto, transcendence]
  authoring_mode: strict
  default_mode_for_migrated_v1_tenants: strict
  notes: >-
    G2.002.0 defines policy shape and validation for operating modes while
    preserving the Operator-only privileged floor in every mode.

authority:
  mutation_classes: [governance, identity]
  privileged: true
  required_ratifier_role: operator
  agent_reviewer: advisory_only
  agent_ratifier: reserved_inactive
  emergency_override: operator_only
  authoring_authority_boundary: >-
    Docs, schema, validator, examples, spec substrate, Assignment Envelope
    carrier representation, Active-Work Ledger carrier fields, and ce lane launch
    default/refusal behavior only. No G2.001.4 crosswalk work, PR review,
    approval, or merge.

operating_mode_policy:
  operating_mode: strict
  autonomy_class: operator_ratified_privileged
  default_for_migrated_v1_tenants: strict
  privileged_floor:
    privileged_mutation_classes: [deploy, governance, identity, security, attestation, redaction]
    required_ratifier_role: operator
    agent_reviewer: advisory_only
    agent_ratifier:
      status: reserved-inactive
      activation_requires: AOS-RATIFIER-MILESTONE
      active_authority: none
  policy_authority:
    ratification_required_for_modes: [auto, transcendence]
    activation_record_required: true
  emergency_override: operator_only
  risk_coverage:
    required_validation_refs:
      - VAL-OPERATING-MODE-ENUM
      - VAL-AUTONOMY-DEFAULT
      - VAL-AUTO-REQUIRES-OPERATOR-POLICY
      - VAL-TRANSCENDENCE-REQUIRES-OPERATOR-POLICY
      - VAL-PRIVILEGED-FLOOR-AGENT-DELEGATION
      - VAL-RATIFIER-REJECT-AGENT-RATIFIER-ACTIVE
      - VAL-EMERGENCY-OVERRIDE-OPERATOR-ONLY

requirements:
  - id: RV2-002-001
    spec_md_ref: FR-001
    statement: Define operating_mode enum values strict, auto, and transcendence.
    decisions: [OD-01]
    risk_refs: [RISK-RV2-002-MODE]
  - id: RV2-002-002
    spec_md_ref: FR-002
    statement: Define autonomy_class enum values including a reserved future agent-ratification placeholder.
    decisions: [Q-O7]
    risk_refs: [RISK-RV2-002-RATIFIER]
  - id: RV2-002-003
    spec_md_ref: FR-003
    statement: Migrated v1 tenants default to strict.
    decisions: [Q-O6]
    risk_refs: [RISK-RV2-002-DEFAULT]
  - id: RV2-002-004
    spec_md_ref: FR-004
    statement: Auto mode requires an Operator-ratified policy pointer before activation.
    decisions: [OD-01, OD-02]
    risk_refs: [RISK-RV2-002-AUTO]
  - id: RV2-002-005
    spec_md_ref: FR-005
    statement: Transcendence mode requires an Operator-ratified policy pointer before activation.
    decisions: [OD-01, OD-02]
    risk_refs: [RISK-RV2-002-AUTO]
  - id: RV2-002-006
    spec_md_ref: FR-006
    statement: Privileged mutation classes require Operator ratification in every mode.
    decisions: [OD-02, OD-22]
    risk_refs: [RISK-RV2-002-PRIVILEGE]
  - id: RV2-002-007
    spec_md_ref: FR-007
    statement: Agent reviewers are advisory-only for privileged classes.
    decisions: [Q-O4]
    risk_refs: [RISK-RV2-002-PRIVILEGE]
  - id: RV2-002-008
    spec_md_ref: FR-008
    statement: Agent ratifier remains reserved-inactive and rejected for active bindings.
    decisions: [Q-O7]
    risk_refs: [RISK-RV2-002-RATIFIER]
  - id: RV2-002-009
    spec_md_ref: FR-009
    statement: Emergency override remains Operator-only.
    decisions: [OD-22]
    risk_refs: [RISK-RV2-002-OVERRIDE]
  - id: RV2-002-010
    spec_md_ref: FR-010
    statement: Operating-mode metadata lives in sidecars, not inline Markdown metadata.
    decisions: [OD-24, Q-C2]
    risk_refs: [RISK-RV2-002-INLINE]
  - id: RV2-002-011
    spec_md_ref: FR-011
    statement: G2.002.0 stops at docs, schema, validator, examples, and spec substrate.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-002-SCOPE]
  - id: RV2-002-012
    spec_md_ref: FR-012
    statement: Runtime carrier propagation remains G2.002.1+ work.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-002-SCOPE]
  - id: RV2-002-013
    spec_md_ref: FR-013
    statement: Active-Work Ledger records carry optional operating_mode, autonomy_class, and lane_kind carrier fields.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-002-CARRIER-ENUM, RISK-RV2-002-CARRIER-COMPAT]
  - id: RV2-002-014
    spec_md_ref: FR-014
    statement: lane_kind enumerates read-only, implementation, review, approval, merge, and audit.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-002-ROLE-SEP]
  - id: RV2-002-015
    spec_md_ref: FR-015
    statement: Carrier records may carry an inherited ratification-evidence pointer for elevated modes and privileged lane kinds.
    decisions: [OD-01, OD-02]
    risk_refs: [RISK-RV2-002-CARRIER-ELEVATION]
  - id: RV2-002-016
    spec_md_ref: FR-016
    statement: ce lane launch defaults operating_mode to strict.
    decisions: [Q-O6, OD-23]
    risk_refs: [RISK-RV2-002-CLI-DEFAULT]
  - id: RV2-002-017
    spec_md_ref: FR-017
    statement: ce lane launch refuses auto or transcendence without an Operator-ratified tenant policy, before any side effect.
    decisions: [OD-01, OD-02]
    risk_refs: [RISK-RV2-002-CLI-DEFAULT, RISK-RV2-002-CARRIER-ELEVATION]
  - id: RV2-002-018
    spec_md_ref: FR-018
    statement: ce lane launch refuses a privileged class naming agent_ratifier or an advisory role as ratifier, before any side effect.
    decisions: [OD-02, OD-22, Q-O7]
    risk_refs: [RISK-RV2-002-CLI-RATIFIER]
  - id: RV2-002-019
    spec_md_ref: FR-019
    statement: Runtime carriers preserve the Operator-only privileged floor in every mode.
    decisions: [OD-02, OD-22]
    risk_refs: [RISK-RV2-002-PRIVILEGE, RISK-RV2-002-OVERRIDE]
  - id: RV2-002-020
    spec_md_ref: FR-020
    statement: Absent or migrated operating-mode carriers resolve to strict; migration never infers elevation.
    decisions: [Q-O6]
    risk_refs: [RISK-RV2-002-DEFAULT]
  - id: RV2-002-021
    spec_md_ref: FR-021
    statement: The carrier extension is additive; schema_version includes "4" and pre-v4 records validate unchanged.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-002-CARRIER-COMPAT]
  - id: RV2-002-022
    spec_md_ref: FR-022
    statement: Review/approval/merge lane kinds are representable and documented as downstream-enforced; PR-review enforcement is not implemented here.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-002-ROLE-SEP]
  - id: RV2-002-023
    spec_md_ref: FR-023
    statement: The Assignment Envelope representation carries operating mode, autonomy class, and ratification pointer as pure carriers introducing no new authority.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-002-CARRIER-ELEVATION]

risk_inventory:
  - id: RISK-RV2-002-MODE
    title: Unknown or ambiguous operating mode.
    relevance: [governance, autonomy]
    description: A sidecar activates an undefined operating mode and bypasses fail-closed validation.
    severity: high
    required_validation_refs: [VAL-OPERATING-MODE-ENUM]
  - id: RISK-RV2-002-DEFAULT
    title: Migrated v1 tenant defaults to auto.
    relevance: [migration, autonomy]
    description: A migrated tenant inherits more autonomy than Operator ratified.
    severity: critical
    required_validation_refs: [VAL-AUTONOMY-DEFAULT, VAL-CARRIER-MIGRATED-DEFAULT-STRICT]
  - id: RISK-RV2-002-AUTO
    title: Auto or transcendence mode without Operator policy pointer.
    relevance: [governance, autonomy]
    description: A higher-autonomy mode activates without a ratified Operator policy.
    severity: critical
    required_validation_refs: [VAL-AUTO-REQUIRES-OPERATOR-POLICY, VAL-TRANSCENDENCE-REQUIRES-OPERATOR-POLICY]
  - id: RISK-RV2-002-PRIVILEGE
    title: Privileged floor delegated to agent role.
    relevance: [governance, identity, security]
    description: An agent reviewer or other agent role satisfies privileged ratification.
    severity: critical
    required_validation_refs: [VAL-PRIVILEGED-FLOOR-AGENT-DELEGATION]
  - id: RISK-RV2-002-RATIFIER
    title: Agent ratifier activated prematurely.
    relevance: [governance, identity]
    description: Reserved future agent ratification becomes active before AOS ratifier milestone.
    severity: critical
    required_validation_refs: [VAL-RATIFIER-REJECT-AGENT-RATIFIER-ACTIVE, VAL-CARRIER-RESERVED-AUTONOMY-ACTIVE]
  - id: RISK-RV2-002-OVERRIDE
    title: Emergency override not Operator-only.
    relevance: [governance, security]
    description: Emergency governed override is delegated to an agent or automatic policy.
    severity: critical
    required_validation_refs: [VAL-EMERGENCY-OVERRIDE-OPERATOR-ONLY]
  - id: RISK-RV2-002-INLINE
    title: Operating-mode metadata embedded in Markdown.
    relevance: [governance, metadata]
    description: CE metadata leaks into standard Spec Kit Markdown instead of sidecars.
    severity: medium
    required_validation_refs: [VAL-OPERATING-MODE-NO-INLINE]
  - id: RISK-RV2-002-SCOPE
    title: Runtime carrier work bundled into G2.002.0.
    relevance: [governance, runtime]
    description: Runtime lane/ledger/envelope propagation is implemented before separate ratification.
    severity: high
    required_validation_refs: [VAL-OPERATING-MODE-SCOPE]
  - id: RISK-RV2-002-CARRIER-ENUM
    title: Unknown carrier operating mode, autonomy class, or lane kind.
    relevance: [governance, runtime, autonomy]
    description: A runtime-carrier record carries an undefined operating_mode, autonomy_class, or lane_kind and bypasses fail-closed validation.
    severity: high
    required_validation_refs: [VAL-CARRIER-MODE-ENUM, VAL-CARRIER-LANE-KIND-ENUM, VAL-CARRIER-AUTONOMY-ENUM]
  - id: RISK-RV2-002-CARRIER-ELEVATION
    title: Elevated carrier without inherited ratification evidence.
    relevance: [governance, autonomy, runtime]
    description: A carrier record or lane launch elevates to auto/transcendence or a privileged lane kind without an Operator-ratified ratification-evidence pointer.
    severity: critical
    required_validation_refs: [VAL-CARRIER-ELEVATION-REQUIRES-RATIFICATION, VAL-LANE-LAUNCH-ELEVATION-REFUSED]
  - id: RISK-RV2-002-CARRIER-COMPAT
    title: Carrier extension breaks pre-v4 records.
    relevance: [migration, runtime]
    description: The additive carrier fields or schema_version bump invalidates existing v1-v3 Active-Work Ledger records.
    severity: high
    required_validation_refs: [VAL-CARRIER-BACKWARD-COMPAT]
  - id: RISK-RV2-002-CLI-DEFAULT
    title: Lane launch default not strict or elevated mode allowed without policy.
    relevance: [governance, autonomy, runtime]
    description: ce lane launch defaults to a non-strict mode, or activates auto/transcendence without an Operator-ratified tenant policy.
    severity: critical
    required_validation_refs: [VAL-LANE-LAUNCH-DEFAULT-STRICT, VAL-LANE-LAUNCH-ELEVATION-REFUSED]
  - id: RISK-RV2-002-CLI-RATIFIER
    title: Privileged ratifier misuse at lane launch.
    relevance: [governance, identity, security]
    description: ce lane launch accepts a privileged class naming agent_ratifier or an advisory role as the ratifier.
    severity: critical
    required_validation_refs: [VAL-LANE-LAUNCH-RATIFIER-REFUSED, VAL-CARRIER-AGENT-RATIFIER-ACTIVE]
  - id: RISK-RV2-002-ROLE-SEP
    title: PR-review role separation not carried.
    relevance: [governance, runtime]
    description: Review/approval/merge lane kinds cannot be distinguished from implementation lanes in carrier records.
    severity: medium
    required_validation_refs: [VAL-CARRIER-ROLE-SEPARATION]

