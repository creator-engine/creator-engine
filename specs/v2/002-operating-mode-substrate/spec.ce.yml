    sha256: 7addcf95b84b1fe1b22e97811d10785f01895aa1193ec9a498034b2108995780
  g20021_runtime_carriers:
    ratified_execution_prompt:
      path: .hermes/research/g20021-operating-mode-runtime-carriers-automode-architect-20260530T142428Z/recommended-next/NEXT_OPERATOR_G20021_AUTOMODE_CONTROLLER_EXECUTION_PROMPT_REVIEWED_20260530T145048Z.md
