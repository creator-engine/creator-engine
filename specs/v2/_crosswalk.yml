# Creator Engine v1 -> v2 Crosswalk Register (canonical)
#
# CE-governed redo of G2.001.0. Decision basis: Q-C3 (single tracked canonical
# crosswalk at specs/v2/_crosswalk.yml), OD-06/OD-06A/OD-08/OD-21/OD-23.
#
# This file is the authoritative spec-level v1->v2 crosswalk. Importers,
# validators, roadmap artifacts, and migration tooling MUST treat it as
# authoritative. Derived/runtime/tenant-expanded crosswalk material may live
# under .ce/crosswalks/, but MUST NOT silently supersede this register.
#
# BOOTSTRAP NOTE: The formal crosswalk_register JSON Schema + validator land at
# G2.001.4. This file is a forward-declared bootstrap register; its shape
# anticipates that schema.

schema: creator-engine/crosswalk-register
schema_version: "2.0.0-draft"
schema_status: forward-declared-bootstrap    # formal schema/validator land at G2.001.4
authoritative: true
derived_material_note: >-
  .ce/crosswalks/ may hold derived, runtime, tenant-specific, or expanded
  crosswalk material, but this tracked register is authoritative and is not
  superseded by derived material.

decision_refs: [Q-C3, OD-06, OD-06A, OD-08, OD-21, OD-23]

# --- Role / terminology mappings (source -> operator) --------------------------
roles:
  - source: source
    operator: operator
    axis: human-authority-machine-role
    disposition: import-alias-only            # OD-06/OD-21: source accepted on import; never emitted by new v2
    emit_in_v2: false
    accept_on_import: true
    notes: operator is the only canonical v2 emitted human-authority machine role.
  - source: agent_reviewer
    operator: agent_reviewer
    axis: agent-role
    disposition: new-active-role              # Q-O4: active advisory; non-ratifying
    emit_in_v2: true
  - source: agent_ratifier
    operator: agent_ratifier
    axis: agent-role
    disposition: reserved-inactive            # Q-O7: schema-present; validator-rejected for active authority
    emit_in_v2: schema-placeholder-only
    future_activation_milestone: AOS-RATIFIER-MILESTONE

ratification_line:
  v1_accepted: ["Operator ratifies prompt:", "Source ratifies prompt:"]
  v2_emit: "Operator ratifies prompt:"
  accept_source_on_import: true               # ADR-0002 §3 compatibility preserved on import only

# --- State-path mappings (.hermes/ -> .ce/) ------------------------------------
state_paths:
  active_state_root:
    v1: .hermes/
    v2: .ce/
    disposition: retarget                     # OD-06A
    legacy_restriction: >-
      .hermes/ is read-only legacy/import/archive/historical/Hermes-controller
      infrastructure context. v2 flows MUST NOT write active CE state to
      .hermes/ (Q-O2 write-freeze).
  subtrees:
    - v1: .hermes/active-work-ledger/
      v2: .ce/active-work-ledger/
      disposition: retarget
      zone: gitignored-instance
    - v1: .hermes/side-effect-ledger/
      v2: .ce/side-effect-ledger/
      disposition: retarget
      zone: gitignored-instance
    - v1: .hermes/pcl/
      v2: .ce/pcl/
      disposition: retarget
      zone: split                             # records/ tracked-or-synced; cache/ gitignored
    - v1: .hermes/ce-events/
      v2: .ce/ce-events/
      disposition: retarget
      zone: split                             # records/ tracked-or-synced; spool/ gitignored
    - v1: .hermes/directive-packs/
      v2: .ce/directive-packs/
      disposition: retarget
      zone: tracked-governance
  import_rules:
    - The v1->v2 importer MAY read .hermes/ but MUST emit canonical .ce/ outputs (Q-O3).
    - The importer MUST never mutate .hermes/.
    - Imported records MUST carry provenance + crosswalk metadata and MUST NOT reintroduce .hermes/ as active v2 state.
    - Empty input yields an explicit clean no-op.

# --- Feature-label mappings (old Feature 008-021 -> specs/v2/NNN) --------------
# OD-08 establishes specs/v2/NNN. The old Architect Feature 008-021 working
# labels are stale pre-OD-08 references mapped here for import/traceability only.
