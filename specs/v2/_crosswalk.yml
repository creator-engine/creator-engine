spec_namespace_note:
  v1_proposed: specs/008...021
  v2: specs/v2/001...015
  disposition: rejected-to-v2                 # OD-08

# --- Sidecar filename mappings (*.creator-engine.yml -> *.ce.yml) --------------
sidecars:
  - v1: spec.creator-engine.yml
    v2: spec.ce.yml
    disposition: rename
    accept_v1_as_import_alias: true           # Q-C2
  - v1: plan.creator-engine.yml
    v2: plan.ce.yml
    disposition: rename
    accept_v1_as_import_alias: true
  - v1: tasks.creator-engine.yml
    v2: tasks.ce.yml
    disposition: rename
    accept_v1_as_import_alias: true

sidecar_inline_metadata_rule: >-
  CE metadata MUST live in *.ce.yml sidecars, never inline in standard Spec Kit
  Markdown (OD-24 / Q-C2).

# --- Other axis mappings -------------------------------------------------------
other_axes:
  - axis: requirement-id
    v1: RV1-NNN
    v2: RV2-<specNNN>-<reqNNN>
    disposition: new-namespace                # Q-C4
  - axis: gate-numbering
    v1: "G0..G8 / PCO Slice 0..6"
    v2: "G2.<feature>.<slice>"
    disposition: distinct-generation          # OD-07
  - axis: adr-namespace
    v1: ADR-000N (docs/adr/)
    v2: ADR-V2-NNN (specs/v2/adrs/)
    disposition: new-namespace                # Q-C8
  - axis: task-autonomy-field
    v1: "[SYNC]/[ASYNC] (external import only)"
    v2: "operating_mode + autonomy_class"
    disposition: ce-native                    # OD-13
  - axis: release-vehicle
    v1: "v1.5-v1.9 arc (proposed)"
    v2: "CE v2.0 foundation line"
    disposition: rejected-to-v2               # OD-23

# --- v1 archived/import context vs v2 canonical emission context ---------------
context_disposition:
  v1_archived_import_context:
    description: >-
      Material whose only valid v2 role is read-only import, parser
      compatibility, migration source, archival review, or historical citation.
    includes:
      - .hermes/ active-state paths (read-only)
      - source / Source role values and ratification lines (accept on import)
      - "*.creator-engine.yml sidecars (accept as import alias)"
      - old Feature 008-021 working labels
      - specs/008...021 proposed namespace
    rules:
      - Readable, never emitted by new v2 artifacts.
      - Never written/mutated by v2 flows.
      - No destructive removal in v2.0 (Q-O5).
  v2_canonical_emission_context:
    description: The only context new v2 artifacts emit into.
    includes:
      - .ce/ active-state paths
      - operator role value and "Operator ratifies prompt:" line
      - "*.ce.yml sidecars"
      - specs/v2/NNN spec namespace
      - G2.<feature>.<slice> gate IDs
      - RV2-<specNNN>-<reqNNN> requirement IDs
      - ADR-V2-NNN under specs/v2/adrs/
    rules:
      - Canonical for all new Phase 2+ artifacts (OD-21).
      - Privileged-class ratification + emergency override remain Operator-only (OD-02/OD-22).
