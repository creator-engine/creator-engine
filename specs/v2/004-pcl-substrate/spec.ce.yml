schema: creator-engine/spec.ce.yml
schema_version: "2.0.0-draft"
schema_status: formalized
ce_metadata_kind: spec-ce-sidecar

spec:
  id: specs/v2/004-pcl-substrate
  spec_number: "004"
  title: Creator Engine v2.0 PCL (Project Coordination Ledger) record substrate
  namespace: specs/v2
  spec_md: spec.md
  status: draft
  release_line: v2.0-foundation

gate:
  id: G2.004.1
  feature_binding: specs/v2/004
  slice: "1"
  title: PCL runtime
  layer: 2
  predecessor_gate:
    id: G2.004.0
    slice: "0"
    title: PCL record substrate
    status: merged
  note: >-
    Slice-order note: G2.004.0 (record substrate, PR #94) and G2.004.2 (federated
    identity + distributed claim substrate, PR #96) landed before this runtime
    slice because G2.004.1 was dependency-gated on G2.003.1 (CE-event runtime, PR
    #97, now merged). G2.004.1 is the active slice: it adds the
    `ce pcl {append,verify,replay,index,merge}` runtime over the tracked
    .ce/pcl/records/ home (the rebuildable index/merge cache lives under the
    ignored .ce/pcl/cache/). It reuses the G2.004.0 validator for every shape
    decision, imports no CE-event or distributed-identity code, ratifies nothing,
    performs no signing or key custody, and activates no operating mode.

authority_basis:
  ratified_prompt:
    path: .hermes/research/parallel-g20031-g20040-architect-planning-20260531T061635Z/recommended-next/NEXT_OPERATOR_G20040_PCL_SUBSTRATE_AUTOMODE_EXECUTION_PROMPT_CONTROLLER_REVIEWED_20260531T065115Z.md
    sha256: 85dd562e09279922131a1f6a4c00038d22b45b872c55cdda4e35c24c44a90ab7
  architect_plan:
    path: .hermes/research/parallel-g20031-g20040-architect-planning-20260531T061635Z/architect-output/G20040_PCL_SUBSTRATE_AUTOMODE_EXECUTION_PLAN.md
    sha256: f5acfea5395122db42c0c99e2f7d599916475a92ed510a582c1b26742036ab4e
  ratified_prompt_g2_004_2:
    path: .hermes/research/g20042-distributed-identity-substrate-planning-20260531T105922Z/recommended-next/NEXT_OPERATOR_G20042_DISTRIBUTED_IDENTITY_SUBSTRATE_AUTOMODE_EXECUTION_PROMPT_20260531T105922Z.md
    sha256: 707c6e6023768e5d68da033123feeae5a342181e8bb59ed3435e19cde5757ba0
  ratified_prompt_g2_004_1:
    path: .hermes/research/g20041-pcl-runtime-planning-20260531T164841Z/recommended-next/NEXT_OPERATOR_G20041_PCL_RUNTIME_AUTOMODE_EXECUTION_PROMPT_20260531T164841Z.md
    sha256: e8c0590f01949836c6fa7a449f73adbe30e773e9e00efcf52740e60df6e00279
  note: >-
    This sidecar records G2.004.0 + G2.004.2 substrate authority and the G2.004.1
    runtime authority. It ratifies nothing, performs no signing or key custody,
    and does not activate any operating mode; PCL records are tracked-or-synced
    under .ce/pcl/records/ and the index/merge cache is git-ignored under
    .ce/pcl/cache/.

operating_mode_relevance:
  modes: [strict, auto, transcendence]
  authoring_mode: strict
  default_mode_for_migrated_v1_tenants: strict
  notes: >-
    PCL records may record operating-mode context, but G2.004.0 does not activate
    or propagate runtime operating mode.

authority:
  mutation_classes: [governance, attestation]
  privileged: true
  required_ratifier_role: operator
  agent_reviewer: advisory_only
  agent_ratifier: reserved_inactive
  emergency_override: operator_only
  authoring_authority_boundary: >-
    Docs, schema, validator, examples, tests, and spec substrate only. No ce pcl
    runtime, no .ce/pcl/ live writes, no federated identity, no distributed
    claim, no connector, CI, deploy, review, approval, or merge.

state_boundary:
  canonical_future_pcl_home: .ce/pcl/
  substrate_writes_pcl_state: false
  legacy_pcl_home_write_freeze: .hermes/pcl/
  notes: >-
    This gate defines shape and validation only. Runtime ledger records are a
    later, separately ratified gate (G2.004.1). The future .ce/pcl/ home is
    split per the G2.001.0 state boundary: records/ is tracked-or-synced and
    cache/ is gitignored. Active PCL state MUST NOT be written under .hermes/pcl/.

requirements:
  - id: RV2-004-001
    spec_md_ref: FR-001
    statement: Define canonical PCL record fields with a record_kind discriminator.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-SHAPE]
  - id: RV2-004-002
    spec_md_ref: FR-002
    statement: Enforce deterministic content addressing.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-HASH]
  - id: RV2-004-003
    spec_md_ref: FR-003
    statement: Enforce hash-chain linkage.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-CHAIN]
  - id: RV2-004-004
    spec_md_ref: FR-004
    statement: Discriminate records by a closed record_kind enum.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-KIND]
  - id: RV2-004-005
    spec_md_ref: FR-005
    statement: Preserve Operator-only privileged floor; PCL never ratifies and agent_ratifier stays reserved-inactive.
    decisions: [OD-22]
    risk_refs: [RISK-RV2-004-ROLE]
  - id: RV2-004-006
    spec_md_ref: FR-006
    statement: Record operating-mode context without activation.
    decisions: [OD-01, OD-23]
    risk_refs: [RISK-RV2-004-MODE]
  - id: RV2-004-007
    spec_md_ref: FR-007
    statement: Reference CE-event blocks only by opaque 64-hex content hash with no CE-event import.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-POINTER]
  - id: RV2-004-008
    spec_md_ref: FR-008
    statement: Validate signature field shape while deferring cryptography.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-SIGNATURE]
  - id: RV2-004-009
    spec_md_ref: FR-009
    statement: Keep CE metadata in spec.ce.yml sidecars.
    decisions: [OD-24]
    risk_refs: [RISK-RV2-004-INLINE]
  - id: RV2-004-010
    spec_md_ref: FR-010
    statement: Preserve .ce/pcl as future home and freeze .hermes/pcl active writes.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-WRITE]
  - id: RV2-004-011
    spec_md_ref: FR-011
    statement: Provide fail-closed validator coverage.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-VALIDATOR]
  - id: RV2-004-012
    spec_md_ref: FR-012
    statement: Stop before live ledger emission, ce pcl runtime, .ce/pcl/ live writes, federated identity, distributed claim, connector, CI, deploy, or runtime autonomy activation.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-004-SCOPE]
  - id: RV2-004-013
    spec_md_ref: FR-013
    statement: Define the canonical federated identity binding record fields with a record_kind discriminator.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-FIB-SHAPE]
  - id: RV2-004-014
    spec_md_ref: FR-014
    statement: Require a cross-repo binding shape with opaque identifiers and at least two repo bindings; revocations reference the prior binding by opaque hash.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-FIB-SHAPE]
  - id: RV2-004-015
    spec_md_ref: FR-015
    statement: Define the canonical distributed claim record fields with a record_kind discriminator.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-DC-SHAPE]
  - id: RV2-004-016
    spec_md_ref: FR-016
    statement: Bind claims to a federated identity binding and reference CE-event/PCL artifacts only by opaque 64-hex hashes with no code import.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-DC-POINTER, RISK-RV2-004-DECOUPLE]
  - id: RV2-004-017
    spec_md_ref: FR-017
    statement: Enforce deterministic content addressing and hash-chain linkage for both families.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-DI-HASH, RISK-RV2-004-DI-CHAIN]
  - id: RV2-004-018
    spec_md_ref: FR-018
    statement: Preserve the Operator-only privileged floor; these records never ratify and agent_ratifier stays reserved-inactive.
    decisions: [OD-22]
    risk_refs: [RISK-RV2-004-DI-ROLE]
  - id: RV2-004-019
    spec_md_ref: FR-019
    statement: Record operating-mode context only, validate signature shape, and forbid inline metadata in Markdown.
    decisions: [OD-01, OD-24]
    risk_refs: [RISK-RV2-004-DI-SIGNATURE, RISK-RV2-004-DI-INLINE]
  - id: RV2-004-020
    spec_md_ref: FR-020
    statement: Preserve .ce/ as the future home and freeze active writes under legacy .hermes/ paths.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-DI-WRITE]
  - id: RV2-004-021
    spec_md_ref: FR-021
    statement: Provide fail-closed validator coverage for both families with targeted VAL-FIB-* and VAL-DC-* codes.
    decisions: [OD-08]
    risk_refs: [RISK-RV2-004-DI-VALIDATOR]
  - id: RV2-004-022
    spec_md_ref: FR-022
    statement: Stop before distributed-identity/claim runtime, .ce/ live writes, signing, key custody, connector, queue, CI, deploy, or runtime autonomy activation.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-004-DI-SCOPE]
  - id: RV2-004-023
    spec_md_ref: FR-023
    statement: ce pcl append validates a record against the G2.004.0 schema and the chain head before writing it content-addressed to the tracked .ce/pcl/records/ home; all refusals raise before any write.
    decisions: [OD-08, OD-09]
    risk_refs: [RISK-RV2-004-RT-WRITE]
  - id: RV2-004-024
    spec_md_ref: FR-024
    statement: ce pcl verify reconstructs and validates the on-disk chain fail-closed (content addressing, linkage, role floor, mode, signature, pointer shape, head agreement).
    decisions: [OD-09]
    risk_refs: [RISK-RV2-004-RT-CHAIN]
  - id: RV2-004-025
    spec_md_ref: FR-025
    statement: ce pcl replay emits a deterministic ordered read-only projection of the verified chain.
    decisions: [OD-09]
    risk_refs: [RISK-RV2-004-RT-NONDET]
  - id: RV2-004-026
    spec_md_ref: FR-026
    statement: ce pcl index builds a deterministic content-hashed index written only to the git-ignored .ce/pcl/cache/.
    decisions: [OD-09]
    risk_refs: [RISK-RV2-004-RT-NONDET]
  - id: RV2-004-027
    spec_md_ref: FR-027
    statement: ce pcl merge deterministically unions verified ledgers and fails closed on any fork; merge never mutates authoritative records and never ratifies.
    decisions: [OD-09]
    risk_refs: [RISK-RV2-004-RT-FORK]
  - id: RV2-004-028
    spec_md_ref: FR-028
    statement: Records are tracked-or-synced under .ce/pcl/records/; the rebuildable cache under .ce/pcl/cache/ must be git-ignored; legacy .hermes/ active writes are refused.
    decisions: [OD-06A, OD-09]
    risk_refs: [RISK-RV2-004-RT-STATE]
  - id: RV2-004-029
    spec_md_ref: FR-029
    statement: The runtime preserves the privileged floor (non-ratifying emitting_role, reserved-inactive signature, no signing/key custody), reuses the G2.004.0 validator, and imports no CE-event or distributed-identity code.
    decisions: [OD-22]
    risk_refs: [RISK-RV2-004-RT-FLOOR, RISK-RV2-004-RT-COUPLE]
  - id: RV2-004-030
    spec_md_ref: FR-030
    statement: Stop before real signing/key custody, federated-identity/distributed-claim runtime, connector/queue runtime, CI/deploy hooks, and auto/transcendence activation.
    decisions: [OD-23]
    risk_refs: [RISK-RV2-004-RT-FLOOR]

risk_inventory:
  - id: RISK-RV2-004-SHAPE
    title: Ambiguous PCL record shape.
    relevance: [governance, attestation]
    description: Consumers cannot validate or replay PCL records deterministically.
    severity: high
    required_validation_refs: [VAL-PCL-SCHEMA]
  - id: RISK-RV2-004-HASH
    title: Forged or unstable content hash.
    relevance: [attestation]
    description: A record claims a digest that does not match canonical content.
    severity: critical
    required_validation_refs: [VAL-PCL-CONTENT-ADDRESS]
  - id: RISK-RV2-004-CHAIN
    title: Broken coordination chain.
    relevance: [audit]
    description: Record order can be forked, reordered, or detached.
    severity: critical
    required_validation_refs: [VAL-PCL-CHAIN-LINK]
  - id: RISK-RV2-004-KIND
    title: Unknown record kind.
    relevance: [governance]
    description: A record declares a coordination kind outside the canonical enum.
    severity: high
    required_validation_refs: [VAL-PCL-RECORD-KIND]
  - id: RISK-RV2-004-ROLE
    title: Reserved ratifier or non-canonical role emits a coordination record.
    relevance: [governance, identity]
    description: Reserved ratification role is treated as active authority or PCL is used to ratify.
    severity: critical
    required_validation_refs: [VAL-PCL-ROLE-FLOOR]
  - id: RISK-RV2-004-MODE
    title: Unknown operating-mode context.
    relevance: [governance, autonomy]
    description: A record context names an unratified or ambiguous autonomy mode.
    severity: high
    required_validation_refs: [VAL-PCL-MODE-ENUM]
  - id: RISK-RV2-004-POINTER
    title: Malformed or coupling CE-event pointer.
    relevance: [attestation, state-boundary]
    description: An event_block_pointer omits the opaque 64-hex hash or couples PCL to CE-event internals.
    severity: high
    required_validation_refs: [VAL-PCL-POINTER-SHAPE]
  - id: RISK-RV2-004-SIGNATURE
    title: Signature semantics activated early.
    relevance: [identity, attestation]
    description: Shape-only signature fields are mistaken for live key custody.
    severity: high
    required_validation_refs: [VAL-PCL-SIGNATURE-SHAPE]
  - id: RISK-RV2-004-INLINE
    title: Inline PCL metadata in Markdown.
    relevance: [metadata]
    description: PCL metadata leaks into Spec Kit prose instead of sidecars/examples.
    severity: medium
    required_validation_refs: [VAL-PCL-NO-INLINE]
  - id: RISK-RV2-004-WRITE
    title: Legacy ledger-state write.
    relevance: [state-boundary]
    description: A v2 PCL record targets .hermes/pcl as active runtime state.
    severity: high
    required_validation_refs: [VAL-PCL-WRITE-FREEZE]
  - id: RISK-RV2-004-VALIDATOR
    title: Validator coverage gap.
    relevance: [quality]
    description: A malformed record reaches PR review without fail-closed evidence.
    severity: high
    required_validation_refs: [VAL-PCL-SCHEMA, VAL-PCL-CONTENT-ADDRESS, VAL-PCL-CHAIN-LINK]
  - id: RISK-RV2-004-SCOPE
    title: Runtime bundled into substrate gate.
    relevance: [governance, runtime]
    description: Live ledger emission or ce pcl runtime is implemented before separate ratification.
    severity: critical
    required_validation_refs: [VAL-PCL-WRITE-FREEZE]
  - id: RISK-RV2-004-FIB-SHAPE
    title: Ambiguous federated identity binding shape.
    relevance: [governance, identity]
    description: A cross-repo binding cannot be validated deterministically or omits the multi-repo binding shape.
    severity: high
    required_validation_refs: [VAL-FIB-SCHEMA, VAL-FIB-BINDING-SHAPE]
  - id: RISK-RV2-004-DC-SHAPE
    title: Ambiguous distributed claim shape.
    relevance: [governance]
    description: A distributed claim cannot be validated or replayed deterministically.
    severity: high
    required_validation_refs: [VAL-DC-SCHEMA]
  - id: RISK-RV2-004-DC-POINTER
    title: Malformed claim pointer.
    relevance: [attestation, state-boundary]
    description: A claim omits the opaque 64-hex binding_ref or carries a non-64-hex CE-event/PCL pointer.
    severity: high
    required_validation_refs: [VAL-DC-POINTER-SHAPE]
  - id: RISK-RV2-004-DECOUPLE
    title: Coupling to CE-event or PCL internals.
    relevance: [state-boundary]
    description: The substrate imports CE-event or PCL code/schema instead of referencing by opaque hash, breaking G2.003.1 parallel-safety.
    severity: critical
    required_validation_refs: [VAL-DC-POINTER-SHAPE]
  - id: RISK-RV2-004-DI-HASH
    title: Forged or unstable content hash.
    relevance: [attestation]
    description: A record claims a digest that does not match canonical content.
    severity: critical
    required_validation_refs: [VAL-FIB-CONTENT-ADDRESS, VAL-DC-CONTENT-ADDRESS]
  - id: RISK-RV2-004-DI-CHAIN
    title: Broken coordination chain.
    relevance: [audit]
    description: Record order can be forked, reordered, or detached.
    severity: critical
    required_validation_refs: [VAL-FIB-CHAIN-LINK, VAL-DC-CHAIN-LINK]
  - id: RISK-RV2-004-DI-ROLE
    title: Reserved ratifier or non-canonical role emits a record.
    relevance: [governance, identity]
    description: A reserved ratification role is treated as active authority or these records are used to ratify.
    severity: critical
    required_validation_refs: [VAL-FIB-ROLE-FLOOR, VAL-DC-ROLE-FLOOR]
  - id: RISK-RV2-004-DI-SIGNATURE
    title: Signature semantics activated early.
    relevance: [identity, attestation]
    description: Shape-only signature fields are mistaken for live key custody.
    severity: high
    required_validation_refs: [VAL-FIB-SIGNATURE-SHAPE, VAL-DC-SIGNATURE-SHAPE]
  - id: RISK-RV2-004-DI-INLINE
    title: Inline distributed-identity metadata in Markdown.
    relevance: [metadata]
    description: Record metadata leaks into Spec Kit prose instead of sidecars/examples.
    severity: medium
    required_validation_refs: [VAL-FIB-NO-INLINE, VAL-DC-NO-INLINE]
  - id: RISK-RV2-004-DI-WRITE
    title: Legacy active-state write.
    relevance: [state-boundary]
    description: A v2 record targets a legacy .hermes/ path as active coordination/identity state.
    severity: high
    required_validation_refs: [VAL-FIB-WRITE-FREEZE, VAL-DC-WRITE-FREEZE]
  - id: RISK-RV2-004-DI-VALIDATOR
    title: Validator coverage gap.
    relevance: [quality]
    description: A malformed record reaches PR review without fail-closed evidence.
    severity: high
    required_validation_refs: [VAL-FIB-SCHEMA, VAL-DC-SCHEMA]
  - id: RISK-RV2-004-DI-SCOPE
    title: Runtime bundled into the distributed-identity substrate gate.
    relevance: [governance, runtime]
    description: Distributed-identity/claim runtime or signing is implemented before separate ratification.
    severity: critical
    required_validation_refs: [VAL-FIB-WRITE-FREEZE, VAL-DC-WRITE-FREEZE]
  - id: RISK-RV2-004-DI-KIND
    title: Unknown distributed-identity record kind.
    relevance: [governance]
    description: A binding or claim declares a record kind outside its canonical enum.
    severity: high
    required_validation_refs: [VAL-FIB-RECORD-KIND, VAL-DC-RECORD-KIND]
  - id: RISK-RV2-004-DI-MODE
    title: Unknown operating-mode context on a distributed-identity record.
    relevance: [governance, autonomy]
    description: A binding or claim context names an unratified or ambiguous autonomy mode.
    severity: high
    required_validation_refs: [VAL-FIB-MODE-ENUM, VAL-DC-MODE-ENUM]
  - id: RISK-RV2-004-RT-WRITE
    title: Runtime writes an invalid or forged record.
    relevance: [attestation, runtime]
    description: ce pcl append writes a record that fails the landed shape/role/mode/signature floor or is not content-addressed.
    severity: critical
    required_validation_refs: [VAL-PCL-RT-APPEND, VAL-PCL-RT-FLOOR]
  - id: RISK-RV2-004-RT-CHAIN
    title: Verify misses a broken or forged chain.
    relevance: [audit, runtime]
    description: ce pcl verify accepts a forged content_hash or a broken parent-hash linkage.
    severity: critical
    required_validation_refs: [VAL-PCL-RT-VERIFY]
  - id: RISK-RV2-004-RT-NONDET
    title: Non-deterministic replay or index.
    relevance: [quality, runtime]
    description: replay/index output varies across runs, breaking reproducibility.
    severity: high
    required_validation_refs: [VAL-PCL-RT-REPLAY, VAL-PCL-RT-INDEX]
  - id: RISK-RV2-004-RT-FORK
    title: Merge silently resolves a fork.
    relevance: [governance, runtime]
    description: ce pcl merge combines divergent ledgers without failing closed on a fork, or mutates authoritative records.
    severity: critical
    required_validation_refs: [VAL-PCL-RT-MERGE]
  - id: RISK-RV2-004-RT-STATE
    title: State-boundary violation.
    relevance: [state-boundary, runtime]
    description: Records are written to an ignored path or under legacy .hermes/, or the rebuildable cache is tracked.
    severity: high
    required_validation_refs: [VAL-PCL-RT-STATE-BOUNDARY]
  - id: RISK-RV2-004-RT-FLOOR
    title: Runtime bypasses the privileged floor or activates a mode.
    relevance: [governance, identity, runtime]
    description: The runtime emits with a ratifying role, activates a signature/mode, or performs signing/key custody before separate ratification.
    severity: critical
    required_validation_refs: [VAL-PCL-RT-FLOOR]
  - id: RISK-RV2-004-RT-COUPLE
    title: Runtime couples to CE-event or distributed-identity code.
    relevance: [state-boundary, runtime]
    description: pcl_runtime imports CE-event or distributed-identity code instead of opaque-hash references, breaking decoupling.
    severity: high
    required_validation_refs: [VAL-PCL-RT-DECOUPLE]

required_validation:
  - id: VAL-PCL-SCHEMA
    description: Reject malformed PCL record records.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-CONTENT-ADDRESS
    description: Reject content_hash values that do not match canonical record material.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-CHAIN-LINK
    description: Reject chains with missing or incorrect parent_hash linkage.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-RECORD-KIND
    description: Reject record_kind values outside the canonical PCL enum.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-ROLE-FLOOR
    description: Reject non-canonical emitting roles and reserved active ratifier roles.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-MODE-ENUM
    description: Reject unknown operating_mode values.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-POINTER-SHAPE
    description: Reject event_block_pointer records without an opaque 64-hex ce_event_content_hash.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-SIGNATURE-SHAPE
    description: Validate shape-only signature fields and reserved-inactive value.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-NO-INLINE
    description: Reject inline PCL metadata in Markdown.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-PCL-WRITE-FREEZE
    description: Reject active writes targeting .hermes/pcl.
    planned_slice: G2.004.0
    planned_validator: pcl_record
    status: implemented
  - id: VAL-FIB-SCHEMA
    description: Reject malformed federated identity binding records.
    planned_slice: G2.004.2
    planned_validator: federated_identity_binding
    status: implemented
  - id: VAL-FIB-CONTENT-ADDRESS
    description: Reject federated identity binding content_hash values that do not match canonical material.
    planned_slice: G2.004.2
    planned_validator: federated_identity_binding
    status: implemented
  - id: VAL-FIB-CHAIN-LINK
    description: Reject federated identity binding chains with missing or incorrect parent_hash linkage.
    planned_slice: G2.004.2
    planned_validator: federated_identity_binding
    status: implemented
