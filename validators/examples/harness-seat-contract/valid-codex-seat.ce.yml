# G2.007.1 promotion: a Codex Controller seat-contract on the harness-agnostic shape.
# Codex implements full_permission_mode via `--yolo` (bound in G2.007.0); the seat is made
# safe by ring0_hook_pack_confirmed. Flags/validators referenced by name only; no secrets.
seat_contract:
  seat_id: seat-ce-codex-controller
  harness: codex
  launch_posture:
    model_pin: true
    effort: high
    setting_sources:
      - project
    terminal_visibility: operator_visible
    strict_mcp_config: true
    full_permission_mode: true
    permission_mode_flag: "--yolo"
    ring0_hook_pack_confirmed: true
  refused_modes:
    - bare
    - print_headless
    - background_agents
    - remote_control
    - settings_local_weakening
  enforcement_ring: ring_0
  required_hook_pack:
    extension_id: ext-ce-codex-hook-pack
    extension_kind: hook_pack
    ring: ring_1
    enforcement_strength: defeasible
    emitting_role: controller
    operating_mode: strict
    hooks:
      - event: PreToolUse
        matcher: "Edit|Write|MultiEdit|Read|Bash"
        decision_protocol: allow_deny
        failure_posture: fail_open
        validator_binding: hook-check
        defeasible: true
      - event: Stop
        decision_protocol: advisory
        failure_posture: fail_open
        validator_binding: hook-check
        defeasible: true
    recorded_at: '2026-06-01T12:07:05Z'
  emitting_role: operator
  operating_mode: strict
  recorded_at: '2026-06-01T12:07:05Z'
  metadata:
    summary: >-
      G2.007.1 Codex Controller seat-contract; full_permission_mode via --yolo (bound flag).
      Same schema/validator as the claude_code reference instance.
