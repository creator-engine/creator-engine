$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/model-canon.schema.yaml"
title: Creator Engine model observation canon
description: Reviewable, non-secret expectations for fixed contained-seat model observations.
type: object
required: [schema_version, provenance_sha256, seats]
additionalProperties: false
properties:
  schema_version:
    type: integer
    const: 1
  provenance_sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  seats:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, container, config_path, model, model_reasoning_effort, codex_version]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9-]{2,63}$"}
        container: {type: string, pattern: "^ce-(dgx|vps)-codex$"}
        config_path: {type: string, pattern: "^/home/(cedev4|ce)/\\.codex/config\\.toml$"}
        model: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}
        model_reasoning_effort: {type: string, enum: [low, medium, high, xhigh]}
        codex_version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
