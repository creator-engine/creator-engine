$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/crosswalk-register.schema.yaml"
title: "Creator Engine v1 -> v2 Crosswalk Register"
description: |
  G2.001.4 machine-readable shape for the authoritative v1 -> v2 crosswalk
  register (``specs/v2/_crosswalk.yml``) and any well-formed crosswalk-register
  fixture.

  Decision basis: Q-C3 (single tracked canonical crosswalk at
  ``specs/v2/_crosswalk.yml``), OD-06/OD-06A/OD-08/OD-21/OD-23. Prose framing
  lives in ``specs/v2/001-v2-foundation-substrate/spec.ce.yml`` (FR-018 /
  RV2-001-018, required_validation VAL-CROSSWALK-AUTHORITATIVE).

  This schema validates the structural shape only. The ``crosswalk_register``
  check additionally enforces the predicates the schema alone cannot express:
  the register is authoritative, it carries the canonical mapping groups, no
  derived material is declared to supersede it, and the archived-import context
  is never emitted by new v2 artifacts.

  The register is forward-declared: it carries many mapping axes (roles,
  ratification_line, state_paths, feature_labels, sidecars, other_axes, ...),
  so additional top-level properties are permitted.
type: object
required:
  - schema
  - schema_version
  - authoritative
  - derived_material_note
  - context_disposition
properties:
  schema:
    type: string
    const: creator-engine/crosswalk-register
  schema_version:
    type: string
    minLength: 1
  schema_status:
    type: string
  authoritative:
    type: boolean
  derived_material_note:
    type: string
    minLength: 1
  roles:
    type: array
  state_paths:
    type: object
  feature_labels:
    type: array
  sidecars:
    type: array
  context_disposition:
    type: object
    required:
      - v1_archived_import_context
      - v2_canonical_emission_context
    properties:
      v1_archived_import_context:
        type: object
        required:
          - rules
        properties:
          rules:
            type: array
            items:
              type: string
      v2_canonical_emission_context:
        type: object
        required:
          - rules
        properties:
          rules:
            type: array
            items:
              type: string
