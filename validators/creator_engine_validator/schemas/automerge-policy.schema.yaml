$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/automerge-policy.schema.yaml"
title: "Creator Engine Auto-Merge Policy"
description: "Secret-free policy data for ce-ops#291 classify-only automerge dry runs."
oneOf:
  - $ref: "#/$defs/policy_state"
  - $ref: "#/$defs/mutation_policy"
$defs:
  mutation_class:
    type: string
    enum:
      - none
      - docs
      - code
      - schema
      - deploy
      - governance
      - identity
      - security
      - attestation
      - redaction
  policy_state:
    type: object
    required:
      - run_mode
      - kill_switch
      - classes
      - enabling_decision_ref
    additionalProperties: false
    properties:
      run_mode:
        type: string
        description: "dev means classify-only gesture mode; strangeLoop (or retained ceo override) may emit AUTO only when all guards pass."
      kill_switch:
        type: boolean
      enabling_decision_ref:
        type:
          - string
          - "null"
      classes:
        type: object
        required:
          - none
          - docs
          - code
          - schema
          - deploy
          - governance
          - identity
          - security
          - attestation
          - redaction
        additionalProperties: false
        patternProperties:
          "^(none|docs|code|schema|deploy|governance|identity|security|attestation|redaction)$":
            type: object
            required:
              - auto_merge
            additionalProperties: false
            properties:
              auto_merge:
                type: boolean
  mutation_policy:
    type: object
    required:
      - schema_version
      - state_path
      - decisions_dir
      - fail_closed_class
      - class_order
      - path_predicates
    additionalProperties: false
    properties:
      schema_version:
        type: string
      state_path:
        type: string
      decisions_dir:
        type: string
      fail_closed_class:
        $ref: "#/$defs/mutation_class"
      class_order:
        type: array
        minItems: 10
        maxItems: 10
        uniqueItems: true
        items:
          $ref: "#/$defs/mutation_class"
      required_checks:
        type: array
        items:
          type: string
      path_predicates:
        type: object
        additionalProperties: false
        patternProperties:
          "^(docs|code|schema|deploy|governance|identity|security|attestation|redaction)$":
            type: array
            items:
              type: string
