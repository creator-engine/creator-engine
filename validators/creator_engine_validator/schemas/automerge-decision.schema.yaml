$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/automerge-decision.schema.yaml"
title: "Creator Engine Auto-Merge Decision Record"
description: "Value-only dry-run automerge decision. It records a verdict; it is not an action."
type: object
required:
  - class
  - size_band
  - minimum_work_class
  - mutation_class
  - gates
  - decision
  - rationale
  - policy_sha
  - checks_snapshot
  - run_mode
  - kill_switch
  - class_flag
  - reviewDecision
  - checks_green
additionalProperties: false
properties:
  class:
    type: string
    enum:
      - tiny
      - story
      - feature
      - epic
  size_band:
    type: string
    enum:
      - target_advisory
      - warn
      - explain_or_split
      - split_required
  minimum_work_class:
    type: string
    enum:
      - tiny
      - story
      - feature
      - epic
  mutation_class:
    type: string
    enum:
      - none
      - docs
      - code
      - schema
      - deploy
      - governance
      - identity
      - security
      - attestation
      - redaction
  gates:
    type: array
    items:
      type: string
  decision:
    type: string
    enum:
      - AUTO
      - GESTURE
  rationale:
    type: array
    items:
      type: string
  policy_sha:
    type: string
    pattern: "^[a-f0-9]{64}$"
  checks_snapshot:
    type: object
  run_mode:
    type: string
  kill_switch:
    type: boolean
  class_flag:
    type: boolean
  reviewDecision:
    type:
      - string
      - "null"
  checks_green:
    type: boolean
  pr_number:
    type:
      - integer
      - "null"
  head_sha:
    type:
      - string
      - "null"
  repo:
    type:
      - string
      - "null"
  branch:
    type:
      - string
      - "null"
  base:
    type:
      - string
      - "null"
  required_checks:
    type: array
    items:
      type: string
  enabling_decision_ref:
    type:
      - string
      - "null"
  author_login:
    type:
      - string
      - "null"
  approver_login:
    type:
      - string
      - "null"
