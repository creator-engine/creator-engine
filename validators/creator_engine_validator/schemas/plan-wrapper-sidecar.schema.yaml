$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/plan-wrapper-sidecar.schema.yaml"
title: "Creator Engine Plan Wrapper Sidecar"
type: object
required:
  - spec_ref
  - plan_mutation_class_summary
  - plan_permitted_actions_summary
  - verification_plan
  - ratification_required
  - identity_policy_ref
unevaluatedProperties: false
properties:
  spec_ref:
    type: string
    minLength: 1
  plan_mutation_class_summary:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
  plan_permitted_actions_summary:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  verification_plan:
    type: object
    required: [method, evidence_refs]
    unevaluatedProperties: false
    properties:
      method:
        type: string
        minLength: 1
      evidence_refs:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
  ratification_required:
    type: boolean
  identity_policy_ref:
    type: string
    minLength: 1
