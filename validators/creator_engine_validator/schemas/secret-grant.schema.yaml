$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/secret-grant.schema.yaml"
title: SecretGrant
type: object
additionalProperties: false
required:
  - grant_id
  - run_id
  - seat_id
  - secret_ref
  - lease_id
  - token_accessor_ref
  - issued_at
  - expires_at
  - delivery_ref
  - audit_ref
  - revoked_at
properties:
  grant_id:
    type: string
    minLength: 1
  run_id:
    type: string
    minLength: 1
  seat_id:
    type: string
    minLength: 1
  secret_ref:
    type: object
    additionalProperties: false
    required:
      - backend
      - mount
      - path
      - field
      - version
      - purpose
      - owner_ref
      - policy_sha
    properties:
      backend:
        type: string
        minLength: 1
      mount:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
        not:
          pattern: "^(env|file|prompt)://"
      field:
        type: string
        minLength: 1
      version:
        anyOf:
          - type: integer
            minimum: 1
          - type: "null"
      purpose:
        type: string
        minLength: 1
      owner_ref:
        type: string
        minLength: 1
      policy_sha:
        type: string
        pattern: "^[0-9a-f]{64}$"
  lease_id:
    anyOf:
      - type: string
        minLength: 1
      - type: "null"
  token_accessor_ref:
    anyOf:
      - type: string
        minLength: 1
      - type: "null"
  issued_at:
    type: string
    format: date-time
  expires_at:
    type: string
    format: date-time
  delivery_ref:
    anyOf:
      - type: string
        minLength: 1
      - type: "null"
  audit_ref:
    type: string
    minLength: 1
  revoked_at:
    anyOf:
      - type: string
        format: date-time
      - type: "null"
