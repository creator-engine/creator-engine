$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/runtime-evidence.schema.yaml"
title: "Creator Engine Runtime Evidence Chain"
description: |
  Machine-readable schema for a hash-chained Runtime Evidence chain — the
  tamper-evident, append-only, content-addressed audit spine for one Creator
  Engine agent seat's runtime lifecycle (plane C / runtime safety, v3 G-1.3a).

  Prose contract: `docs/contracts/runtime-evidence.md`.

  Each record is content-addressed (`content_hash` = SHA256 of the canonical
  record material excluding `content_hash` itself) and chain-linked
  (`prev_hash`); the genesis record's `prev_hash` is the all-zero SHA256
  sentinel and `sequence` is contiguous from 0. Every record binds to the exact
  runtime-policy it attests via `policy_sha`. This discipline mirrors the landed
  `ce-event-block` and side-effect-ledger hash chains; the PURE append/verify
  substrate is
  `validators/creator_engine_validator/runtime_evidence_spine.py`.

  G-1.3a boundary statement: this schema and its `ce_runtime_evidence` dogfood
  check validate the *record shape and chain integrity* of static evidence
  files only. They do NOT allocate a container, invoke a runner backend, build
  or push an image, open a network socket, or tap a live runtime. The
  classifier + audit overlay that *produces* these records over the
  RunnerBackend provision/run/collect/teardown lifecycle is the deferred G-1.3b
  slice; an OpenShell backend is a later fast-follow behind the same adapter.

  Defensive posture: this contract makes the Creator Engine's own runtime audit
  trail tamper-evident; it is never an offensive capability. The `policy_sha`
  binding and the content-address + chain-link + sequence invariants are
  enforced mechanically by the `ce_runtime_evidence` check.

  Concrete host, port, credential, account, or registry identifiers MUST NOT
  appear in a record as normative bindings; evidence records carry hashes,
  phase/classification enums, and shape-only references.
type: object
required:
  - kind
  - record_type
  - schema_version
  - records
unevaluatedProperties: false
properties:
  kind:
    type: string
    const: runtime-evidence-chain
    description: |
      Discriminator constant. Files that do not carry this exact value are not
      governed Runtime Evidence chains and MUST NOT be validated by the
      `ce_runtime_evidence` check.
  record_type:
    type: string
    const: runtime_evidence_chain
    description: |
      Sub-discriminator for the chain wrapper. G-1.3a defines exactly one
      chain shape; later slices MAY add additive record types under a new
      `schema_version`.
  schema_version:
    type: string
    enum: ["1"]
    description: |
      Runtime Evidence schema version. G-1.3a ships v1; later slices MAY extend
      additively without breaking v1 readers.
  records:
    type: array
    minItems: 1
    items:
      oneOf:
        - $ref: "#/$defs/runtime_evidence_record"
        - $ref: "#/$defs/runtime_run_outcome_record"
        - $ref: "#/$defs/runtime_ratification_record"
        - $ref: "#/$defs/runtime_agent_action_record"
        - $ref: "#/$defs/runtime_spend_ledger_record"
        - $ref: "#/$defs/runtime_spend_breach_record"
        - $ref: "#/$defs/runtime_work_unit_cap_record"
        - $ref: "#/$defs/runtime_work_unit_reconcile_record"
        - $ref: "#/$defs/runtime_change_restamp_record"
        - $ref: "#/$defs/runtime_merge_audit_record"
    description: |
      The ordered, append-only record chain. Element 0 is the genesis record
      (`prev_hash` = the all-zero sentinel, `sequence` = 0); each subsequent
      record links to its predecessor by `prev_hash` and increments `sequence`.
      Each element is a lifecycle `runtime_evidence_record` (the
      `provision`/`run`/`collect`/`teardown` container-phase attestations), a
      terminal `runtime_run_outcome_record` (the typed run-OUTCOME on the
      orthogonal disposition axis), a `runtime_ratification_record` (the typed
      run-RATIFICATION attestation), a `runtime_agent_action_record` (the v3
      G-4 per-action attestation on its own orthogonal axis), a
      `runtime_spend_ledger_record` (the v3 G-5 metered-spend leaf), a
      `runtime_spend_breach_record` (the v3 G-5 circuit-breaker trip), a
      `runtime_change_restamp_record` (the F6 Phase-0 machine base-only
      re-stamp — the ONLY authority for base-only merge-head movement), OR a
      `runtime_merge_audit_record` (the F6 Phase-0 squash tree-equivalence
      audit binding what-was-TESTED to what-MERGED); the branches are mutually
      exclusive (a record's `kind`/`record_type` consts + its
      `lifecycle_phase`/`outcome`/`approver_ref`/`op`/`tier`/`restamp_type`
      discriminating fields select exactly one branch).
  note:
    type: string
    maxLength: 1024
    description: |
      Optional free-text note. Advisory only; MUST NOT contain secrets,
      tokens, credentials, or actor ids.
$defs:
  runtime_evidence_record:
    type: object
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - lifecycle_phase
      - classification
      - recorded_at
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-evidence-record
      record_type:
        type: string
        const: runtime_evidence
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` (SHA256 hex digest) of the runtime-policy record
          this evidence attests. The schema REQUIRES presence; the
          `ce_runtime_evidence` check enforces the exact `^[0-9a-f]{64}$`
          shape and emits `runtime_evidence_policy_unbound` when it is absent
          or malformed — a record MUST be anchored to its policy. (Kept loose
          at the schema layer, like `runtime-policy`'s `image_ref.sha`, so the
          check can emit a precise contract error.)
      run_id:
        type: string
        minLength: 1
        description: |
          The provisioning run this record belongs to (the runner adapter's
          `run_id` / `ProvisionedHandle.run_id`). Binds the chain to one seat
          provisioning. Shape only.
      sequence:
        type: integer
        minimum: 0
        description: |
          Monotonic position in the chain, contiguous from 0 at genesis. The
          check refuses a non-contiguous sequence (reorder / truncation).
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          The predecessor record's `content_hash`. The genesis record uses the
          all-zero SHA256 sentinel. The check refuses a `prev_hash` that does
          not match the prior record's content address (broken hash chain).
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          SHA256 of the canonical record material excluding `content_hash`
          itself. The check recomputes and refuses any mismatch (mutation).
      lifecycle_phase:
        type: string
        enum: [provision, run, collect, teardown]
        description: |
          The RunnerBackend lifecycle phase this record attests.
      classification:
        type: string
        enum: [allowed, denied, escalate]
        description: |
          The classifier verdict category for the attested event. The
          classifier that ASSIGNS this is the deferred G-1.3b audit overlay;
          G-1.3a fixes only the record shape.
      recorded_at:
        type: string
        minLength: 1
        description: |
          Timestamp the record was produced (an input; never read from the
          wall clock inside the pure substrate). Shape only.
      backend_key:
        type: string
        minLength: 1
        description: |
          Optional: the runner backend that produced the evidence (e.g.
          `gvisor-proxy`). Shape only.
      summary:
        type: string
        maxLength: 1024
        description: |
          Optional advisory summary. MUST NOT contain secrets or credentials.
  runtime_run_outcome_record:
    type: object
    description: |
      A typed terminal run-OUTCOME record (v3 G-3.6a). It attests WHERE a run
      ended — its terminal disposition — on an axis ORTHOGONAL to the container
      `lifecycle_phase`. Outcomes are plural and work-type-dependent (a run may
      open a PR, submit a review, deliver research, or change nothing); modelling
      the outcome as a `lifecycle_phase` value would conflate the two axes, so the
      outcome is its own record type, NEVER a `lifecycle_phase`. It is appended to
      the SAME hash chain (content-addressed + chain-linked + policy-bound) so the
      terminal disposition is itself tamper-evident. The v3 MVP produces only
      `pr_opened`; the other `outcome` values are reserved vocabulary.
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - recorded_at
      - outcome
      - change_set
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-run-outcome
      record_type:
        type: string
        const: runtime_run_outcome
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` of the runtime-policy the run attests, identical to the
          lifecycle records' binding (the check enforces `^[0-9a-f]{64}$` and emits
          `runtime_evidence_policy_unbound` when absent or malformed).
      run_id:
        type: string
        minLength: 1
      sequence:
        type: integer
        minimum: 0
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      recorded_at:
        type: string
        minLength: 1
      outcome:
        type: string
        enum: [pr_opened, pr_merged, review_submitted, research_delivered, no_change]
        description: |
          The run's terminal disposition (the run-OUTCOME axis). Plural +
          extensible; the producers are `pr_opened` (G-3.7) and `pr_merged`
          (G-3.7b — the gated-merge disposition; live merge in G-3.8). NEVER a
          `lifecycle_phase` value.
      change_set:
        type: object
        description: |
          The value-free pointer to the change the run produced. Carries only
          shape references (branch / base / manifest paths / head sha + optional
          PR number) — NO diff, NO secret, and NO host/credential/account/registry
          identifier as a normative binding.
        required:
          - branch
          - base
          - manifest_paths
          - head_sha
        unevaluatedProperties: false
        properties:
          branch:
            type: string
            minLength: 1
          base:
            type: string
            minLength: 1
          manifest_paths:
            type: array
            items:
              type: string
              minLength: 1
          head_sha:
            type: string
            minLength: 1
          pr_number:
            type: integer
            minimum: 1
          base_sha:
            type: string
            pattern: "^[0-9a-f]{7,40}$"
            description: |
              F6 Phase-0 (OPTIONAL, additive): the base-branch commit SHA
              observed when the change identity was stamped. Propagated from the
              dispatch `change.base_sha` by `cev3 collect`. The base-only
              re-stamp proof recomputes the old change identity from
              (`base_sha`, `head_sha`); a chain that lacks it is `legacy
              unprovable` and is refused (NEVER silently overridden). Pre-F6
              chains carry no `base_sha` and conserve their prior behavior.
  runtime_ratification_record:
    type: object
    description: |
      A typed run-RATIFICATION record (v3 G-3.7.2a). It attests that a run was
      RATIFIED — the CE-owned, SHA-pinned, single-use ratification that authorizes
      the run to act — appended to the SAME tamper-evident hash chain
      (content-addressed + chain-linked + policy-bound) so the authorization itself
      is auditable. It is its OWN record type on a dimension ORTHOGONAL to the
      container `lifecycle_phase` and the run `outcome`, and is NEVER a
      `lifecycle_phase` value. It is VALUE-FREE: it carries only opaque digests
      (`approver_ref`, `ratified_prompt_sha`, `binding_ref`) plus the pinned git
      `ratified_head_sha` (a content-address) and the policy/run ids — NEVER a raw
      account/login, host, credential/token, or installation identifier in clear
      (repo/installation/permissions identity is folded into the opaque
      `binding_ref`). The runtime head-SHA assertion (G-3.7.2b) consumes
      `ratified_head_sha` (+ a recomputed `binding_ref`) to REFUSE drift before any
      `apply=True` side effect.
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - recorded_at
      - ratified_prompt_sha
      - approver_ref
      - ratified_head_sha
      - binding_ref
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-ratification
      record_type:
        type: string
        const: runtime_ratification
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` of the runtime-policy the run attests, identical to the
          lifecycle/outcome records' binding (the check enforces `^[0-9a-f]{64}$`
          and emits `runtime_evidence_policy_unbound` when absent or malformed).
      run_id:
        type: string
        minLength: 1
      sequence:
        type: integer
        minimum: 0
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      recorded_at:
        type: string
        minLength: 1
      ratified_prompt_sha:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          The SHA256 digest of the ratified Source prompt — the SHA-pinned
          ratification this run is bound to. An opaque digest, never the prompt body.
      approver_ref:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          An OPAQUE digest standing in for the approving actor (e.g. a salted hash
          of the account). NEVER a raw account/login — preserving the
          no-identifier-in-evidence invariant.
      ratified_head_sha:
        type: string
        minLength: 1
        description: |
          The git head SHA the ratification pins (a content-address, the shape the
          `runtime_run_outcome_record.change_set.head_sha` uses). The G-3.7.2b
          assertion refuses to act when the runtime head differs from this.
      binding_ref:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          An OPAQUE digest of the normative {repo, installation_id, permissions,
          ratified_head_sha} tuple, so the repo/installation/permission identity is
          bound WITHOUT any account/installation identifier appearing in clear; the
          assertion recomputes and compares it.
  runtime_agent_action_record:
    type: object
    description: |
      A typed per-action record (v3 G-4). It attests one observed agent action —
      WHAT was done (`op` × `mutation_class`), at WHAT observation `fidelity`,
      gated HOW (`classification` + `decision_mode`) — appended to the SAME
      tamper-evident hash chain (content-addressed + chain-linked + policy-bound)
      so each action is itself spoof-resistant grader input. It is its OWN record
      type on a dimension ORTHOGONAL to the container `lifecycle_phase`, the run
      `outcome`, and the `ratification`, and is NEVER a `lifecycle_phase` value.
      It is VALUE-FREE: `target`/`tool` are salient-parameter provenance (a path
      pattern / host:port / git-ref+cmd / tool name), NEVER a credential, secret
      value, account, or installation identifier; `escalation_id` is an opaque
      digest. The classifier + `decide()` control-point that PRODUCE these records
      live in `runner.audit_overlay`; this schema fixes only the record shape.
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - recorded_at
      - op
      - mutation_class
      - target
      - tool
      - fidelity
      - timing
      - classification
      - decision_mode
      - decision_reason
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-agent-action
      record_type:
        type: string
        const: runtime_agent_action
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` of the runtime-policy the run attests, identical to the
          lifecycle/outcome/ratification records' binding (the check enforces
          `^[0-9a-f]{64}$` and emits `runtime_evidence_policy_unbound` when absent
          or malformed).
      run_id:
        type: string
        minLength: 1
      sequence:
        type: integer
        minimum: 0
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      recorded_at:
        type: string
        minLength: 1
      op:
        type: string
        enum: [read, write, exec, egress, secret, vcs]
        description: |
          The operation/capability axis — the "do we gate?" axis. `read` is
          observe-only; the rest are gateable.
      mutation_class:
        type: string
        enum: [docs, code, schema, deploy, governance, identity, security, attestation, redaction, none]
        description: |
          The blast-radius/severity axis — the shared planning-layer taxonomy
          plus `none`. An INPUT (the adapter derives it), not derived here.
      target:
        type: string
        description: |
          The salient action parameter (path / host:port / secret-name /
          git-ref+cmd) as a value-free reference. MAY be empty. NEVER a
          credential, secret value, account, or installation identifier.
      tool:
        type: string
        description: |
          The raw tool / command as seen on the wire (provenance, e.g. `Edit`,
          `Bash:git push`, an ACP tool id). MAY be empty.
      fidelity:
        type: string
        enum: [faithful, best_effort, inferred]
        description: |
          The observation-fidelity marker (Fork 1) — stamped by the adapter,
          never the agent; itself a policy input (stricter policy at lower
          fidelity).
      timing:
        type: string
        enum: [pre, post]
        description: |
          `pre` (gateable before execution → preventive) or `post` (observed
          after → detective).
      classification:
        type: string
        enum: [allowed, denied, escalate]
        description: |
          The enforced verdict for the action (the `decide()` outcome).
      decision_mode:
        type: string
        enum: [deny, allowlist, ask, auto, full]
        description: |
          The gate-mode the verdict was produced under (provenance).
      decision_reason:
        type: string
        minLength: 1
        description: |
          A deterministic explanation string for the verdict. Advisory; MUST NOT
          contain secrets or credentials.
      escalation_id:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          Optional: an OPAQUE, deterministic digest present only when
          `classification == escalate`, correlating the escalation. NEVER a raw
          identifier.
  runtime_spend_ledger_record:
    type: object
    description: |
      A typed spend-METER / ledger record (v3 G-5). It attests one metered cost
      leaf — `$` (API-USD, the fleet regime) or `%` (the single subscription seat
      meter) — appended to the SAME tamper-evident hash chain (content-addressed +
      chain-linked + policy-bound) so the spend ledger is itself spoof-resistant
      grader input. It is its OWN record type on a dimension ORTHOGONAL to the
      container `lifecycle_phase`, the run `outcome`, the `ratification`, and the
      agent `action`, and is NEVER a `lifecycle_phase` value. The cumulative tally
      is a PURE PROJECTION (`runner.spend_gate.project_spend`) over these leaves per
      scope + window — there is no separate mutable ledger file. The signal is
      FAITHFUL-BY-CONSTRUCTION (transport / API-reported, never agent-asserted).
      VALUE-FREE: `model` / `fleet_id` are shape-only provenance, NEVER a
      credential, account, or host identifier.
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - recorded_at
      - unit
      - amount
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-spend-ledger
      record_type:
        type: string
        const: runtime_spend_ledger
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` of the runtime-policy the run attests, identical to the
          other records' binding (the check enforces `^[0-9a-f]{64}$` and emits
          `runtime_evidence_policy_unbound` when absent or malformed).
      run_id:
        type: string
        minLength: 1
      sequence:
        type: integer
        minimum: 0
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      recorded_at:
        type: string
        minLength: 1
      unit:
        type: string
        enum: ["$", "%"]
        description: |
          `$` = API-USD (the fleet regime) or `%` = single-seat utilization meter
          (the subscription regime).
      amount:
        type: number
        minimum: 0
        description: |
          The metered cost of this leaf, in `unit`. The pure `project_spend` folds
          these per scope + window into the cumulative tally.
      fleet_id:
        type: string
        minLength: 1
        description: |
          Optional: the fleet this cost rolls up to (for `fleet`-scope projection).
          Shape only.
      model:
        type: string
        minLength: 1
        description: |
          Optional: the model the cost was metered for (provenance). Shape only.
      window:
        type: string
        enum: [per_run, rolling_5h, rolling_weekly, total]
        description: |
          Optional: the accounting window this leaf contributes to.
  runtime_spend_breach_record:
    type: object
    description: |
      A typed spend-BREACH record (v3 G-5). It attests a circuit-breaker trip —
      `soft` (~80% alert, continue) or `hard` (100% pause + escalate) — on the
      nested deny-by-default envelope hierarchy, appended to the SAME tamper-evident
      hash chain so the breach is itself auditable. It is its OWN record type on a
      dimension ORTHOGONAL to the other axes and is NEVER a `lifecycle_phase` value.
      It carries the two-signal refusal (`budget_exhausted` = do-NOT-retry vs
      `throttle` = retry-with-backoff). VALUE-FREE: `escalation_id` is an opaque
      digest; `limit` / `observed` are the envelope magnitudes (never a credential
      or account).
    required:
      - kind
      - record_type
      - schema_version
      - policy_sha
      - run_id
      - sequence
      - prev_hash
      - content_hash
      - recorded_at
      - breach_scope
      - breach_unit
      - tier
      - signal
      - limit
      - observed
      - decision_reason
    unevaluatedProperties: false
    properties:
      kind:
        type: string
        const: runtime-spend-breach
      record_type:
        type: string
        const: runtime_spend_breach
      schema_version:
        type: string
        enum: ["1"]
      policy_sha:
        type: string
        minLength: 1
        description: |
          The `policy_sha` of the runtime-policy the run attests (the check enforces
          `^[0-9a-f]{64}$` and emits `runtime_evidence_policy_unbound` when absent
          or malformed).
      run_id:
        type: string
        minLength: 1
      sequence:
        type: integer
        minimum: 0
      prev_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      content_hash:
        type: string
        pattern: "^[0-9a-f]{64}$"
      recorded_at:
        type: string
        minLength: 1
      breach_scope:
        type: string
        enum: [global, fleet, run]
        description: |
          The envelope scope that tripped (most-restrictive-wins).
      breach_unit:
        type: string
        enum: ["$", "%"]
      tier:
        type: string
        enum: [soft, hard]
        description: |
          `soft` (~80% — alert + continue) or `hard` (100% — pause + escalate).
      signal:
        type: string
        enum: [budget_exhausted, throttle]
        description: |
          The two-signal refusal protocol: `budget_exhausted` (do NOT retry) vs
          `throttle` (retry with backoff). Conflating them risks retry storms.
      limit:
        type: number
        description: |
          The tripped envelope's cap magnitude (in `breach_unit`). Shape only.
      observed:
        type: number
        description: |
          The observed cumulative spend at the trip (in `breach_unit`). Shape only.
      decision_reason:
        type: string
        minLength: 1
        description: |
          A deterministic explanation string. Advisory; MUST NOT contain secrets.
      escalation_id:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          Optional: an OPAQUE, deterministic digest correlating a `hard`
          pause + escalate. NEVER a raw identifier.
  runtime_work_unit_cap_record: &work_unit_record
    type: object
    unevaluatedProperties: false
    required: [kind, record_type, schema_version, policy_sha, run_id, sequence, prev_hash, content_hash, recorded_at, receipt_id, attempt_id, reservation_id, phase, unit, unit_version, cap, reserved, observed, remaining, sample_sequence, source_state, policy_sha256, previous_receipt_sha256, receipt_sha256]
    properties:
