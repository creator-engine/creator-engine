$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/secret-ref.schema.yaml"
title: SecretRef
type: object
additionalProperties: false
required:
  - backend
  - mount
  - path
  - field
  - version
  - purpose
  - owner_ref
  - policy_sha
properties:
  backend:
    type: string
    minLength: 1
  mount:
    type: string
    minLength: 1
  path:
    type: string
    minLength: 1
    not:
      pattern: "^(env|file|prompt)://"
  field:
    type: string
    minLength: 1
  version:
    anyOf:
      - type: integer
        minimum: 1
      - type: "null"
  purpose:
    type: string
    minLength: 1
  owner_ref:
    type: string
    minLength: 1
  policy_sha:
    type: string
    pattern: "^[0-9a-f]{64}$"
