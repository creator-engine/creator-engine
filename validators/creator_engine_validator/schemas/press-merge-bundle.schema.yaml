$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/press-merge-bundle.schema.yaml"
title: "Creator Engine Proposed Press-Merge Bundle"
description: |
  Proposed, not frozen, schema for a deterministic press-merge evidence bundle.
  The bundle is a PR-keyed sibling of the evidence fan-in packet: it aggregates
  local ref+sha evidence for the Operator's merge-read surface while carrying no
  merge, ratification, enqueue, deploy, or repository-mutation authority.
type: object
required:
  - kind
  - schema_version
  - bundle_id
  - has_authority
  - pr
  - source_ratification
  - diff_summary
  - test_results
  - review_evidence
  - computer_use_evidence
  - evidence_refs
  - content_hash
unevaluatedProperties: false
properties:
  kind:
    type: string
    const: press-merge-bundle
  schema_version:
    type: string
    const: "1"
  bundle_id:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,127}$"
  has_authority:
    type: boolean
    const: false
    description: |
      A press-merge bundle never grants merge authority. Any bundle asserting
      authority is invalid.
  pr:
    type: object
    required: [number, head_ref]
    unevaluatedProperties: false
    properties:
      number:
        type: integer
        minimum: 1
      head_ref:
        type: string
        minLength: 1
        maxLength: 512
  source_ratification:
    type: object
    required: [prompt_ref, sha256]
    unevaluatedProperties: false
    properties:
      prompt_ref:
        type: string
        minLength: 1
        maxLength: 2048
      sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
  diff_summary:
    type: object
    required: [files_changed, additions, deletions, path_set, carrier_path_set]
    unevaluatedProperties: false
    properties:
      files_changed:
        type: integer
        minimum: 0
      additions:
        type: integer
        minimum: 0
      deletions:
        type: integer
        minimum: 0
      path_set:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 4096
      carrier_path_set:
        oneOf:
          - type: "null"
          - type: object
            required: [ref, sha256, paths]
            unevaluatedProperties: false
            properties:
              ref:
                type: string
                minLength: 1
                maxLength: 2048
              sha256:
                type: string
                pattern: "^[0-9a-f]{64}$"
              paths:
                type: array
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  maxLength: 4096
  test_results:
    type: object
    required: [status, per_gate_summary]
    unevaluatedProperties: false
    properties:
      status:
        type: string
        minLength: 1
        maxLength: 128
      per_gate_summary:
        type: array
        items:
          type: object
          required: [name, status, summary]
          unevaluatedProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 256
            status:
              type: string
              minLength: 1
              maxLength: 128
            summary:
              type: string
              maxLength: 4096
  review_evidence:
    type: array
    minItems: 1
    items:
      type: object
      required: [ref, sha256, evidence_id, verdict, notes, non_ratification_statement]
      unevaluatedProperties: false
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 2048
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        evidence_id:
          type: string
          maxLength: 256
        verdict:
          type: string
          minLength: 1
          maxLength: 128
        notes:
          type: object
          required:
            - findings
            - recommended_follow_up
            - blocking_findings_count
            - non_blocking_findings_count
          unevaluatedProperties: false
          properties:
            findings:
              type: string
              maxLength: 20000
            recommended_follow_up:
              type: string
              maxLength: 20000
            blocking_findings_count:
              type: integer
              minimum: 0
            non_blocking_findings_count:
              type: integer
              minimum: 0
        non_ratification_statement:
          type: string
          minLength: 1
          maxLength: 20000
  computer_use_evidence:
    type: array
    items:
      type: object
      required: [ref, sha256, output_name, summary]
      unevaluatedProperties: false
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 2048
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        output_name:
          type: string
          minLength: 1
          maxLength: 256
        summary:
          type: string
          maxLength: 4096
  evidence_refs:
    type: array
    items:
      type: object
      required: [kind, ref, sha256]
      unevaluatedProperties: false
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 128
        ref:
          type: string
          minLength: 1
          maxLength: 2048
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
  content_hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
