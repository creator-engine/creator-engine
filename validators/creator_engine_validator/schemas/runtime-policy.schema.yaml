$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/runtime-policy.schema.yaml"
title: "Creator Engine Runtime Policy Record"
description: |
  Machine-readable schema for a single Runtime Policy record — the
  declarative plane-C (runtime-safety) isolation contract for one
  Creator Engine agent seat.

  Prose contract: `docs/contracts/runtime-policy.md`.

  Provenance: this schema is the v3 plane-C translation of the kept
  v2 `schemas/worker-container-policy.schema.yaml` (PCO Slice 2I-S).
  It lifts the record shape — policy id/sha, role, image digest pin,
  default-deny mount manifest, deny-by-default egress allowlist,
  names-only secret allowlist, and the grant-extensibility surface —
  and adds the v3 plane-C bits: the `isolation_backend` selector
  (`gvisor-proxy` now, `openshell` fast-follow) and the per-endpoint
  egress L4/L7 assurance + calling-binary axis from the secure-runtime
  architect report. The v2 worker-container schema is left untouched;
  its adopt-and-drop is a later ordered step.

  G-1.0 boundary statement: this schema defines the *record shape*
  only. It does NOT allocate a container, does NOT invoke gVisor,
  Podman, Docker, or OpenShell, does NOT build or push images, does
  NOT open a network socket, and does NOT implement an egress proxy
  or a credential broker. The runner-backend adapter is G-1.1; the
  first live backend (a hardened gVisor container paired with a
  capability-separation egress proxy) is G-1.2; the advisory
  classifier/audit overlay and the hash-chained evidence-spine
  integration are G-1.3. Safety-default enforcement for this slice is
  via the `ce_runtime_policy` dogfood check — schema validation plus
  the runtime-policy safety predicates.

  Defensive posture: this contract hardens the Creator Engine's own
  agent runtime; it is never an offensive capability. Non-negotiable
  invariants — the controller-key private key MUST NOT appear in
  `secret_allowlist`; the mount manifest MUST NOT name host home
  directories, container-engine sockets, or SSH/GPG agent sockets;
  the image reference MUST be digest-pinned; egress is deny-by-default
  — are enforced mechanically by the check.

  Concrete registry, image tag, host, port, credential, or account
  identifiers MUST NOT appear here as normative upstream bindings;
  those remain deployment-time overlay decisions. The
  `egress_allowlist` records shape only — not a concrete host
  inventory.
type: object
required:
  - kind
  - record_type
  - schema_version
  - policy_id
  - policy_sha
  - role
  - image_ref
  - mount_manifest
  - egress_allowlist
  - secret_allowlist
  - grant_extensible
  - grant_authority
unevaluatedProperties: false
properties:
  kind:
    type: string
    const: runtime-policy-record
    description: |
      Discriminator constant. Records that do not carry this exact
      value are not governed Runtime Policy records under this
      contract and MUST NOT be validated by the `ce_runtime_policy`
      check.
  record_type:
    type: string
    const: runtime_policy
    description: |
      Sub-discriminator. G-1.0 defines exactly one record shape;
      later slices MAY add additional record types via additive
      extension under a new `schema_version`.
  schema_version:
    type: string
    enum: ["1"]
    description: |
      Runtime Policy schema version. G-1.0 ships v1. Later slices MAY
      extend additively via a further version bump without breaking
      v1 readers.
  policy_id:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
    description: |
      Stable identifier for this policy record. Matches the slug
      pattern used by controller_id and lane_id across the substrate.
  policy_sha:
    type: string
    pattern: "^[0-9a-f]{64}$"
    description: |
      SHA256 hex digest (64 lowercase hex characters) of the
      canonical representation of this policy record. Binds a runtime
      instance to the exact policy version in force at provision time.
  role:
    type: string
    enum: [architect_research, implementer, verification, controller]
    description: |
      Seat role enum. The three runtime seats carried from the v2
      worker-container contract plus the controller role ratified for
      launch-default policy records. Additional roles MUST be ratified
      as additive schema changes.
  isolation_backend:
    type: string
    enum: [gvisor-proxy, docker, openshell, local-noop, os-native]
    default: gvisor-proxy
    description: |
      Runner-backend selector (the G-1.1 adapter axis). `gvisor-proxy`
      is the canonical v3 backend — a hardened gVisor container paired
      with a capability-separation egress proxy (shipped at G-1.2).
      `docker` is the plain-Docker contained backend for tenant hosts
      that do not expose the DGX runsc runtime; it uses the policy's
      digest-pinned image and manifest mounts without host Codex binds.
      `openshell` is the fast-follow backend behind the same runner
      abstraction. `local-noop` is the inert registered backend used for
      dry-run/foundation wiring; it enforces the same policy validation
      boundary but does not allocate a live runtime. `os-native`
      (ce-ops#71 Tranche 1) is the neutral key
      for the unprivileged, daemonless OS-native backend (bubblewrap
      user-ns / Seatbelt + host deny-by-default proxy) — the no-root
      default DIRECTION; its functional sandbox mechanism (srt vs a
      CE-native jail) is an open Operator call, so the in-tree backend
      is a FAIL-CLOSED scaffold (registered + deny-surface-enforcing,
      refuses to provision a live runtime until the mechanism lands).
      The v2 `[podman-rootless, docker-rootless]` engines are NOT
      carried (adopt-and-drop). The `default:` stays `gvisor-proxy` so
      records authored before #71 (omitting this field) keep today's
      backend — the default-flip to `os-native` is gated to an explicit
      Operator decision (§9 OQ-2/OQ-4). The selection is recorded so
      audit predicates can verify the policy was provisioned under the
      intended backend. OPTIONAL at the schema layer (ce-ops#71
      MINOR-A): a Draft 2020-12 validator does NOT inject `default`, so
      listing this field as `required` would FAIL a pre-#71 record that
      omits it — breaking the very back-compat story above. It is
      therefore not required; an omitted field validates clean and
      `v3_installer.resolve_isolation_backend` supplies the fail-closed
      default (`explicit > profile > gvisor-proxy`).
  image_ref:
    type: object
    required: [name]
    unevaluatedProperties: false
    properties:
      name:
        type: string
        minLength: 1
        description: |
          Image name (registry/repository:tag). Shape only; the
          concrete registry and tag are deployment-time overlay. MUST
          NOT carry credential material (userinfo / embedded token);
          the `ce_runtime_policy` check refuses such names.
      sha:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"
        description: |
          Image content-addressable digest in `sha256:<hex64>` form.
          Optional at the schema layer so the `ce_runtime_policy`
          check can emit a precise
          `runtime_policy_image_not_digest_pinned` contract error
          when it is absent or malformed. The check REQUIRES a digest
          pin — an unpinned image is refused.
    description: |
      Image reference. The digest pin is the normative binding; the
      check enforces its presence and `sha256:<hex64>` format.
  mount_manifest:
    type: array
    items:
      $ref: "#/$defs/mount_entry"
    description: |
      Ordered list of paths to bind into the runtime. Default-deny
      posture: paths not listed here are NOT accessible inside the
      runtime. The `ce_runtime_policy` check refuses any manifest that
      names a host home directory, a container-engine socket, or an
      SSH/GPG agent socket.
  egress_allowlist:
    type: array
    items:
      $ref: "#/$defs/egress_rule"
    description: |
      Per-seat egress rules. Deny-by-default: an empty array declares
      no egress (the safe floor, appropriate for the verification
      seat). Shape only — not a deployment host inventory. Each rule
      carries an L4/L7 assurance axis and an optional calling-binary
      identity per the secure-runtime egress contract.
  secret_allowlist:
    type: array
    items:
      type: string
      minLength: 1
    description: |
      Names of secrets the runtime is permitted to inject — names
      only: no values, no paths, no raw credential material. The
      `ce_runtime_policy` check refuses any entry that is a path or
      value, or that names the controller-key private key or any
      private-key-shaped secret.
  grant_extensible:
    type: boolean
    description: |
      When `true`, the Controller MAY extend this policy's mount
      manifest at runtime. When `false`, the manifest is sealed.
      Governance-class grants additionally require Source ratification.
  grant_authority:
    type: string
    enum: [controller, source]
    description: |
      Authority required to approve runtime mount grants for this
      policy. `controller`: the Controller alone may approve per-grant
      extensions. `source`: Source ratification is required
      (governance-class grants).
  controller_id:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
    description: |
      Optional: the Controller that authored this policy. Same slug
      pattern as elsewhere in the substrate.
  note:
    type: string
    maxLength: 1024
    description: |
      Optional free-text note. Advisory only; MUST NOT contain
      secrets, tokens, credentials, or actor ids. G-1.0 does not
      enforce this prohibition mechanically.
  action_class_allowlist:
    type: array
    items:
      $ref: "#/$defs/action_class_grant"
    description: |
      v3 G-4 (additive, optional): the per-action allowlist read by the
      audit-overlay classifier. Each entry grants one `(op, mutation_class)`
      cell — the cells a faithfully-observed mutating agent action may perform
      WITHOUT escalation. Deny-by-default: a mutating op whose cell is absent is
      denied; reads are never gated and need no grant. Shape only — no host,
      path, credential, or account identifier. A record WITHOUT this field is a
      valid G-1.0 policy (the runtime simply grants no agent-action cells).
  gate_mode_ladder:
    $ref: "#/$defs/gate_mode_ladder"
    description: |
      v3 G-4 (additive, optional): the gate-mode ladder the audit-overlay
      `decide()` control-point resolves (OpenClaw exec-approvals modes + Zed
      precedence). Optional; when absent the safe `ask` default applies to every
      gateable cell.
  spend_envelopes:
    type: array
    items:
      $ref: "#/$defs/spend_envelope"
    description: |
      v3 G-5 (additive, optional): the nested deny-by-default spend envelopes
      (`global` -> `fleet` -> `run`, most-restrictive-wins). Shape only here — the
      admission-gate + circuit-breaker semantics live in `runner.spend_gate`; the
      `ce_spend_envelope` check enforces the cross-envelope predicates (a mandatory
      `global` `$` ceiling whenever any `$` envelope is declared; inner <= outer
      consistency; two-regime unit correctness). A record WITHOUT this field is a
      valid G-1.0/G-4 policy (no spend governance). Never a host / credential /
      account identifier.
  max_concurrent_runs:
    type: integer
    minimum: 1
    description: |
      v3 G-5 (additive, optional): the concurrency envelope dimension — the maximum
      number of runs admitted at once (a semaphore ceiling). Over-limit admission
      yields the `throttle` signal (retry with backoff), distinct from
      `budget_exhausted` (no retry). The live cross-process semaphore is deferred;
      this is the policy ceiling the pure `admit_concurrency` reads.
  model_rates:
    type: array
    items:
      $ref: "#/$defs/model_rate"
    description: |
      v3 G-5 (additive, optional): the per-model API-USD rate table the fleet (`$`)
      regime meters against. READ LIVE, NEVER HARDCODED — vendor rates / caps drift
      (e.g. the +50% weekly bump expiring 2026-07-13), so prices live in policy and
      are re-read each run, never baked into code. Prices are per-MTok ($ / 1e6
      tokens). Required only for the fleet (`$`) regime; the subscription `%`-seat
      regime needs none.
  spend_cap_enforcement:
    type: string
    enum: [enforce, off]
    default: enforce
    description: |
      v3 G-5 (additive, optional): the cost-enforcement opt-out lever — an
      OPERATOR-FACING, RATIFIED-HUMAN-ONLY choice (an agent can never set it; the
      gate is external to the agent). `enforce` (default): the spend CAPS are
      active. `off`: the opt-out — it disables the sub-allocated fleet / run budget
      CAPS (the friction) but NEVER the always-on runaway-DETECTION net (the
      mandatory `global` `$` ceiling + anomaly -> escalate stay on). `off` REQUIRES
      a `spend_cap_optout` ratification binding (the `ce_spend_envelope` check
      refuses an unratified opt-out — `VAL-SPEND-OPTOUT-UNRATIFIED`).
  spend_cap_optout:
    $ref: "#/$defs/spend_cap_optout"
    description: |
      v3 G-5 (additive, optional): the ratification binding REQUIRED when
      `spend_cap_enforcement` is `off`. Value-free opaque digests proving the
      opt-out was an explicit ratified human choice.
  resource_envelopes:
    type: array
    items:
      $ref: "#/$defs/resource_envelope"
    description: |
      v3.5-F (additive, optional): the OS-enforced per-seat / per-fleet
      resource envelopes (the memory axis of fleet resource hardening).
      Sibling of `spend_envelopes`: shape only here — the systemd-run
      bounding wrap that enforces them lives in the v1 launch mechanics
      (`resource_bound_spec`), which reads this policy through the
      existing policy-read seam. A record WITHOUT this field is a valid
      policy (no resource governance). Values are materialized into the
      policy by the installer / `ce doctor` host-class defaults — NEVER
      computed silently at launch. Never a host / credential / account
      identifier.
  resource_enforcement:
    type: string
    enum: [enforce, advisory, "off"]
    default: enforce
    description: |
      v3.5-F (additive, optional): the resource-enforcement lever, an
      OPERATOR-FACING, RATIFIED-HUMAN-ONLY choice mirroring
      `spend_cap_enforcement`. `enforce` (default): seat launches are
      wrapped in the OS bound and a host where user-level bounding is
      unavailable is REFUSED LOUDLY at launch. `advisory` / `off`: the
      explicit ratified opt-down — the seat launches UNBOUNDED and the
      launch evidence is stamped `resource_bound: none (<mode>)`. Both
      opt-downs REQUIRE a `resource_optout` ratification binding (the
      launch path refuses an unratified opt-down, fail-closed).
  resource_optout:
    $ref: "#/$defs/resource_optout"
    description: |
      v3.5-F (additive, optional): the ratification binding REQUIRED when
      `resource_enforcement` is `advisory` or `off`. Value-free opaque
      digests proving the opt-down was an explicit ratified human choice
      (mirrors `spend_cap_optout`).
$defs:
  agent_op:
    type: string
    enum: [read, write, exec, egress, secret, vcs]
    description: |
      The v3 G-4 operation/capability axis: the "do we gate?" axis. `read` is
      observe-only (never gated); the rest are gateable.
  agent_mutation_class:
    type: string
    enum: [docs, code, schema, deploy, governance, identity, security, attestation, redaction, none]
    description: |
      The v3 G-4 blast-radius/severity axis — the shared planning-layer
      mutation-class taxonomy (`checks.mutation_class`) plus `none`.
  action_class_grant:
    type: object
    required: [op, mutation_class]
    unevaluatedProperties: false
    properties:
      op:
        $ref: "#/$defs/agent_op"
      mutation_class:
        $ref: "#/$defs/agent_mutation_class"
    description: |
      One `(op, mutation_class)` allowlist grant.
  gate_mode_ladder:
    type: object
    unevaluatedProperties: false
    properties:
      default_mode:
        type: string
        enum: [deny, allowlist, ask, auto, full]
        description: |
          The fallback gate mode for any cell without an explicit override.
          `deny` (refuse), `allowlist` (use the classifier verdict), `ask`
          (escalate gateable actions for human confirmation), `auto`
          (advisory-only: may downgrade an escalate→allow but NEVER authorizes a
          deny-class action), `full` (YOLO — allow except built-in denies).
          Absent → the safe `ask` default.
      cells:
        type: array
        items:
          type: object
          required: [op, mutation_class, mode]
          unevaluatedProperties: false
          properties:
            op:
              $ref: "#/$defs/agent_op"
            mutation_class:
              $ref: "#/$defs/agent_mutation_class"
            mode:
              type: string
              enum: [deny, allowlist, ask, auto, full]
        description: |
          Per-`(op, mutation_class)` gate-mode overrides; a matching cell wins
          over `default_mode`.
      rules:
        type: array
        items:
          $ref: "#/$defs/gate_rule"
        description: |
          The `always_*` precedence rules (Zed: `always_deny` > `always_confirm`
          > `always_allow`, all beaten by the built-in deny tier).
    description: |
      The gate-mode ladder shape.
  gate_rule:
    type: object
    required: [effect]
    unevaluatedProperties: false
    properties:
      effect:
        type: string
        enum: [always_deny, always_confirm, always_allow]
        description: |
          The rule's effect, applied with Zed precedence (deny precedes).
      op:
        $ref: "#/$defs/agent_op"
      mutation_class:
        $ref: "#/$defs/agent_mutation_class"
      target_pattern:
        type: string
        minLength: 1
        description: |
          Optional substring matched against the action `target` (shape only —
          a pattern, never a concrete host/credential/account binding).
      require_different_approver:
        type: boolean
        description: |
          Lobster separation-of-duties (shape only): the human resolving an
          escalation under this rule MUST differ from the initiator.
      initiated_by:
        type: string
        minLength: 1
        description: |
          Optional opaque initiator reference (shape only; never a raw account).
      approved_by:
        type: string
        minLength: 1
        description: |
          Optional opaque approver reference (shape only; never a raw account).
    description: |
      One `always_*` precedence rule, optionally scoped by op / mutation_class /
      target_pattern, carrying the Lobster approver-identity fields (shape only).
  mount_entry:
    type: object
    required: [path, mode]
    unevaluatedProperties: false
    properties:
      path:
        type: string
        minLength: 1
        description: |
          Path to bind into the runtime. Relative paths are
          interpreted as repo-relative. The check refuses paths under
          the host home directory, container-engine sockets, and
          SSH/GPG agent sockets.
      mode:
        type: string
        enum: [ro, rw]
        description: |
          Mount mode. `ro` (read-only) is the default-safe posture;
          `rw` (read-write) REQUIRES `write_justification` — the check
          refuses an `rw` mount without one.
      write_justification:
        type: string
        minLength: 1
        description: |
          Required when `mode` is `rw`. Records the rationale for
          granting write access to this path.
  egress_rule:
    type: object
    required: [host]
    unevaluatedProperties: false
    properties:
      host:
        type: string
        minLength: 1
        description: |
          Target host pattern. Shape only — not a deployment host
          inventory. MUST NOT embed IP addresses or private hostnames
          as normative upstream bindings; those remain deployment-time
          overlay.
      port:
        type: integer
        minimum: 1
        maximum: 65535
        description: |
          Optional target port. When absent the rule applies to all
          ports on the named host.
      protocol:
        type: string
        enum: [tcp, udp, https, http, any]
        description: |
          Optional transport/application protocol. When absent the
          rule applies to all protocols.
      assurance:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [l4, l7]
        description: |
          Egress assurance axis (the secure-runtime egress contract).
          `l4` declares connection-level (host:port) enforcement; `l7`
          declares application-level (e.g. TLS-SNI / HTTP host)
          enforcement. An `l7` rule REQUIRES `tls_terminated: true`;
          the check enforces this. When absent, the check treats the
          rule as `l4`.
      binary_identity:
        type: string
        minLength: 1
        description: |
          Optional calling-binary identity axis: the identity of the
          in-runtime binary permitted to use this egress rule. Shape
          only; the concrete attestation mechanism is a later backend
          decision.
      tls_terminated:
        type: boolean
        description: |
          Whether the egress proxy terminates TLS for this rule.
          REQUIRED to be `true` for any rule whose `assurance`
          includes `l7`.
  spend_envelope:
    type: object
    required: [scope, amount, unit, window]
    unevaluatedProperties: false
    properties:
      scope:
        type: string
        enum: [global, fleet, run]
        description: |
          The envelope level. Nested deny-by-default `global` >= `fleet` >= `run`
          (most-restrictive-wins). A `global` `$` ceiling is mandatory whenever any
          `$` envelope is declared (the anti-catastrophe backstop).
      amount:
        type: number
        exclusiveMinimum: 0
        description: |
          The cap magnitude in `unit` (`$` for the fleet regime, `%` for the single
          subscription seat). Shape only; not a vendor price.
      unit:
        type: string
        enum: ["$", "%"]
        description: |
          `$` = API-USD (the fleet regime). `%` = single-seat utilization meter
          (the subscription regime — `run`-scoped only, never a `fleet` / `global`
          scope; a subscription seat is never a poolable fleet).
      window:
        type: string
        enum: [per_run, rolling_5h, rolling_weekly, total]
        description: |
          The accounting window the cap applies over (`per_run` / `total` for the
          `$` regime; `rolling_5h` / `rolling_weekly` for the `%`-seat meter).
      reset_anchor:
        type: string
        minLength: 1
        description: |
          Optional: the window reset anchor (shape only; the live wall-clock window
          bucketing is deferred).
      fleet_id:
        type: string
        minLength: 1
        description: |
          Optional: the fleet this envelope scopes (for `scope: fleet`). Shape only
          — never an account / host identifier.
  model_rate:
    type: object
    required: [model, input_per_mtok, output_per_mtok]
    unevaluatedProperties: false
    properties:
      model:
        type: string
        minLength: 1
      input_per_mtok:
        type: number
        minimum: 0
      output_per_mtok:
        type: number
        minimum: 0
      cache_read_per_mtok:
        type: number
        minimum: 0
        description: |
          Optional: the cache-read price per MTok. When absent the documented
          cache-read RATIO (0.1x input — a ratio, not an expiring absolute price)
          applies.
      cache_write_per_mtok:
        type: number
        minimum: 0
        description: |
          Optional: the cache-creation price per MTok. When absent the input rate
          applies (conservative).
    description: |
      One model's API-USD rate row. Prices are deployment / vendor data read live
      from policy — never baked into code.
  spend_cap_optout:
    type: object
    required: [ratified_prompt_sha, approver_ref]
    unevaluatedProperties: false
    properties:
      ratified_prompt_sha:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          The SHA256 digest of the ratified Operator prompt authorizing the
          opt-out — an opaque digest, never the prompt body.
      approver_ref:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          An OPAQUE digest standing in for the approving human actor. NEVER a raw
          account / login.
  resource_envelope:
    type: object
    required: [scope, memory_max]
    unevaluatedProperties: false
    properties:
      scope:
        type: string
        enum: [seat, fleet]
        description: |
          The envelope level. `seat`: applied to every launched seat scope
          (per-seat, not per-run — a seat outlives runs; RSS is a process
          property). `fleet`: the collective cap on the fleet slice that
          bounds the SUM of all seats (defense against N seats each
          individually under-cap).
      memory_high:
        type: string
        pattern: "^[0-9]+(K|M|G|T)?$"
        description: |
          Kernel reclaim brake (`MemoryHigh=`). A BRIEF brake only — set
          close to `memory_max` (~87%); a wide high->max gap with swap
          available creates a reclaim-stall zombie (observed), which is
          why this is not a parking state. systemd size string (bytes or
          K/M/G/T suffix).
      memory_max:
        type: string
        pattern: "^[0-9]+(K|M|G|T)?$"
        description: |
          Kernel group-kill ceiling (`MemoryMax=`). The unbypassable
          floor: at this limit the kernel kills the seat scope as a unit,
          in isolation — host and sibling seats untouched.
      memory_swap_max:
        type: string
        pattern: "^[0-9]+(K|M|G|T)?$"
        description: |
          Swap ceiling (`MemorySwapMax=`). Kept SMALL: it bounds the
          thrash/stall window (the observed reclaim-stall was swap-funded).
      tasks_max:
        type: integer
        minimum: 1
        description: |
          Task/pid ceiling (`TasksMax=`) — the fork-bomb stop. Healthy
          seats observed at ~30 pids; the default materialization uses 512
          (huge headroom, still a hard stop).
      cpu_weight:
        type: [integer, "null"]
        minimum: 1
        maximum: 10000
        description: |
          Optional Tier-A fair-share weight (`CPUWeight=`). CPU is a
          niceness axis, not a crash axis — advisory-tier. `null` / absent
          = omit the property.
      cpu_quota:
        type: [string, "null"]
        pattern: "^[0-9]+%$"
        description: |
          Optional Tier-A hard CPU ceiling (`CPUQuota=`, e.g. "200%").
          Left unset by default on desktops. `null` / absent = omit the
          property.
    description: |
      One resource envelope (the systemd cgroup-v2 property set the
      bounding wrap applies). Shape only — never a host / credential /
      account identifier.
  resource_optout:
    type: object
    required: [ratified_prompt_sha, approver_ref]
    unevaluatedProperties: false
    properties:
      ratified_prompt_sha:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          The SHA256 digest of the ratified Operator prompt authorizing the
          resource-enforcement opt-down — an opaque digest, never the
          prompt body.
      approver_ref:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          An OPAQUE digest standing in for the approving human actor. NEVER a raw
          account / login.
