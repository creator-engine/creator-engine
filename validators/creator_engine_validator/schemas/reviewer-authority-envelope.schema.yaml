$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/reviewer-authority-envelope.schema.yaml"
title: "Creator Engine reviewer-venue side-effect-authority envelope"
description: >-
  G2.007.2 bounded, auditable authority envelope that lets a distinct CE-governed reviewer
  venue legitimately perform exactly one restricted mechanic (pr_review) on exactly one PR.
  It is the sanctioned replacement for the old loose side_effect_authority token: the
  Ring-2 hook (hook_check) honors it only when the classified restricted mechanic equals
  `mechanic` AND the command's target PR equals `pr_number`. The head_sha, actor, and
  ratified_prompt_sha bind the grant for audit (recorded; the venue honors them). No
  credential/secret values; the actor is a login name, never a token.
type: object
oneOf:
  - required: [reviewer_authority_envelope]
properties:
  reviewer_authority_envelope:
    $ref: "#/$defs/reviewer_authority_envelope"
additionalProperties: false
$defs:
  timestamp:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  reviewer_authority_envelope:
    type: object
    required: [envelope_id, mechanic, pr_number, head_sha, actor, ratified_prompt_sha, emitting_role, operating_mode, recorded_at]
    additionalProperties: false
    properties:
      envelope_id:
        type: string
        pattern: "^rva-[a-z0-9][a-z0-9-]{3,96}$"
      mechanic:
        type: string
        enum: [pr_review]
      pr_number:
        type: integer
        minimum: 1
      head_sha:
        type: string
        pattern: "^[0-9a-f]{7,40}$"
      actor:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,38}$"
      ratified_prompt_sha:
        type: string
        pattern: "^[0-9a-f]{64}$"
      emitting_role:
        type: string
        enum: [operator, controller, architect, implementer, reviewer, verification, agent_reviewer]
      operating_mode:
        type: string
        enum: [strict, auto, transcendence]
      recorded_at:
        $ref: "#/$defs/timestamp"
      metadata:
        type: object
        additionalProperties: true
