$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/identity-record.schema.yaml"
title: "Creator Engine Tenant Identity Record"
type: object
required:
  - tenant_id
  - source_host
  - source_host_installation_id
  - agent_app_slug
  - agent_actor_id
  - runtime_tool
  - role_category
  - authority_context
  - human_ratifier_roles
  - mutation_classes
  - allowed_repositories
  - signing_policy
  - attestation_storage_path
  - ratification_storage_path
  - redaction_storage_path
unevaluatedProperties: false
properties:
  tenant_id:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    minLength: 1
  source_host:
    type: string
    enum: [github]
  source_host_installation_id:
    type: string
    minLength: 1
  agent_app_slug:
    type: string
    minLength: 1
  agent_actor_id:
    type: string
    minLength: 1
  runtime_tool:
    type: string
    minLength: 1
  role_category:
    type: string
    enum: [source, ratifier, reviewer, architect, implementer, verifier, observer]
  authority_context:
    type: object
    required: [description, governing_spec_refs, ratifier_authority_refs]
    unevaluatedProperties: false
    properties:
      description:
        type: string
        minLength: 1
      governing_spec_refs:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      ratifier_authority_refs:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
  human_ratifier_roles:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  mutation_classes:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
  allowed_repositories:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  signing_policy:
    type: object
    required: [commit_signing_required, commit_signing_method, attestation_signing_required]
    unevaluatedProperties: false
    properties:
      commit_signing_required:
        type: boolean
      commit_signing_method:
        type: string
        enum: [gpg, ssh, none]
      attestation_signing_required:
        type: boolean
    allOf:
      - if:
          properties:
            commit_signing_required:
              const: true
          required: [commit_signing_required]
        then:
          properties:
            commit_signing_method:
              enum: [gpg, ssh]
  attestation_storage_path:
    type: string
    minLength: 1
  ratification_storage_path:
    type: string
    minLength: 1
  redaction_storage_path:
    type: string
    minLength: 1
  platform_identity_ref:
    type: string
    minLength: 1
