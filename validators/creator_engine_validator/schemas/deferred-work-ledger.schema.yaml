$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/deferred-work-ledger.schema.yaml"
title: "Creator Engine Deferred-Work Ledger"
description: |
  Repository-tracked, machine-readable inventory for agent-resolvable residue.
  This ledger is not an awaiting-operator queue: human decisions belong to the
  separate human-decision process. Every entry records provenance, a vision.md
  scope pointer, a four-way triage state, and evidence that it was read back.
type: object
additionalProperties: false
required: [kind, schema_version, read_back_max_age_days, entries]
properties:
  kind:
    const: deferred-work-ledger
  schema_version:
    const: "1"
  read_back_max_age_days:
    type: integer
    minimum: 1
    maximum: 90
    description: Maximum permitted age of an entry's last_read_at timestamp.
  entries:
    type: array
    items:
      $ref: "#/$defs/entry"
$defs:
  timestamp:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
  entry:
    type: object
    additionalProperties: false
    required:
      - id
      - triage_state
      - summary
      - provenance
      - scope_ref
      - created_at
      - triaged_at
      - last_read_at
      - read_back_marker
    properties:
      id:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{2,95}$"
      triage_state:
        enum: [already-resolved, buildable-bundle, blocked, human]
      summary:
        type: string
        minLength: 1
      provenance:
        type: object
        additionalProperties: false
        required: [source_kind, source_ref]
        properties:
          source_kind:
            enum: [review, pull-request, seal]
          source_ref:
            type: string
            minLength: 1
      scope_ref:
        type: string
        pattern: "(^|/)vision\\.md(#.*)?$"
      created_at:
        $ref: "#/$defs/timestamp"
      triaged_at:
        $ref: "#/$defs/timestamp"
      last_read_at:
        $ref: "#/$defs/timestamp"
      read_back_marker:
        type: string
        minLength: 1
