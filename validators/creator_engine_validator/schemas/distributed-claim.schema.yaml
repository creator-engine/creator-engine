$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://creator-engine.local/schemas/distributed-claim.schema.yaml"
title: "Creator Engine distributed claim record substrate"
description: >-
  G2.004.2 schema for shape-only distributed claim records. A distributed claim is
  the cross-repo / team-mode coordination claim primitive — the distributed
  analogue of a single-repo PCL lane claim. Claims are content-addressed and
  hash-chained and are discriminated by record_kind. Distributed claims never
  ratify; agent_ratifier stays reserved-inactive and cannot emit. A claim binds to
  a federated identity binding and may reference CE-event blocks and PCL records,
  but only by opaque 64-hex content hashes carried in the body — the substrate
  imports no federated-identity, CE-event, or PCL code/schema and carries no
  runtime dependency on those gates. Live claim acquisition/release runtime,
  .ce/ live writes, signing, and key custody remain deferred to a later,
  separately ratified gate.
type: object
oneOf:
  - required: [distributed_claim]
  - required: [distributed_claim_chain]
properties:
  distributed_claim:
    $ref: "#/$defs/record"
  distributed_claim_chain:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/record"
additionalProperties: false
$defs:
  hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
  timestamp:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  record:
    type: object
    required: [record_id, record_kind, sequence, parent_hash, content_hash, emitting_role, operating_mode, recorded_at, body, signature]
    properties:
      record_id:
        type: string
        pattern: "^dc-[a-z0-9][a-z0-9-]{3,96}$"
      record_kind:
        type: string
        enum: [claim_open, claim_renew, claim_release]
      sequence:
        type: integer
        minimum: 0
      parent_hash:
        anyOf:
          - $ref: "#/$defs/hash"
          - type: "null"
      content_hash:
        $ref: "#/$defs/hash"
      emitting_role:
        type: string
        enum: [operator, controller, architect, implementer, reviewer, verification, agent_reviewer]
      operating_mode:
        type: string
        enum: [strict, auto, transcendence]
      recorded_at:
        $ref: "#/$defs/timestamp"
      body:
        type: object
        additionalProperties: true
      signature:
        type: object
        required: [scheme, key_id, value]
        properties:
          scheme:
            type: string
            enum: [reserved-shape-only]
          key_id:
            type: string
            minLength: 1
          value:
            type: string
            enum: [reserved-inactive]
        additionalProperties: false
    additionalProperties: false
