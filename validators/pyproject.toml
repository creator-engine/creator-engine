[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-engine-validator"
version = "0.3.1"
description = "Offline validator for the Creator Engine v0.1 governance substrate"
requires-python = ">=3.14"
dependencies = [
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[project.scripts]
creator-engine-validator = "creator_engine_validator.cli:main"
ce = "creator_engine_validator.ce_cli:main"
# v3 G-7: the DISTINCT v3 work-driving entry point, added alongside the retained
# v1 ``ce`` launcher (additive; never a subcommand on ``ce``/``ce_cli``).
cev3 = "creator_engine_validator.v3_cli:main"

# v3.5-B.1 (Fork F-a, ratified): the Cockpit TUI deps land as an OPTIONAL extra —
# the core install surface stays PyYAML+jsonschema only; non-cockpit installs pay
# zero cost. CI exercises the pinned transitive closure OFFLINE via
# requirements-dev.txt + the vendored wheelhouse-dev/ (no validate.yml edit).
[project.optional-dependencies]
cockpit = [
  "textual==8.2.7",
  "watchfiles==1.2.0",
]
# v3.5-B.6: `ce cockpit --serve` — the serve mechanism ships in textual-serve
# (NOT Textual core) and brings the aiohttp web ecosystem; its own extra keeps
# the plain-TUI install serve-free (serve is additive). Pinned closure vendored
# in wheelhouse-dev/ for CI's offline exercise, same as the cockpit extra.
cockpit-serve = [
  "textual-serve==1.1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["creator_engine_validator", "creator_engine_validator.*"]

# ce-ops#331: the JSON-schema YAML files are packaged DATA shipped inside the wheel
# at ``creator_engine_validator/schemas/``. They previously lived only at the repo
# root (one level above this ``validators/`` build root), so they were never included
# in the sdist/wheel and every schema-validating CLI (``ce brain init`` and the rest)
# crashed with ``No such file or directory`` in any installed, non-source-checkout
# environment. A repo-root ``schemas`` symlink keeps repo-root-relative dev/CI tooling
# unchanged; the resolver (`schema.py:_resolve_schema_path`) anchors to this packaged
# directory so it is robust in both a source tree and an installed wheel.
[tool.setuptools.package-data]
creator_engine_validator = ["schemas/*.schema.yaml", "forge/*.yaml"]

[tool.pytest.ini_options]
markers = [
  "slow: integration/live/long-running tests excluded from the fast unit lane",
  "integration: tests that exercise CLI/runtime integration surfaces",
]
