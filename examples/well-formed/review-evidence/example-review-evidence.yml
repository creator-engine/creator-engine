evidence_id: example-review-evidence
reviewed_artifact_refs:
  - specs/001-v0-1-governance-substrate/spec.md
  - docs/delivery/REVIEW_EVIDENCE_TEMPLATE.md
reviewed_diff_or_commit_ref: example/pre-merge-diff
reviewer_identity_ref: tenants/example-tenant/reviewer/identity-record.yml
reviewer_role_category: reviewer
reviewer_model: reviewer-model-example
authorship_obfuscated: false
adversarial_prompt: false
review_mode: manual_human
review_scope: >-
  In scope: the listed reviewed_artifact_refs and the diff range
  named by reviewed_diff_or_commit_ref. Out of scope: privileged
  downstream envelopes which require separate Source ratification.
mutation_classes_under_review:
  - docs
  - schema
prohibited_surfaces_checked:
  - live_repository_settings
  - branch_protection
  - deploy_automation
  - codeowners
  - secrets_or_tokens
  - instance_local_paths
validation_evidence_refs:
  - examples/well-formed
findings: >-
  Reviewer confirmed that the reviewed artifacts preserve the
  upstream review-evidence prose semantics, do not promote concrete
  tool/model/host/account bindings into upstream constants, and do
  not include real secrets, tokens, source-host installation ids,
  durable actor ids, app slugs, account names, or machine-local
  absolute paths.
blocking_findings: []
non_blocking_findings:
  - artifact_ref: specs/001-v0-1-governance-substrate/spec.md
    observation: >-
      Wording in one paragraph could be tightened in a future
      editorial pass.
    advisory_follow_up: >-
      Track the editorial pass under a future bounded docs-only
      envelope; not blocking.
verdict: no_blocking_findings
recommended_follow_up: >-
  Continue to defer privileged identity, deploy, and governance
  mutations to their own Source-ratified envelopes.
evidence_timestamp: source-controlled:examples/well-formed/review-evidence/example-review-evidence.yml
non_ratification_statement: >-
  This review evidence is NOT Source ratification and does not
  authorize merge, deploy, branch deletion, branch protection
  mutation, or live repository-settings change. Privileged
  mutation classes remain Source-ratified regardless of this
  verdict.
