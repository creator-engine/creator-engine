kind: worker-container-policy-record
record_type: worker_container_policy
schema_version: "1"
policy_id: bad-controller-key-secret-v1
policy_sha: "dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
role: implementer
runtime_engine: podman-rootless
image_ref:
  name: ghcr.io/creator-engine/implementer:latest
  sha: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
mount_manifest:
  - path: /worktrees/my-feature
    mode: rw
    write_justification: "allocated worktree"
egress_allowlist: []
secret_allowlist:
  - model-provider-key
  - controller-private-key
  # PCO-045: the Slice 2.5 controller-key private key MUST NOT be injected
  # into any worker container. Workers never sign leases; only the Controller
  # signs. This is the strongest mechanical enforcement of controller identity
  # being bound outside the worker.
grant_extensible: false
grant_authority: controller
