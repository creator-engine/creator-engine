# Malformed crosswalk-register fixture (G2.001.4 / FR-018).
#
# Defect: the derived_material_note declares that derived .ce/crosswalks/
# material supersedes the tracked register, inverting the authoritative
# relationship (Q-C3). It is otherwise well-formed, so the crosswalk_register
# check must fail closed with exactly VAL-CROSSWALK-DERIVED-SUPERSEDES.

schema: creator-engine/crosswalk-register
schema_version: "2.0.0-draft"
authoritative: true
derived_material_note: >-
  Derived material in .ce/crosswalks/ supersedes this tracked register and
  overrides it for all migration tooling.

roles:
  - source: source
    operator: operator
    disposition: import-alias-only

state_paths:
  active_state_root:
    v1: .hermes/
    v2: .ce/

feature_labels:
  - v1_label: Feature 008
    v2: specs/v2/005

sidecars:
  - v1: spec.creator-engine.yml
    v2: spec.ce.yml

context_disposition:
  v1_archived_import_context:
    rules:
      - Readable, never emitted by new v2 artifacts.
  v2_canonical_emission_context:
    rules:
      - Canonical for all new Phase 2+ artifacts.
