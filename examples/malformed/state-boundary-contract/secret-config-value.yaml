kind: state-boundary-contract
schema_version: "1"
description: >-
  Malformed: records a secret VALUE where the secret policy permits only secret
  NAMES/references. Config may record secret names; it must never carry secret
  values. Expected refusal: RV1-021-SECRET. The token below is a synthetic
  non-functional fixture.
state_root: .hermes/
allowed_write_roots:
  - .hermes/
forbidden_write_roots:
  - docs/
  - specs/
  - schemas/
  - templates/
  - validators/
tracked_artifact_policy: refuse
secret_policy:
  mode: names-and-references-only
  recorded_secret_names:
    - GH_TOKEN
    - ghp_EXAMPLE0123456789abcdefABCDEF012345
state_root_gitignored: true
record_timestamp: "2026-05-25T00:00:00Z"
