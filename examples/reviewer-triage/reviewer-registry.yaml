kind: reviewer-registry
schema_version: "1"
mutation_class: governance
reviewers:
  - reviewer_id: reviewer-a
    human_id: human-reviewer-a
    controller_id: ce-reviewer-a
    venue_kind: agentic
    allowed_harnesses: [codex]
    source_host_identities:
      logins: [reviewer-a]
      teams: [ce-reviewers]
      app_installation_ids: []
      bot_slugs: []
    identity_ref: tenants/creator-engine/reviewers/reviewer-a.yml
    allowed_repositories: [creator-engine/creator-engine]
    capabilities:
      languages: [python]
      mutation_classes: [code, schema, docs, governance]
      risk_tiers: [low, medium, high, privileged]
      security: true
      deploy: true
      schema: true
      readability: true
    ownership:
      codeowners: [reviewer-a]
      teams: [ce-reviewers]
      path_globs: [validators/**, schemas/**, docs/**]
      area_owner_refs: []
    availability:
      status: available
      time_zone: UTC
      working_hours: declared-durable
      max_active_reviews: 2
      active_reviews: 0
      backup_reviewer_ids: []
    isolation_domain_attestation:
      forge_principal: reviewer-a
      credential_domain_ref: credential-reviewer-a
      os_user_ref: os-user-reviewer-a
      controller_principal_ref: ce-reviewer-a
      execution_sandbox_ref: sandbox-reviewer-a
      containment_ref: containment-reviewer-a
      host_ref: ce-pilot-1
      computed_tier: tier-2
      containment_status: enforced
      evidence_timestamp: "2026-06-18T00:00:00Z"
      source: reviewer-registry-example
    policy_refs: [ce-ops#120]
