      reviewer: read-only
      verification: read-only
  vps-tmux:
    codex_binary_template: /opt/creator-engine/codex/{version}/bin/codex
    outer_isolation_attestation: null
    role_sandboxes:
      architect_research: null
      implementer: null
      reviewer: null
      verification: null
  dev1-local:
    codex_binary_template: /opt/creator-engine/codex/{version}/bin/codex
    outer_isolation_attestation: null
    role_sandboxes:
      architect_research: read-only
      implementer: null
      reviewer: read-only
      verification: read-only
  in-seat:
    codex_binary_template: /opt/creator-engine/codex/{version}/bin/codex
    outer_isolation_attestation: null
    role_sandboxes:
      architect_research: null
      implementer: null
      reviewer: null
      verification: null
model_defaults:
  model: gpt-5.6-terra
  effort: high
canonical_add_dirs:
  - governance
  - validators
runtime_policy_binding:
