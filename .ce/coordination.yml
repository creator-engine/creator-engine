# Creator Engine repo coordination policy — governance-as-data (v3.5-C A-C3,
# design §A.5). Validated by the `peer_authority` check against
# `schemas/coordination-policy.schema.yaml`; prose contract
# `docs/contracts/peer-authority.md`.
#
# SELF-CLASSIFIED `governance` (privileged): changing this authority map
# requires the full privileged ratification bar — for two peers, BOTH must
# ratify. The authority model cannot be unilaterally rewritten.
kind: coordination-policy
schema_version: "1"
mutation_class: governance

ratification_authority:
  # Area ownership defers to .github/CODEOWNERS (enforced on the forge via
  # require_code_owner_reviews); the explicit entries below are the
  # jointly-owned decision surfaces (design §A.5: decisions are jointly owned).
  defer_to_codeowners: true
  area_owners:
    "docs/decisions/**": [peer-operator]
    "docs/rfcs/**": [peer-operator]
  quorum_by_tier:
    non_privileged: 1   # the area owner ratifies solo (constrained-BDFL of the area)
    privileged: 2       # consensus-on-high-risk: both peers (PRIVILEGED_NAMES)
  no_self_approval: true

# The {actor → human} resolver (the §11.5 identity-resolution gap, shipped
# HONESTLY): quorums count humans, not accounts. Today this repo has ONE
# resolved human — the Operator — holding both GitHub accounts (the authoring
# `ce-overwatch` and the reviewer-venue `ce-dev-2`): token/account
# separation alone is NOT sufficient (CE's own rule), so both logins map to
# the same human_id and can never sum to a privileged quorum of 2. This is
# §A.5's N=1 special case (constrained-BDFL): privileged ratification is the
# Operator's, recorded HONESTLY as `quorum: n1_solo` on the ratification record
# (the new N1-CARVEOUT recording mode) — NEVER as a quorum of 2, and never by
# laundering the two accounts into two ratifiers. `quorum_by_tier.privileged`
# stays 2 (the team-mode bar is unchanged): `n1_solo` is a mode on the record,
# not a policy downgrade, and it AUTO-EXPIRES the instant a second human
# resolves. The second `humans` slot is filled when a REAL second peer joins
# (the VPS team-mode trial); until then any record claiming two-peer quorum
# through these two accounts — or any privileged solo record omitting
# `quorum: n1_solo` — FAILS the check (the dishonesty it exists to catch).
identity_map:
  humans:
    - human_id: peer-operator
      # current logins first; the trailing two are pre-2026-06-20-rename aliases
      # (SAME account ids) kept so historical ratifiers still resolve — e.g.
      # ADR-0001 `ratified_by: chmod735` (history is not rewritten). All map to
      # the one human, so they can never sum to a privileged quorum of 2.
      github_logins: [ce-overwatch, ce-dev-2, chmod735, ubuntuaws745-cmyk]
      seats: []
      app_installations: []
