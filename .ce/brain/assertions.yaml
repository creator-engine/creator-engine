- claim:
    fact: 'GOTCHA: any outward-facing doc-grounded / customer-support agent must ground
      via docs-as-skills (load specific allowlisted doc files on demand) rather than
      RAG/embedding-retrieval or context-stuffing, so it cites the EXACT source file+section
      it loaded (deterministic, verifiable provenance). This is the load-bearing mechanism
      that makes a hard cite-or-refuse / I-do-not-know contract ENFORCEABLE, gives
      a verifiable user trail, enforces confidentiality at bundle-build time (cannot
      leak what was never loaded), and makes freshness checkable (doc-sha + release-parity
      guard). The naive build reaches for RAG/embeddings, whose fuzzy provenance lets
      the model hallucinate sources; without deterministic citations cite-or-refuse
      is unenforceable and hallucinated install steps / invented sources become the
      dominant customer-facing failure mode. See .ce/brain/notes/deterministic-citations.md;
      provenance: support-agent plan section 2b.'
    object: deterministic_citations_via_docs_as_skills
    predicate: requires
