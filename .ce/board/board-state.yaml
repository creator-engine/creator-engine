# CE org project board desired-state
# Board: github.com/orgs/creator-engine/projects/1
#
# The controller edits this file at arc boundaries; `ce board sync` makes the
# board match it.  Orphan items (on the board but not listed here) are reported
# in the drift report and are never deleted by the sync.
#
# SETUP — discover node IDs once per project (replace all placeholder values):
#
#   # Discover project_id + status_field_id + status option ids:
#   gh api graphql -f query='
#     query {
#       organization(login: "creator-engine") {
#         projectV2(number: 1) {
#           id
#           fields(first: 20) {
#             nodes {
#               ... on ProjectV2SingleSelectField {
#                 id name
#                 options { id name }
#               }
#             }
#           }
#         }
#       }
#     }'
#
#   # Discover issue node_id for a given issue (for manual checks only;
#   # the sync resolves them automatically via the REST API):
#   gh api repos/creator-engine/ce-ops/issues/617 --jq '.node_id'

project_id: "PVT_kwDOAAAAAAAAAAA"             # replace with org project PVT_… node id
status_field_id: "PVTSSF_lADOAAAAAAAAAA"       # replace with Status field PVTSSF_… node id

# Single-select Status column option ids.
# Replace placeholder values with ids discovered by the query above.
status_options:
  "Backlog":   "placeholder-opt-backlog"
  "Planned":   "placeholder-opt-planned"
  "In flight": "placeholder-opt-inflight"
  "Done":      "placeholder-opt-done"
  "Blocked":   "placeholder-opt-blocked"

# ---------------------------------------------------------------------------
# Desired board item states.
# Each entry references a GitHub issue and declares its target Status column.
# The 'label' field is a human annotation only — it is ignored by the sync.
# ---------------------------------------------------------------------------
